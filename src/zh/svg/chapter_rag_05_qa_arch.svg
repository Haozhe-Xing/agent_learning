<svg xmlns="http://www.w3.org/2000/svg" width="800" height="610" viewBox="0 0 800 610" role="img" aria-label="本地 QA：阶段成功与任务完成分别判断">
<title>本地 QA：阶段成功与任务完成分别判断</title><desc>固定资料 + 原始问题 → 词法检索与摘录；原文支撑、冻结要点另行检查。</desc>
<rect width="800" height="610" rx="16" fill="#f8fafc"/>
<g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="28" y="37" font-size="22" fill="#1e293b" font-weight="600" text-anchor="start">本地 QA：阶段成功与任务完成分别判断</text><text x="28" y="64" font-size="13" fill="#475569" font-weight="400" text-anchor="start">固定资料 + 原始问题 → 词法检索与摘录；原文支撑、冻结要点另行检查。</text><rect x="28" y="92" width="232" height="147" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="44" y="121" font-size="16" fill="#2563eb" font-weight="600" text-anchor="start">rank</text><text x="44" y="148" font-size="14" fill="#475569" font-weight="400" text-anchor="start">document / score</text><text x="44" y="171" font-size="14" fill="#475569" font-weight="400" text-anchor="start">matched_terms：命中原因</text><text x="44" y="194" font-size="14" fill="#475569" font-weight="400" text-anchor="start">无命中：no_evidence</text><text x="44" y="217" font-size="14" fill="#475569" font-weight="400" text-anchor="start">最低匹配规则不证明答案</text><rect x="284" y="92" width="232" height="147" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="300" y="121" font-size="16" fill="#2563eb" font-weight="600" text-anchor="start">ask：生成</text><text x="300" y="148" font-size="14" fill="#475569" font-weight="400" text-anchor="start">默认带标签的原文摘录</text><text x="300" y="171" font-size="14" fill="#475569" font-weight="400" text-anchor="start">可注入固定错误输出测试</text><text x="300" y="194" font-size="14" fill="#475569" font-weight="400" text-anchor="start">空值/异常：generation_failed</text><text x="300" y="217" font-size="14" fill="#475569" font-weight="400" text-anchor="start">文档仍是参考数据</text><rect x="540" y="92" width="232" height="147" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="556" y="121" font-size="16" fill="#2563eb" font-weight="600" text-anchor="start">QA 类内检查</text><text x="556" y="148" font-size="14" fill="#475569" font-weight="400" text-anchor="start">引用标签 + 可选 verifier</text><text x="556" y="171" font-size="14" fill="#475569" font-weight="400" text-anchor="start">失败：verification_failed</text><text x="556" y="194" font-size="14" fill="#475569" font-weight="400" text-anchor="start">通过：answered</text><text x="556" y="217" font-size="14" fill="#475569" font-weight="400" text-anchor="start">不等于通用答案正确</text><path d="M260 165H279 M273 160L279 165L273 170" stroke="#64748b" stroke-width="2" fill="none"/><path d="M516 165H535 M529 160L535 165L529 170" stroke="#64748b" stroke-width="2" fill="none"/><rect x="28" y="271" width="360" height="139" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="44" y="300" font-size="16" fill="#15803d" font-weight="600" text-anchor="start">check_excerpts</text><text x="44" y="327" font-size="14" fill="#475569" font-weight="400" text-anchor="start">逐行核对实际命中的原文</text><text x="44" y="350" font-size="14" fill="#475569" font-weight="400" text-anchor="start">[source] 摘录格式与词项交集</text><text x="44" y="373" font-size="14" fill="#475569" font-weight="400" text-anchor="start">编造/未知来源/无关摘录拒绝</text><text x="44" y="396" font-size="14" fill="#475569" font-weight="400" text-anchor="start">只接受本练习的原文摘录合同</text><rect x="412" y="271" width="360" height="139" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="428" y="300" font-size="16" fill="#b45309" font-weight="600" text-anchor="start">check_question_coverage</text><text x="428" y="327" font-size="14" fill="#475569" font-weight="400" text-anchor="start">独立冻结问题与必答要点</text><text x="428" y="350" font-size="14" fill="#475569" font-weight="400" text-anchor="start">缺要点：failed + missing_points</text><text x="428" y="373" font-size="14" fill="#475569" font-weight="400" text-anchor="start">自由问题无判据：unknown</text><text x="428" y="396" font-size="14" fill="#475569" font-weight="400" text-anchor="start">字面规则不是通用语义判卷</text><path d="M144 240V256H208V270 M656 240V256H592V270" fill="none" stroke="#64748b" stroke-width="2"/><rect x="28" y="439" width="744" height="102" rx="12" fill="#eff6ff" stroke="#cbd5e1"/><text x="44" y="468" font-size="16" fill="#2563eb" font-weight="600" text-anchor="start">最终 accepted 必须同时满足</text><text x="44" y="495" font-size="14" fill="#475569" font-weight="400" text-anchor="start">QA 执行与配置检查通过  +  原文支撑通过  +  本题覆盖通过</text><text x="44" y="518" font-size="14" fill="#475569" font-weight="400" text-anchor="start">任一失败或覆盖 unknown → 保留原因与缺失信息，不交付为完成。</text><text x="28" y="580" font-size="14" fill="#475569" font-weight="400" text-anchor="start">本节为词法基线；6.3 / 6.4 向量机制尚无组合适配器。</text></g></svg>
