<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-label="LCEL：组合接口与实际运行边界">
<title>LCEL：组合接口与实际运行边界</title><desc>| 连接兼容的数据；每个组件的流式、重试与取消能力要分别验证。</desc>
<rect width="800" height="520" rx="16" fill="#f8fafc"/>
<g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<text x="28" y="37" font-size="22" fill="#1e293b" font-weight="600" text-anchor="start">LCEL：组合接口与实际运行边界</text><text x="28" y="63" font-size="13" fill="#475569" font-weight="400" text-anchor="start">| 连接兼容的数据；每个组件的流式、重试与取消能力要分别验证。</text><rect x="28" y="91" width="156" height="89" rx="12" fill="#eff6ff" stroke="#93c5fd"/><text x="106" y="122" font-size="15" fill="#2563eb" font-weight="600" text-anchor="middle">请求</text><text x="106" y="154" font-size="14" fill="#475569" font-weight="400" text-anchor="middle">dict</text><path d="M184 136H217 M211 131L217 136L211 141" fill="none" stroke="#64748b" stroke-width="2"/><rect x="224" y="91" width="156" height="89" rx="12" fill="#eff6ff" stroke="#93c5fd"/><text x="302" y="122" font-size="15" fill="#2563eb" font-weight="600" text-anchor="middle">提示模板</text><text x="302" y="154" font-size="14" fill="#475569" font-weight="400" text-anchor="middle">PromptValue</text><path d="M380 136H413 M407 131L413 136L407 141" fill="none" stroke="#64748b" stroke-width="2"/><rect x="420" y="91" width="156" height="89" rx="12" fill="#eff6ff" stroke="#93c5fd"/><text x="498" y="122" font-size="15" fill="#2563eb" font-weight="600" text-anchor="middle">固定聊天模型</text><text x="498" y="154" font-size="14" fill="#475569" font-weight="400" text-anchor="middle">AIMessage</text><path d="M576 136H609 M603 131L609 136L603 141" fill="none" stroke="#64748b" stroke-width="2"/><rect x="616" y="91" width="156" height="89" rx="12" fill="#eff6ff" stroke="#93c5fd"/><text x="694" y="122" font-size="15" fill="#2563eb" font-weight="600" text-anchor="middle">文本解析器</text><text x="694" y="154" font-size="14" fill="#475569" font-weight="400" text-anchor="middle">str</text><rect x="28" y="202" width="360" height="112" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="46" y="231" font-size="16" fill="#2563eb" font-weight="600" text-anchor="start">类型边界</text><text x="46" y="257" font-size="14" fill="#475569" font-weight="400" text-anchor="start">with_types 描述类型</text><text x="46" y="280" font-size="14" fill="#475569" font-weight="400" text-anchor="start">实际运行校验需显式实现</text><rect x="412" y="202" width="360" height="112" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="430" y="231" font-size="16" fill="#2563eb" font-weight="600" text-anchor="start">流式边界</text><text x="430" y="257" font-size="14" fill="#475569" font-weight="400" text-anchor="start">阻塞组件可能先收齐输入</text><text x="430" y="280" font-size="14" fill="#475569" font-weight="400" text-anchor="start">stream 不保证逐 token 输出</text><rect x="28" y="332" width="360" height="112" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="46" y="361" font-size="16" fill="#2563eb" font-weight="600" text-anchor="start">恢复边界</text><text x="46" y="387" font-size="14" fill="#475569" font-weight="400" text-anchor="start">只重试允许的异常，限制次数</text><text x="46" y="410" font-size="14" fill="#475569" font-weight="400" text-anchor="start">首块后失败不能拼接备用答案</text><rect x="412" y="332" width="360" height="112" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="430" y="361" font-size="16" fill="#2563eb" font-weight="600" text-anchor="start">并发与取消</text><text x="430" y="387" font-size="14" fill="#475569" font-weight="400" text-anchor="start">max_concurrency 限制本次批量</text><text x="430" y="410" font-size="14" fill="#475569" font-weight="400" text-anchor="start">取消等待不保证停止外部执行</text><text x="28" y="492" font-size="14" fill="#475569" font-weight="400" text-anchor="start">输出格式有效、执行结束与任务验收通过，应保留为不同状态。</text></g></svg>
