<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-label="组件能做什么，宿主还要负责什么">
<title>组件能做什么，宿主还要负责什么</title><desc>本章锁定 LangChain 1.4.6；以下是接口职责图，不是部署拓扑。</desc>
<rect width="800" height="520" rx="16" fill="#f8fafc"/>
<g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<text x="28" y="37" font-size="22" fill="#1e293b" font-weight="600" text-anchor="start">组件能做什么，宿主还要负责什么</text><text x="28" y="63" font-size="13" fill="#475569" font-weight="400" text-anchor="start">本章锁定 LangChain 1.4.6；以下是接口职责图，不是部署拓扑。</text><rect x="28" y="88" width="360" height="133" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="46" y="117" font-size="16" fill="#2563eb" font-weight="600" text-anchor="start">langchain-core</text><text x="46" y="143" font-size="14" fill="#475569" font-weight="400" text-anchor="start">提示模板 / 消息 / 解析器</text><text x="46" y="166" font-size="14" fill="#475569" font-weight="400" text-anchor="start">Runnable：顺序、分支、并行</text><text x="46" y="189" font-size="14" fill="#475569" font-weight="400" text-anchor="start">相同接口仍需检查输入输出类型</text><rect x="412" y="88" width="360" height="133" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="430" y="117" font-size="16" fill="#2563eb" font-weight="600" text-anchor="start">langchain</text><text x="430" y="143" font-size="14" fill="#475569" font-weight="400" text-anchor="start">create_agent：模型与工具循环</text><text x="430" y="166" font-size="14" fill="#475569" font-weight="400" text-anchor="start">middleware：明确配置的拦截点</text><text x="430" y="189" font-size="14" fill="#475569" font-weight="400" text-anchor="start">循环结束不代表业务验收通过</text><rect x="28" y="242" width="360" height="133" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="46" y="271" font-size="16" fill="#2563eb" font-weight="600" text-anchor="start">提供者适配包</text><text x="46" y="297" font-size="14" fill="#475569" font-weight="400" text-anchor="start">langchain-openai 1.7.2 等</text><text x="46" y="320" font-size="14" fill="#475569" font-weight="400" text-anchor="start">真实调用需要凭据及请求边界</text><text x="46" y="343" font-size="14" fill="#475569" font-weight="400" text-anchor="start">本节用固定消息提供者离线练习</text><rect x="412" y="242" width="360" height="133" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="430" y="271" font-size="16" fill="#2563eb" font-weight="600" text-anchor="start">可选运行与观察</text><text x="430" y="297" font-size="14" fill="#475569" font-weight="400" text-anchor="start">LangGraph：显式状态与路由</text><text x="430" y="320" font-size="14" fill="#475569" font-weight="400" text-anchor="start">LangSmith：自愿配置外部追踪</text><text x="430" y="343" font-size="14" fill="#475569" font-weight="400" text-anchor="start">按任务缺口选择，不是必经升级</text><rect x="28" y="397" width="744" height="94" rx="12" fill="#eff6ff" stroke="#93c5fd"/><text x="46" y="425" font-size="16" fill="#2563eb" font-weight="600" text-anchor="start">宿主责任：来源与权限、预算、失败状态、独立验收</text><text x="46" y="451" font-size="14" fill="#475569" font-weight="400" text-anchor="start">配置并实测这些边界；框架接口本身不提供完整业务保证。</text></g></svg>
