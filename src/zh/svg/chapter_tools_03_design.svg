<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-label="把工具做成可拒绝、可核对的小接口"><title>把工具做成可拒绝、可核对的小接口</title><desc>配套只实现本地资料搜索与受限算术；没有任意路径、Shell或外部写入。</desc><rect width="800" height="520" rx="16" fill="#f8fafc"/><g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="28" y="38" font-size="22" fill="#1e293b" font-weight="600">把工具做成可拒绝、可核对的小接口</text><text x="28" y="65" font-size="13" fill="#475569" font-weight="400">配套只实现本地资料搜索与受限算术；没有任意路径、Shell或外部写入。</text><rect x="28" y="89" width="360" height="151" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="46" y="119" font-size="16" fill="#2563eb" font-weight="600">Input contract</text><text x="46" y="147" font-size="14" fill="#475569" font-weight="400">JSON字节上限，禁止重复键</text><text x="46" y="171" font-size="14" fill="#475569" font-weight="400">仅声明字段，非空字符串</text><text x="46" y="195" font-size="14" fill="#475569" font-weight="400">query ≤120 / expression ≤256</text><text x="46" y="219" font-size="14" fill="#475569" font-weight="400">Schema与运行时检查对应</text><rect x="412" y="89" width="360" height="151" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="430" y="119" font-size="16" fill="#2563eb" font-weight="600">Permission / resource</text><text x="430" y="147" font-size="14" fill="#475569" font-weight="400">注册工具不等于当前获准</text><text x="430" y="171" font-size="14" fill="#475569" font-weight="400">宿主配置allowed_tools</text><text x="430" y="195" font-size="14" fill="#475569" font-weight="400">1–8份有界、唯一来源资料</text><text x="430" y="219" font-size="14" fill="#475569" font-weight="400">服务另需绑定认证主体</text><rect x="28" y="262" width="360" height="180" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="46" y="292" font-size="16" fill="#2563eb" font-weight="600">Execution / observation</text><text x="46" y="320" font-size="14" fill="#475569" font-weight="400">复用词法检索及safe_math</text><text x="46" y="344" font-size="14" fill="#475569" font-weight="400">AST白名单与运算资源边界</text><text x="46" y="368" font-size="14" fill="#475569" font-weight="400">空命中不等于执行错误</text><text x="46" y="392" font-size="14" fill="#475569" font-weight="400">ok / code / value保留区别</text><text x="46" y="416" font-size="14" fill="#475569" font-weight="400">异常只保留类型，不复制正文</text><rect x="412" y="262" width="360" height="180" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="430" y="292" font-size="16" fill="#2563eb" font-weight="600">Budget / lifecycle</text><text x="430" y="320" font-size="14" fill="#475569" font-weight="400">模型轮数与工具提议数分开</text><text x="430" y="344" font-size="14" fill="#475569" font-weight="400">获准批次中的拒绝/跳过也计数</text><text x="430" y="368" font-size="14" fill="#475569" font-weight="400">输入字节超限明确失败</text><text x="430" y="392" font-size="14" fill="#475569" font-weight="400">无自动重试、缓存或硬超时</text><text x="430" y="416" font-size="14" fill="#475569" font-weight="400">框架名称不能证明业务边界</text><text x="28" y="493" font-size="14" fill="#475569" font-weight="400">这些机制不等于完整认证、自然语言事实验证或操作系统沙箱。</text></g></svg>
