<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" role="img" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>逐步构建可验证、可控、可部署的 Agent</title><desc>25章 · 7个部分 · 应用交付在前，研究进阶在后</desc>
<rect width="1000" height="700" fill="#f8fafc"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#64748b"/></marker></defs>
<text x="40" y="43" font-size="26" fill="#0f172a" font-weight="700">逐步构建可验证、可控、可部署的 Agent</text>
<text x="40" y="76" font-size="17" fill="#334155" font-weight="400">25章 · 7个部分 · 应用交付在前，研究进阶在后</text>
<rect x="28" y="102" width="944" height="187" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
<text x="48" y="135" font-size="20" fill="#1d4ed8" font-weight="700">应用主线：验收通过后继续</text>
<rect x="48" y="151" width="215" height="100" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="62" y="179" font-size="24" fill="#1d4ed8" font-weight="700">1–8</text>
<text x="62" y="209" font-size="17" fill="#0f172a" font-weight="600">任务与最小助手</text>
<text x="62" y="235" font-size="15" fill="#334155" font-weight="400">工具到宿主约束</text>
<line x1="264" y1="199" x2="275" y2="199" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="278" y="151" width="215" height="100" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="292" y="179" font-size="24" fill="#1d4ed8" font-weight="700">10 / 11</text>
<text x="292" y="209" font-size="17" fill="#0f172a" font-weight="600">按需选开发库</text>
<text x="292" y="235" font-size="15" fill="#334155" font-weight="400">适配或显式状态</text>
<line x1="494" y1="199" x2="505" y2="199" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="508" y="151" width="215" height="100" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="522" y="179" font-size="24" fill="#1d4ed8" font-weight="700">18–20</text>
<text x="522" y="209" font-size="17" fill="#0f172a" font-weight="600">评估、安全、部署</text>
<text x="522" y="235" font-size="15" fill="#334155" font-weight="400">同输入复验服务</text>
<line x1="724" y1="199" x2="735" y2="199" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="738" y="151" width="215" height="100" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="752" y="179" font-size="24" fill="#1d4ed8" font-weight="700">21 / 22 / 23</text>
<text x="752" y="209" font-size="17" fill="#0f172a" font-weight="600">任选一个领域项目</text>
<text x="752" y="235" font-size="15" fill="#334155" font-weight="400">补丁、报告或媒体任务</text>
<text x="48" y="275" font-size="16" fill="#334155" font-weight="400">评估与权限检查从第一个实战开始；开发库没有必要时可跳过。</text>
<rect x="28" y="313" width="944" height="156" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
<text x="48" y="346" font-size="20" fill="#166534" font-weight="700">有具体问题再增加的分支</text>
<rect x="48" y="361" width="292" height="87" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="60" y="388" font-size="21" fill="#166534" font-weight="700">9</text>
<text x="60" y="414" font-size="17" fill="#0f172a" font-weight="600">复用已验收流程</text>
<text x="60" y="437" font-size="15" fill="#334155" font-weight="400">技能契约，不扩大权限</text>
<rect x="354" y="361" width="292" height="87" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="366" y="388" font-size="21" fill="#166534" font-weight="700">12–15</text>
<text x="366" y="414" font-size="17" fill="#0f172a" font-weight="600">产品与架构案例选读</text>
<text x="366" y="437" font-size="15" fill="#334155" font-weight="400">按场景选一个或跳过</text>
<rect x="660" y="361" width="292" height="87" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="672" y="388" font-size="21" fill="#166534" font-weight="700">16–17</text>
<text x="672" y="414" font-size="17" fill="#0f172a" font-weight="600">协作或跨系统集成</text>
<text x="672" y="437" font-size="15" fill="#334155" font-weight="400">先证明单 Agent 瓶颈</text>
<rect x="28" y="494" width="944" height="119" rx="12" fill="#faf5ff" stroke="#e9d5ff"/>
<text x="48" y="527" font-size="19" fill="#7e22ce" font-weight="700">24–25 研究进阶：测得瓶颈后再选训练或自动改进</text>
<text x="48" y="560" font-size="18" fill="#334155" font-weight="400">冻结基线 → 独立保留集 → 验证候选 → 启用或回退</text>
<text x="48" y="590" font-size="16" fill="#334155" font-weight="400">训练不是应用前置；提示/技能改进不必先训练权重。</text>
<text x="40" y="650" font-size="19" fill="#0f172a" font-weight="600">每章交接：上一版失败 → 本章增量 → 验收证据 → 下一步选择</text>
<text x="40" y="681" font-size="16" fill="#334155" font-weight="400">完整顺序以目录为准。示例、读者练习和未验证范围在各章标明。</text>
</svg>
