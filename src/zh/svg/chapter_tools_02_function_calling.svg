<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-label="调用消息必须经过宿主，结果关联回原ID"><title>调用消息必须经过宿主，结果关联回原ID</title><desc>Chat Completions function工具教学子集；strict与SDK类型不代替宿主校验。</desc><rect width="800" height="520" rx="16" fill="#f8fafc"/><g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="28" y="38" font-size="22" fill="#1e293b" font-weight="600">调用消息必须经过宿主，结果关联回原ID</text><text x="28" y="65" font-size="13" fill="#475569" font-weight="400">Chat Completions function工具教学子集；strict与SDK类型不代替宿主校验。</text><rect x="28" y="89" width="360" height="150" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="46" y="119" font-size="16" fill="#2563eb" font-weight="600">1. Schema + assistant</text><text x="46" y="147" font-size="14" fill="#475569" font-weight="400">工具说明、参数类型与字段</text><text x="46" y="171" font-size="14" fill="#475569" font-weight="400">tool_calls: id / type / function</text><text x="46" y="195" font-size="14" fill="#475569" font-weight="400">arguments仍是待校验JSON文本</text><text x="46" y="219" font-size="14" fill="#475569" font-weight="400">名字不是执行许可</text><rect x="412" y="89" width="360" height="150" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="430" y="119" font-size="16" fill="#2563eb" font-weight="600">2. Host</text><text x="430" y="147" font-size="14" fill="#475569" font-weight="400">校验整个批次的ID与预算</text><text x="430" y="171" font-size="14" fill="#475569" font-weight="400">检查已注册名字与当前许可</text><text x="430" y="195" font-size="14" fill="#475569" font-weight="400">检查JSON、字段、类型和值</text><text x="430" y="219" font-size="14" fill="#475569" font-weight="400">拒绝/失败仍保留可识别状态</text><rect x="28" y="262" width="360" height="180" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="46" y="292" font-size="16" fill="#2563eb" font-weight="600">3. Tool results</text><text x="46" y="320" font-size="14" fill="#475569" font-weight="400">每个获准进入的调用都有结果</text><text x="46" y="344" font-size="14" fill="#475569" font-weight="400">role: tool + 原tool_call_id</text><text x="46" y="368" font-size="14" fill="#475569" font-weight="400">ok / code / value结构化表示</text><text x="46" y="392" font-size="14" fill="#475569" font-weight="400">失败后同批剩余调用只记跳过</text><text x="46" y="416" font-size="14" fill="#475569" font-weight="400">超预算整批执行前拒绝</text><rect x="412" y="262" width="360" height="180" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="430" y="292" font-size="16" fill="#2563eb" font-weight="600">4. Next turn / acceptance</text><text x="430" y="320" font-size="14" fill="#475569" font-weight="400">先补齐关联消息，再发下一轮</text><text x="430" y="344" font-size="14" fill="#475569" font-weight="400">依赖步骤消费实际工具观察</text><text x="430" y="368" font-size="14" fill="#475569" font-weight="400">工具错误后任务保持未完成</text><text x="430" y="392" font-size="14" fill="#475569" font-weight="400">正常最终文本还需独立验收</text><text x="430" y="416" font-size="14" fill="#475569" font-weight="400">不接受空白、截断或拒答为成功</text><text x="28" y="493" font-size="14" fill="#475569" font-weight="400">调用ID用于协议关联，不是用户身份、权限或幂等保证。</text></g></svg>
