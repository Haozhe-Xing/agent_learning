<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350">
  <rect width="760" height="350" fill="#f0f4f8" rx="14"/>
  <text x="380" y="36" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">数据分析 Agent 六步职责设计</text>

  <!-- 箭头 marker -->
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7f8c8d"/>
    </marker>
  </defs>

  <!-- 步骤1 -->
  <rect x="30" y="70" width="105" height="75" rx="12" fill="#3498db" opacity="0.15"/>
  <rect x="30" y="70" width="105" height="28" rx="12" fill="#3498db"/>
  <rect x="30" y="86" width="105" height="12" fill="#3498db"/>
  <text x="82" y="89" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="bold" fill="white">① 澄清任务</text>
  <text x="82" y="115" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#2c3e50">指标 · 时间 · 权限</text>
  <text x="82" y="130" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#7f8c8d">独立结果预期</text>

  <line x1="135" y1="108" x2="150" y2="108" stroke="#7f8c8d" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- 步骤2 -->
  <rect x="155" y="70" width="105" height="75" rx="12" fill="#27ae60" opacity="0.15"/>
  <rect x="155" y="70" width="105" height="28" rx="12" fill="#27ae60"/>
  <rect x="155" y="86" width="105" height="12" fill="#27ae60"/>
  <text x="207" y="89" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="bold" fill="white">② SQL 提议</text>
  <text x="207" y="115" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#2c3e50">读取许可 Schema</text>
  <text x="207" y="130" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#7f8c8d">候选不授予许可</text>

  <line x1="260" y1="108" x2="275" y2="108" stroke="#7f8c8d" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- 步骤3 -->
  <rect x="280" y="70" width="105" height="75" rx="12" fill="#e74c3c" opacity="0.15"/>
  <rect x="280" y="70" width="105" height="28" rx="12" fill="#e74c3c"/>
  <rect x="280" y="86" width="105" height="12" fill="#e74c3c"/>
  <text x="332" y="89" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="bold" fill="white">③ 只读执行</text>
  <text x="332" y="115" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#2c3e50">数据库原生许可</text>
  <text x="332" y="130" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#7f8c8d">参数绑定 · 预算</text>

  <line x1="385" y1="108" x2="400" y2="108" stroke="#7f8c8d" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- 步骤4 -->
  <rect x="405" y="70" width="105" height="75" rx="12" fill="#e67e22" opacity="0.15"/>
  <rect x="405" y="70" width="105" height="28" rx="12" fill="#e67e22"/>
  <rect x="405" y="86" width="105" height="12" fill="#e67e22"/>
  <text x="457" y="89" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="bold" fill="white">④ 数据分析</text>
  <text x="457" y="115" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#2c3e50">类型 · 空值 · 单位</text>
  <text x="457" y="130" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#7f8c8d">统计 · 候选洞察</text>

  <line x1="510" y1="108" x2="525" y2="108" stroke="#7f8c8d" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- 步骤5 -->
  <rect x="530" y="70" width="105" height="75" rx="12" fill="#9b59b6" opacity="0.15"/>
  <rect x="530" y="70" width="105" height="28" rx="12" fill="#9b59b6"/>
  <rect x="530" y="86" width="105" height="12" fill="#9b59b6"/>
  <text x="582" y="89" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="bold" fill="white">⑤ 可视化</text>
  <text x="582" y="115" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#2c3e50">生成后核对数值</text>
  <text x="582" y="130" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#7f8c8d">轴 · 文件产物</text>

  <line x1="635" y1="108" x2="650" y2="108" stroke="#7f8c8d" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- 步骤6 -->
  <rect x="655" y="70" width="75" height="75" rx="12" fill="#2c3e50" opacity="0.15"/>
  <rect x="655" y="70" width="75" height="28" rx="12" fill="#2c3e50"/>
  <rect x="655" y="86" width="75" height="12" fill="#2c3e50"/>
  <text x="692" y="89" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="bold" fill="white">⑥ 报告</text>
  <text x="692" y="115" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#2c3e50">核对必需产物</text>
  <text x="692" y="130" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#7f8c8d">全部通过再交付</text>

  <!-- 分隔线 -->
  <line x1="30" y1="175" x2="730" y2="175" stroke="#bdc3c7" stroke-width="1" stroke-dasharray="6,3"/>

  <!-- 下方: LLM驱动 vs 代码驱动 -->
  <text x="380" y="200" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">模型提议与宿主控制的边界</text>

  <!-- LLM 驱动 -->
  <rect x="60" y="215" width="280" height="50" rx="10" fill="#3498db" opacity="0.1" stroke="#3498db" stroke-width="1"/>
  <text x="200" y="235" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#3498db">可选模型提议</text>
  <text x="200" y="255" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#7f8c8d">SQL、洞察和摘要均需独立核对</text>

  <!-- 代码驱动 -->
  <rect x="420" y="215" width="280" height="50" rx="10" fill="#27ae60" opacity="0.1" stroke="#27ae60" stroke-width="1"/>
  <text x="560" y="235" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#27ae60">宿主强制执行</text>
  <text x="560" y="255" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#7f8c8d">许可、预算、计算与产物验收</text>

  <!-- 底部总结 -->
  <rect x="120" y="290" width="520" height="35" rx="10" fill="white" stroke="#bdc3c7" stroke-width="1"/>
  <text x="380" y="312" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#7f8c8d">六步不等于六次模型调用；22.3–22.4 领域组件仍需实现</text>
</svg>
