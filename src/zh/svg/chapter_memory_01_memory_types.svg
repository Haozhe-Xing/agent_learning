<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-labelledby="title">
<title id="title">记忆的三种责任</title>
<style>text { font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }</style>
<rect width="900" height="460" rx="14" fill="#f0f4f8"/>
<text x="450" y="37" text-anchor="middle" font-size="20" font-weight="bold" fill="#233447">记忆的三种责任</text>
<rect x="30" y="110" width="260" height="180" rx="10" fill="#2c3e50"/>
<text x="160" y="141" text-anchor="middle" font-size="16" fill="white" font-weight="bold">短期历史</text>
<text x="160" y="173" text-anchor="middle" font-size="12" fill="white">本次请求可见的消息</text>
<text x="160" y="205" text-anchor="middle" font-size="12" fill="white">完整轮次 / 预算 / 删减报告</text>
<rect x="320" y="110" width="260" height="180" rx="10" fill="#236fa3"/>
<text x="450" y="141" text-anchor="middle" font-size="16" fill="white" font-weight="bold">工作状态</text>
<text x="450" y="173" text-anchor="middle" font-size="12" fill="white">当前任务的结果与待办</text>
<text x="450" y="205" text-anchor="middle" font-size="12" fill="white">主体和任务隔离 / 来源和状态</text>
<rect x="610" y="110" width="260" height="180" rx="10" fill="#73519a"/>
<text x="740" y="141" text-anchor="middle" font-size="16" fill="white" font-weight="bold">长期记录</text>
<text x="740" y="173" text-anchor="middle" font-size="12" fill="white">获准跨会话保留的信息</text>
<text x="740" y="205" text-anchor="middle" font-size="12" fill="white">同意 / 更新 / 撤回 / 删除</text>
<rect x="30" y="402" width="840" height="40" rx="8" fill="#fff0e9" stroke="#c46b3e"/>
<text x="450" y="427" text-anchor="middle" font-size="12" fill="#873a24">保留期由应用策略决定；长期不等于永久，召回不等于正确。</text>
</svg>
