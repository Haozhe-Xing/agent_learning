<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" role="img" aria-labelledby="title desc">
<title id="title">资料与权限分开</title><desc id="desc">误报/漏报只是信号；资料不能签发许可或审批</desc>
<rect width="960" height="250" rx="16" fill="#f6f8fc"/>
<g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
<text x="480" y="42" font-size="24" font-weight="700" fill="#172c4f">资料与权限分开</text>
<rect x="24" y="81" width="207" height="80" rx="12" fill="#dbeafe" stroke="#91a2bb"/>
<text x="127.5" y="129" font-size="20" fill="#172c4f">外部资料</text>
<path d="M236 121h17m-6-5 6 5-6 5" fill="none" stroke="#52647e" stroke-width="2"/>
<rect x="259" y="81" width="207" height="80" rx="12" fill="#e0e7ff" stroke="#91a2bb"/>
<text x="362.5" y="129" font-size="20" fill="#172c4f">模型提议</text>
<path d="M471 121h17m-6-5 6 5-6 5" fill="none" stroke="#52647e" stroke-width="2"/>
<rect x="494" y="81" width="207" height="80" rx="12" fill="#d1fae5" stroke="#91a2bb"/>
<text x="597.5" y="129" font-size="20" fill="#172c4f">宿主授权</text>
<path d="M706 121h17m-6-5 6 5-6 5" fill="none" stroke="#52647e" stroke-width="2"/>
<rect x="729" y="81" width="207" height="80" rx="12" fill="#fef3c7" stroke="#91a2bb"/>
<text x="832.5" y="129" font-size="20" fill="#172c4f">实际工具</text>
<text x="480" y="208" font-size="18" fill="#3c506e">误报/漏报只是信号；资料不能签发许可或审批</text>
</g></svg>
