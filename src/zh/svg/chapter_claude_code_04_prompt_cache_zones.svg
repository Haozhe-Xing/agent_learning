<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" width="680" height="260">
  <defs>
    <style>text { font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif; }</style>
  </defs>
  <rect width="680" height="260" rx="14" fill="#f0f4f8"/>
  <text x="340" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2c3e50">Prompt Cache 三段分区</text>

  <!-- Static -->
  <rect x="40" y="48" width="600" height="56" rx="8" fill="#27ae60"/>
  <text x="60" y="72" font-size="13" font-weight="bold" fill="white">[Static] System Prompt + Tools Schema</text>
  <text x="60" y="91" font-size="11" fill="#d5f5e3">带 cache_control: ephemeral 标记 · 命中率最高</text>
  <text x="620" y="80" text-anchor="end" font-size="11" fill="#f1c40f">缓存命中 ~30%</text>

  <!-- Stable -->
  <rect x="40" y="112" width="600" height="56" rx="8" fill="#3498db"/>
  <text x="60" y="136" font-size="13" font-weight="bold" fill="white">[Stable] CLAUDE.md + Skills.md</text>
  <text x="60" y="155" font-size="11" fill="#d6eaf8">项目级内容 · 偶尔变化 · 不变时复用缓存</text>
  <text x="620" y="144" text-anchor="end" font-size="11" fill="#f1c40f">~20%</text>

  <!-- Dynamic -->
  <rect x="40" y="176" width="600" height="56" rx="8" fill="#7f8c8d"/>
  <text x="60" y="200" font-size="13" font-weight="bold" fill="white">[Dynamic] User messages + tool history</text>
  <text x="60" y="219" font-size="11" fill="#ecf0f1">每次都变 · 不带缓存标记 · 实时计费</text>
  <text x="620" y="208" text-anchor="end" font-size="11" fill="#f1c40f">~50%</text>

  <!-- 底部说明 -->
  <text x="340" y="250" text-anchor="middle" font-size="11" fill="#7f8c8d">把静态区单独抽出来稳定不变 → 直接降低约 30% token 消耗</text>
</svg>
