<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380">
  <defs>
    <style>text { font-family: 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif; }</style>
    <marker id="dc" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#3498db"/>
    </marker>
  </defs>
  <rect width="800" height="380" rx="12" fill="#f8f9fa"/>
  <text x="400" y="35" text-anchor="middle" font-size="17" font-weight="bold" fill="#2c3e50">Text-to-SQL：提议、执行与验收</text>

  <!-- 三阶段 -->
  <rect x="30" y="60" width="235" height="130" rx="10" fill="#3498db" opacity="0.12" stroke="#3498db" stroke-width="2"/>
  <text x="147" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#3498db">① 任务与许可Schema</text>
  <text x="147" y="108" text-anchor="middle" font-size="11" fill="#555">明确金额、日期与单位</text>
  <text x="147" y="128" text-anchor="middle" font-size="11" fill="#555">问题中的实体 → 表和列</text>
  <text x="147" y="148" text-anchor="middle" font-size="11" fill="#3498db">只发送许可表的元数据</text>
  <text x="147" y="166" text-anchor="middle" font-size="11" fill="#3498db">缺少业务口径时先澄清</text>

  <line x1="265" y1="125" x2="278" y2="125" stroke="#3498db" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#dc)"/>

  <rect x="280" y="60" width="235" height="130" rx="10" fill="#e67e22" opacity="0.12" stroke="#e67e22" stroke-width="2"/>
  <text x="397" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#e67e22">② 模型提出候选SQL</text>
  <text x="397" y="108" text-anchor="middle" font-size="11" fill="#555">候选仍是不可信输入</text>
  <text x="397" y="128" text-anchor="middle" font-size="11" fill="#e67e22">SELECT / JOIN / GROUP BY</text>
  <text x="397" y="148" text-anchor="middle" font-size="11" fill="#e67e22">参数值使用绑定占位符</text>
  <text x="397" y="166" text-anchor="middle" font-size="11" fill="#555">生成成功不代表可以执行</text>

  <line x1="515" y1="125" x2="528" y2="125" stroke="#3498db" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#dc)"/>

  <rect x="530" y="60" width="240" height="130" rx="10" fill="#27ae60" opacity="0.12" stroke="#27ae60" stroke-width="2"/>
  <text x="650" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">③ 宿主执行与验收</text>
  <text x="650" y="108" text-anchor="middle" font-size="11" fill="#555">mode=ro + authorizer</text>
  <text x="650" y="128" text-anchor="middle" font-size="11" fill="#27ae60">限制工具动作、表和函数</text>
  <text x="650" y="148" text-anchor="middle" font-size="11" fill="#555">查询工作量与结果行数有预算</text>
  <text x="650" y="166" text-anchor="middle" font-size="11" fill="#27ae60">按独立业务预期核对结果</text>

  <!-- 安全挑战 -->
  <text x="400" y="218" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">三个边界分别核验</text>

  <rect x="30" y="235" width="235" height="120" rx="8" fill="#e74c3c" opacity="0.12" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="147" y="258" text-anchor="middle" font-size="12" font-weight="bold" fill="#e74c3c">读取与执行许可</text>
  <text x="147" y="280" text-anchor="middle" font-size="11" fill="#555">只读不等于所有数据可公开</text>
  <text x="147" y="300" text-anchor="middle" font-size="11" fill="#27ae60">指定表与函数许可</text>
  <text x="147" y="318" text-anchor="middle" font-size="11" fill="#27ae60">拒绝写入、ATTACH与改配置</text>
  <text x="147" y="336" text-anchor="middle" font-size="11" fill="#27ae60">身份/行列权限需另行配置</text>

  <rect x="280" y="235" width="245" height="120" rx="8" fill="#e67e22" opacity="0.12" stroke="#e67e22" stroke-width="1.5"/>
  <text x="402" y="258" text-anchor="middle" font-size="12" font-weight="bold" fill="#e67e22">资源边界</text>
  <text x="402" y="280" text-anchor="middle" font-size="11" fill="#555">复杂SELECT也可能消耗资源</text>
  <text x="402" y="300" text-anchor="middle" font-size="11" fill="#27ae60">进度回调检查VM与时间预算</text>
  <text x="402" y="318" text-anchor="middle" font-size="11" fill="#27ae60">按行数上限读取并拒绝超限</text>
  <text x="402" y="336" text-anchor="middle" font-size="11" fill="#27ae60">本例不提供操作系统沙箱</text>

  <rect x="540" y="235" width="230" height="120" rx="8" fill="#3498db" opacity="0.12" stroke="#3498db" stroke-width="1.5"/>
  <text x="655" y="258" text-anchor="middle" font-size="12" font-weight="bold" fill="#3498db">答案正确性</text>
  <text x="655" y="280" text-anchor="middle" font-size="11" fill="#555">SQL可执行仍可能答错问题</text>
  <text x="655" y="300" text-anchor="middle" font-size="11" fill="#27ae60">澄清时间、指标与统计口径</text>
  <text x="655" y="318" text-anchor="middle" font-size="11" fill="#27ae60">独立核对字段、单位和结果</text>
  <text x="655" y="336" text-anchor="middle" font-size="11" fill="#27ae60">不以模型自报成功作为验收</text>
</svg>
