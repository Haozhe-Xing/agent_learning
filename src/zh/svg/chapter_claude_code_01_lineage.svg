<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="680" height="360">
  <defs>
    <style>text { font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif; }</style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#7f8c8d"/>
    </marker>
  </defs>
  <rect width="680" height="360" rx="14" fill="#f0f4f8"/>
  <text x="340" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#2c3e50">从 AutoGPT 到 Claude Code：工业级 Harness 的演化脉络</text>

  <!-- 时间轴 -->
  <line x1="40" y1="70" x2="640" y2="70" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="60" y="58" font-size="10" fill="#7f8c8d">2023 Q1</text>
  <text x="160" y="58" font-size="10" fill="#7f8c8d">2024 Q1</text>
  <text x="320" y="58" font-size="10" fill="#7f8c8d">2024 Q3</text>
  <text x="460" y="58" font-size="10" fill="#7f8c8d">2025</text>
  <text x="560" y="58" font-size="10" fill="#7f8c8d">2026 Q2</text>

  <!-- 项目节点 -->
  <g font-size="11" font-weight="bold">
    <rect x="45" y="80" width="72" height="34" rx="6" fill="#2c3e50"/>
    <text x="81" y="101" text-anchor="middle" fill="white">AutoGPT</text>

    <rect x="130" y="80" width="70" height="34" rx="6" fill="#2c3e50"/>
    <text x="165" y="101" text-anchor="middle" fill="white">BabyAGI</text>

    <rect x="215" y="80" width="82" height="34" rx="6" fill="#3498db"/>
    <text x="256" y="101" text-anchor="middle" fill="white">LangChain</text>

    <rect x="310" y="80" width="84" height="34" rx="6" fill="#3498db"/>
    <text x="352" y="101" text-anchor="middle" fill="white">OpenHands</text>

    <rect x="405" y="80" width="58" height="34" rx="6" fill="#3498db"/>
    <text x="434" y="101" text-anchor="middle" fill="white">Aider</text>

    <rect x="478" y="80" width="58" height="34" rx="6" fill="#9b59b6"/>
    <text x="507" y="101" text-anchor="middle" fill="white">MCP</text>

    <rect x="548" y="80" width="74" height="34" rx="6" fill="#e67e22"/>
    <text x="585" y="101" text-anchor="middle" fill="white">OpenClaw</text>

    <rect x="605" y="118" width="60" height="34" rx="6" fill="#c0392b"/>
    <text x="635" y="139" text-anchor="middle" fill="white">Claude</text>

    <rect x="605" y="160" width="60" height="34" rx="6" fill="#2980b9"/>
    <text x="635" y="181" text-anchor="middle" fill="white">DS Harness</text>
  </g>

  <!-- 范式标签 -->
  <g font-size="9" fill="#5d6d7e">
    <text x="81" y="126" text-anchor="middle">范式</text>
    <text x="165" y="126" text-anchor="middle">任务队列</text>
    <text x="256" y="126" text-anchor="middle">集成生态</text>
    <text x="352" y="126" text-anchor="middle">事件流</text>
    <text x="434" y="126" text-anchor="middle">模型无关</text>
    <text x="507" y="126" text-anchor="middle">协议</text>
    <text x="585" y="126" text-anchor="middle">爆红</text>
  </g>

  <!-- 汇聚 -->
  <line x1="81" y1="150" x2="81" y2="200" stroke="#7f8c8d" stroke-width="1.5"/>
  <line x1="165" y1="150" x2="165" y2="200" stroke="#7f8c8d" stroke-width="1.5"/>
  <line x1="256" y1="150" x2="256" y2="200" stroke="#7f8c8d" stroke-width="1.5"/>
  <line x1="352" y1="150" x2="352" y2="200" stroke="#7f8c8d" stroke-width="1.5"/>
  <line x1="434" y1="150" x2="434" y2="200" stroke="#7f8c8d" stroke-width="1.5"/>
  <line x1="60" y1="200" x2="450" y2="200" stroke="#7f8c8d" stroke-width="2"/>
  <line x1="250" y1="200" x2="250" y2="220" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="60" y="224" width="380" height="36" rx="8" fill="#2c3e50"/>
  <text x="250" y="247" text-anchor="middle" font-size="12" font-weight="bold" fill="white">留下"Agent Loop + 工具 + 状态 + 沙箱"四大支柱</text>

  <!-- Claude Code 分支 -->
  <line x1="635" y1="152" x2="635" y2="200" stroke="#7f8c8d" stroke-width="1.5"/>
  <line x1="635" y1="194" x2="635" y2="200" stroke="#7f8c8d" stroke-width="1.5"/>
  <line x1="440" y1="200" x2="635" y2="200" stroke="#7f8c8d" stroke-width="2"/>
  <line x1="635" y1="200" x2="635" y2="270" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="540" y="274" width="120" height="34" rx="8" fill="#c0392b"/>
  <text x="600" y="296" text-anchor="middle" font-size="11" font-weight="bold" fill="white">工业 IDE 范式</text>

  <rect x="540" y="316" width="120" height="30" rx="8" fill="#2980b9"/>
  <text x="600" y="336" text-anchor="middle" font-size="11" font-weight="bold" fill="white">一切皆插件</text>

  <line x1="600" y1="308" x2="600" y2="314" stroke="#7f8c8d" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
