<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400">
  <defs>
    <style>text { font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif; }</style>
    <marker id="arrowU" markerWidth="8" markerHeight="8" refX="3" refY="0" orient="auto">
      <path d="M0,8 L6,8 L3,0 z" fill="#7f8c8d"/>
    </marker>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="3" refY="6" orient="auto">
      <path d="M0,0 L6,0 L3,8 z" fill="#7f8c8d"/>
    </marker>
  </defs>
  <rect width="680" height="400" rx="14" fill="#f0f4f8"/>
  <text x="340" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2c3e50">Hermes 三层记忆架构</text>

  <!-- Layer 3: Session Log -->
  <rect x="60" y="48" width="560" height="68" rx="8" fill="#3498db"/>
  <text x="340" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Layer 3 · Session Log（情景日志）</text>
  <text x="340" y="92" text-anchor="middle" font-size="11" fill="#d6eaf8">每次会话完整对话 + tool calls · 30 天滚动归档 · FTS5 全文索引</text>
  <text x="340" y="106" text-anchor="middle" font-size="10" fill="#aed6f1">最「重」的一层：记录发生了什么，用于复盘与检索</text>

  <line x1="340" y1="116" x2="340" y2="140" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrowD)"/>

  <!-- Layer 2: Working Memory -->
  <rect x="60" y="142" width="560" height="68" rx="8" fill="#27ae60"/>
  <text x="340" y="166" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Layer 2 · Working Memory（工作记忆）</text>
  <text x="340" y="186" text-anchor="middle" font-size="11" fill="#d5f5e3">当前 session 活跃状态 · context window 内容 · 实时压缩 / 摘要</text>
  <text x="340" y="200" text-anchor="middle" font-size="10" fill="#a9dfbf">中「热」的一层：短时高吞吐，随会话结束清空</text>

  <line x1="340" y1="210" x2="340" y2="234" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrowD)"/>

  <!-- Layer 1: Long-Term Memory -->
  <rect x="60" y="236" width="560" height="68" rx="8" fill="#8e44ad"/>
  <text x="340" y="260" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Layer 1 · Long-Term Memory（长期语义）</text>
  <text x="340" y="280" text-anchor="middle" font-size="11" fill="#e8daef">MEMORY.md（事实+经验） · USER.md（用户建模） · Skill files（沉淀能力）</text>
  <text x="340" y="294" text-anchor="middle" font-size="10" fill="#d2b4de">最「稳」的一层：跨会话沉淀，越用越懂你</text>

  <!-- Bottom: Honcho / Nudge feeding up -->
  <rect x="180" y="330" width="150" height="48" rx="8" fill="#2c3e50"/>
  <text x="255" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Honcho Dialectic</text>
  <text x="255" y="368" text-anchor="middle" font-size="10" fill="#bdc3c7">用户建模</text>

  <rect x="370" y="330" width="150" height="48" rx="8" fill="#2c3e50"/>
  <text x="445" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Nudge Engine</text>
  <text x="445" y="368" text-anchor="middle" font-size="10" fill="#bdc3c7">主动反思</text>

  <line x1="255" y1="330" x2="255" y2="304" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrowU)"/>
  <line x1="445" y1="330" x2="445" y2="304" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrowU)"/>
  <text x="345" y="318" text-anchor="middle" font-size="10" fill="#7f8c8d">向上写入 USER.md / 触发反思 → 反哺长期语义</text>
</svg>
