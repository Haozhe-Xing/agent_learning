<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" role="img" aria-labelledby="title desc">
<title id="title">候选技能生命周期：本书教学设计</title>
<desc id="desc">不是 Hermes 的内部实现或 CLI 流程</desc>
<defs><style>text { font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }</style>
</defs>
<rect width="760" height="480" rx="14" fill="#f0f4f8"/>
<text x="380" y="29" text-anchor="middle" font-size="18" font-weight="bold" fill="#233447">候选技能生命周期：本书教学设计</text>
<text x="380" y="52" text-anchor="middle" font-size="12" fill="#526579">不是 Hermes 的内部实现或 CLI 流程</text>
<rect x="30" y="90" width="210" height="105" rx="10" fill="#2c3e50"/>
<text x="135" y="118" text-anchor="middle" font-size="14" fill="white" font-weight="bold">① 已验收轨迹</text>
<text x="135" y="143" text-anchor="middle" font-size="11" fill="white">出处、覆盖、执行均通过</text>
<text x="135" y="168" text-anchor="middle" font-size="11" fill="white">固定任务 / 资料 / 策略</text>
<rect x="275" y="90" width="210" height="105" rx="10" fill="#2980b9"/>
<text x="380" y="118" text-anchor="middle" font-size="14" fill="white" font-weight="bold">② 校验候选</text>
<text x="380" y="143" text-anchor="middle" font-size="11" fill="white">受限 JSON + 来源核对</text>
<text x="380" y="168" text-anchor="middle" font-size="11" fill="white">不把模型声明当授权</text>
<rect x="520" y="90" width="210" height="105" rx="10" fill="#9b59b6"/>
<text x="625" y="118" text-anchor="middle" font-size="14" fill="white" font-weight="bold">③ 隔离草稿</text>
<text x="625" y="143" text-anchor="middle" font-size="11" fill="white">候选在活动加载器之外</text>
<text x="625" y="168" text-anchor="middle" font-size="11" fill="white">宿主ID / 新版本 / 路径边界</text>
<rect x="520" y="255" width="210" height="105" rx="10" fill="#237b57"/>
<text x="625" y="283" text-anchor="middle" font-size="14" fill="white" font-weight="bold">④ 独立回归</text>
<text x="625" y="308" text-anchor="middle" font-size="11" fill="white">相同用例比较基线与候选</text>
<text x="625" y="333" text-anchor="middle" font-size="11" fill="white">正确性 / 拒绝 / 权限 / 预算</text>
<rect x="275" y="255" width="210" height="105" rx="10" fill="#a65a12"/>
<text x="380" y="283" text-anchor="middle" font-size="14" fill="white" font-weight="bold">⑤ 审查与版本决策</text>
<text x="380" y="308" text-anchor="middle" font-size="11" fill="white">证据充分且批准才晋升</text>
<text x="380" y="333" text-anchor="middle" font-size="11" fill="white">保留 / 修订 / 停用 / 回退</text>
<line x1="240" y1="142" x2="270" y2="142" stroke="#64748b" stroke-width="2"/><polygon points="270,142 263,138 263,146" fill="#64748b"/>
<line x1="485" y1="142" x2="515" y2="142" stroke="#64748b" stroke-width="2"/><polygon points="515,142 508,138 508,146" fill="#64748b"/>
<line x1="625" y1="195" x2="625" y2="250" stroke="#64748b" stroke-width="2"/><polygon points="625,250 621,243 629,243" fill="#64748b"/>
<line x1="520" y1="307" x2="490" y2="307" stroke="#64748b" stroke-width="2"/><polygon points="490,307 497,303 497,311" fill="#64748b"/>
<line x1="275" y1="307" x2="245" y2="307" stroke="#64748b" stroke-width="2"/><polygon points="245,307 252,303 252,311" fill="#64748b"/>
<rect x="30" y="255" width="210" height="105" rx="10" fill="#e0eee5" stroke="#237b57"/>
<text x="135" y="283" text-anchor="middle" font-size="13" fill="#205238">获准版本的使用反馈</text>
<text x="135" y="308" text-anchor="middle" font-size="11" fill="#205238">失败可触发新候选</text>
<text x="135" y="333" text-anchor="middle" font-size="11" fill="#205238">日志不自动证明改进</text>
<path d="M135,255 L135,200" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4"/><polygon points="135,200 131,207 139,207" fill="#64748b"/>
<rect x="30" y="390" width="700" height="43" rx="8" fill="#fff0e9" stroke="#c46b3e"/>
<text x="380" y="416" text-anchor="middle" font-size="12" fill="#873a24">任一条件缺失或失败：拒绝、待审或停用；记录原因与未完成项</text>
<text x="380" y="458" text-anchor="middle" font-size="12" fill="#526579">draft 标签不等于加载隔离；步骤变短不等于效果提升</text>
</svg>
