<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
<title id="title">间接注入：资料、提议、执行分别看</title>
<desc id="desc">Concepts: https://arxiv.org/html/2302.12173v2 §§3–5. Host authorization/budget gate is the book engineering synthesis, not a reproduced paper defense.</desc>
<metadata>Original illustration created for this book; no paper artwork or screenshot reproduced. Repository MIT license applies to this illustration.</metadata>
<style>text { font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }</style>
<rect width="960" height="500" rx="14" fill="#f1f5f9"/>
<text x="480" y="43" text-anchor="middle" font-size="23" font-weight="bold" fill="#22384c">间接注入：资料、提议、执行分别看</text>
<rect x="30" y="95" width="280" height="255" rx="12" fill="#2d4965"/>
<text x="170" y="130" text-anchor="middle" font-size="18" fill="white" font-weight="bold">不可信入口</text>
<text x="170" y="177" text-anchor="middle" font-size="14" fill="white">网页 / 文档 / 工具返回</text>
<text x="170" y="216" text-anchor="middle" font-size="14" fill="white">攻击者可修改的资料字段</text>
<text x="170" y="255" text-anchor="middle" font-size="14" fill="white">数据可能包含操作指令</text>
<text x="170" y="294" text-anchor="middle" font-size="14" fill="white">来源标签不授予权限</text>
<rect x="340" y="95" width="280" height="255" rx="12" fill="#287598"/>
<text x="480" y="130" text-anchor="middle" font-size="18" fill="white" font-weight="bold">Agent 提议</text>
<text x="480" y="177" text-anchor="middle" font-size="14" fill="white">结合固定规则与当前任务</text>
<text x="480" y="216" text-anchor="middle" font-size="14" fill="white">可能提出工具调用</text>
<text x="480" y="255" text-anchor="middle" font-size="14" fill="white">模型输出不是可信授权</text>
<text x="480" y="294" text-anchor="middle" font-size="14" fill="white">记录提议及其来源</text>
<rect x="650" y="95" width="280" height="255" rx="12" fill="#72608a"/>
<text x="790" y="130" text-anchor="middle" font-size="18" fill="white" font-weight="bold">宿主执行边界</text>
<text x="790" y="177" text-anchor="middle" font-size="14" fill="white">身份 / 资源 / 参数 / 预算</text>
<text x="790" y="216" text-anchor="middle" font-size="14" fill="white">执行前由可信代码检查</text>
<text x="790" y="255" text-anchor="middle" font-size="14" fill="white">拒绝、失败、超限分别保留</text>
<text x="790" y="294" text-anchor="middle" font-size="14" fill="white">再核对真实状态变化</text>
<path d="M 312 220 L 327 220" fill="none" stroke="#738296" stroke-width="2"/>
<path d="M 327 215 L 335 220 L 327 225" fill="none" stroke="#738296" stroke-width="2"/>
<path d="M 622 220 L 637 220" fill="none" stroke="#738296" stroke-width="2"/>
<path d="M 637 215 L 645 220 L 637 225" fill="none" stroke="#738296" stroke-width="2"/>
<rect x="30" y="385" width="900" height="83" rx="9" fill="#fff3e9" stroke="#be8156"/>
<text x="480" y="414" text-anchor="middle" font-size="14" fill="#754325">左侧是论文描述的威胁入口；右侧是本书的宿主工程要求。</text>
<text x="480" y="442" text-anchor="middle" font-size="14" fill="#754325">角色分离或提示警告不能单独保证抗注入。</text>
<text x="480" y="490" text-anchor="middle" font-size="11" fill="#58667a">本书原创示意；固定版本与证据边界见正文。</text>
</svg>
