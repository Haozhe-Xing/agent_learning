<svg xmlns="http://www.w3.org/2000/svg" width="920" height="460" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">反思：反馈可建议修改，不能签发验收</title>
  <desc id="desc">独立验收控制修订与结束，自我反思仅提供建议，所有重试受预算限制。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#64748b" />
    </marker>
  </defs>
  <rect width="920" height="460" fill="#f8fafc" />
  <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="460" y="35" font-size="22" fill="#0f172a" font-weight="bold" text-anchor="middle">反思：反馈可建议修改，不能签发验收</text>
    <rect x="24" y="80" width="250" height="108" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" />
    <text x="149.0" y="108" font-size="17" fill="#2563eb" font-weight="bold" text-anchor="middle">生成候选简报</text>
    <text x="149.0" y="135" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">保留原始资料与来源</text>
    <text x="149.0" y="158" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">候选允许缺项或出错</text>
    <rect x="334" y="80" width="250" height="108" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="1.5" />
    <text x="459.0" y="108" font-size="17" fill="#15803d" font-weight="bold" text-anchor="middle">独立核对</text>
    <text x="459.0" y="135" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">来源一致 + 冻结要求</text>
    <text x="459.0" y="158" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">不采信自评分 passed / 10</text>
    <rect x="644" y="80" width="250" height="108" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="1.5" />
    <text x="769.0" y="108" font-size="17" fill="#15803d" font-weight="bold" text-anchor="middle">通过：完成</text>
    <text x="769.0" y="135" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">accepted=true</text>
    <text x="769.0" y="158" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">status=completed</text>
    <path d="M 276 134 L 332 134" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
    <path d="M 586 134 L 642 134" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
    <text x="615" y="119" font-size="12" fill="#15803d" font-weight="normal" text-anchor="middle">通过</text>
    <path d="M 459 190 L 459 232" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
    <text x="510" y="217" font-size="14" fill="#b45309" font-weight="normal" text-anchor="middle">未通过</text>
    <rect x="334" y="234" width="250" height="108" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.5" />
    <text x="459.0" y="262" font-size="17" fill="#b45309" font-weight="bold" text-anchor="middle">反馈建议</text>
    <text x="459.0" y="289" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">从缺项生成修订方向</text>
    <text x="459.0" y="312" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">文本意见不是新证据</text>
    <rect x="24" y="234" width="250" height="108" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" />
    <text x="149.0" y="262" font-size="17" fill="#2563eb" font-weight="bold" text-anchor="middle">有界替换计划</text>
    <text x="149.0" y="289" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">先验证，再丢弃旧队列</text>
    <text x="149.0" y="312" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">清空产物，重新读取并生成</text>
    <path d="M 332 288 L 276 288" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
    <path d="M 586 288 L 642 288" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
    <path d="M 148 232 L 148 190" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="644" y="234" width="250" height="108" rx="10" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5" />
    <text x="769.0" y="262" font-size="17" fill="#b91c1c" font-weight="bold" text-anchor="middle">不可修订或预算耗尽</text>
    <text x="769.0" y="289" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">保留失败报告，accepted=false</text>
    <text x="769.0" y="312" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">权限拒绝不改走替代动作</text>
    <rect x="24" y="370" width="872" height="48" rx="9" fill="#e8eef7" />
    <text x="460" y="395" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">失败调用与重读同计步骤预算；重规划另计上限，不保证下一轮改善。</text>
  </g>
</svg>
