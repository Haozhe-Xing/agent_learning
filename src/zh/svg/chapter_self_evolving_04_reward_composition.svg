<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360">
  <defs>
    <marker id="rc_arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#7f8c8d"/>
    </marker>
  </defs>
  <rect width="760" height="360" fill="#f8f9fa" rx="12"/>
  <text x="380" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#2c3e50">轨迹级奖励的组成：不只看「答没答对」</text>

  <!-- 左列：正向奖励 -->
  <text x="170" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e8449">正向奖励（鼓励模型这么做）</text>
  <g font-family="Arial, sans-serif" font-size="12" fill="#196f3d">
    <rect x="40" y="82" width="260" height="34" rx="7" fill="#27ae60" opacity="0.12" stroke="#27ae60" stroke-width="1.3"/>
    <text x="56" y="104" fill="#196f3d">+ 任务完成奖励</text>
    <rect x="40" y="122" width="260" height="34" rx="7" fill="#27ae60" opacity="0.12" stroke="#27ae60" stroke-width="1.3"/>
    <text x="56" y="144" fill="#196f3d">+ 工具调用成功奖励</text>
    <rect x="40" y="162" width="260" height="34" rx="7" fill="#27ae60" opacity="0.12" stroke="#27ae60" stroke-width="1.3"/>
    <text x="56" y="184" fill="#196f3d">+ 中间检查奖励（过程可靠）</text>
    <rect x="40" y="202" width="260" height="34" rx="7" fill="#27ae60" opacity="0.12" stroke="#27ae60" stroke-width="1.3"/>
    <text x="56" y="224" fill="#196f3d">+ 错误恢复奖励（跌倒能爬起）</text>
  </g>

  <!-- 右列：惩罚项 -->
  <text x="590" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#a93226">惩罚项（抑制模型这么做）</text>
  <g font-family="Arial, sans-serif" font-size="12">
    <rect x="460" y="82" width="260" height="34" rx="7" fill="#e74c3c" opacity="0.12" stroke="#e74c3c" stroke-width="1.3"/>
    <text x="476" y="104" fill="#a93226">− 重复调用惩罚（空转）</text>
    <rect x="460" y="122" width="260" height="34" rx="7" fill="#e74c3c" opacity="0.12" stroke="#e74c3c" stroke-width="1.3"/>
    <text x="476" y="144" fill="#a93226">− 高延迟 / 高成本惩罚</text>
    <rect x="460" y="162" width="260" height="34" rx="7" fill="#e74c3c" opacity="0.12" stroke="#e74c3c" stroke-width="1.3"/>
    <text x="476" y="184" fill="#a93226">− 安全违规惩罚</text>
  </g>

  <!-- 汇合到总奖励 -->
  <line x1="170" y1="236" x2="330" y2="286" stroke="#7f8c8d" stroke-width="1.6" marker-end="url(#rc_arrow)"/>
  <line x1="590" y1="196" x2="430" y2="286" stroke="#7f8c8d" stroke-width="1.6" marker-end="url(#rc_arrow)"/>

  <rect x="270" y="288" width="220" height="46" rx="10" fill="#2c3e50" opacity="0.9"/>
  <text x="380" y="317" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">总奖励 = Σ 正向 − Σ 惩罚</text>

  <text x="380" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">模型追求的不再是「答对」，而是一条更可靠、更便宜、更安全的完成路径</text>
</svg>
