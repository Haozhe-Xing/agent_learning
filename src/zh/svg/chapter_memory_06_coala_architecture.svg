<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 590" role="img" aria-labelledby="title desc" font-family="Arial, PingFang SC, sans-serif">
<title id="title">CoALA：三个设计维度</title><desc id="desc">工作记忆与情景、语义、程序性长期记忆有别；动作空间和决策过程为另两个维度，没有固定四步流水线。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8Z" fill="#475569"/></marker></defs>
<rect width="560" height="590" rx="12" fill="#fff"/>
<text x="280" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">CoALA：三个设计维度</text>
<rect x="30" y="60" width="500" height="75" rx="9" fill="#eff6ff" stroke="#64748b"/>
<text x="280.0" y="88" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">工作记忆</text>
<text x="280.0" y="115" text-anchor="middle" font-size="17" font-weight="normal" fill="#1e293b">当前观察、任务状态与推理所用信息</text>
<path d="M280,135 L280,166" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<rect x="30" y="168" width="500" height="175" rx="9" fill="#f5f3ff" stroke="#64748b"/>
<text x="280.0" y="196" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">长期记忆</text>
<text x="52" y="228" text-anchor="start" font-size="17" font-weight="normal" fill="#1e293b">情景：过去的事件与经历</text>
<text x="52" y="269" text-anchor="start" font-size="17" font-weight="normal" fill="#1e293b">语义：事实、概念及推断知识</text>
<text x="52" y="310" text-anchor="start" font-size="17" font-weight="normal" fill="#1e293b">程序性：Agent代码与模型权重</text>
<rect x="30" y="365" width="500" height="98" rx="9" fill="#ecfdf5" stroke="#64748b"/>
<text x="280.0" y="393" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">动作空间</text>
<text x="280.0" y="420" text-anchor="middle" font-size="17" font-weight="normal" fill="#1e293b">内部：推理、检索、学习</text>
<text x="280.0" y="444" text-anchor="middle" font-size="17" font-weight="normal" fill="#1e293b">外部：与工具、环境或其他主体交互</text>
<rect x="30" y="482" width="500" height="64" rx="9" fill="#fff7ed" stroke="#64748b"/>
<text x="280.0" y="510" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">决策：组织候选动作、评估与选择</text>
<text x="280" y="571" text-anchor="middle" font-size="14" font-weight="normal" fill="#475569">本书重绘，依据 Sumers et al., v3 §4 (2024)</text>
</svg>
