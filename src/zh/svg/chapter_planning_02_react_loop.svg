<svg xmlns="http://www.w3.org/2000/svg" width="920" height="460" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">动作—观察循环：受限执行，独立停止条件</title>
  <desc id="desc">注册动作、预算、真实观察和独立验收共同决定结束状态。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#64748b" />
    </marker>
  </defs>
  <rect width="920" height="460" fill="#f8fafc" />
  <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="460" y="35" font-size="22" fill="#0f172a" font-weight="bold" text-anchor="middle">动作—观察循环：受限执行，独立停止条件</text>
    <rect x="24" y="82" width="250" height="130" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" />
    <text x="149.0" y="110" font-size="17" fill="#2563eb" font-weight="bold" text-anchor="middle">结构化决策</text>
    <text x="149.0" y="137" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">action: load / compose</text>
    <text x="149.0" y="160" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">或 finish: true</text>
    <text x="149.0" y="183" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">公开动作，不索取私有推理</text>
    <rect x="334" y="82" width="250" height="130" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" />
    <text x="459.0" y="110" font-size="17" fill="#2563eb" font-weight="bold" text-anchor="middle">宿主执行</text>
    <text x="459.0" y="137" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">检查协议与注册操作</text>
    <text x="459.0" y="160" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">调用前检查工具预算</text>
    <text x="459.0" y="183" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">保留失败与成功观察</text>
    <rect x="644" y="82" width="250" height="130" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" />
    <text x="769.0" y="110" font-size="17" fill="#2563eb" font-weight="bold" text-anchor="middle">观察与候选核对</text>
    <text x="769.0" y="137" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">消费实际资料内容</text>
    <text x="769.0" y="160" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">来源支持 + 冻结要求</text>
    <text x="769.0" y="183" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">失败反馈可进入下一次决策</text>
    <path d="M 276 145 L 332 145" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
    <path d="M 586 145 L 642 145" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
    <path d="M 770 214 L 770 252 L 150 252 L 150 214" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
    <text x="460" y="244" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">每次决策计数；失败工具调用同样消耗预算</text>
    <rect x="24" y="288" width="250" height="94" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.5" />
    <text x="149.0" y="316" font-size="17" fill="#b45309" font-weight="bold" text-anchor="middle">finish 是停止提议</text>
    <text x="149.0" y="343" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">未通过验收 → incomplete</text>
    <path d="M 276 334 L 332 334" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
    <text x="305" y="322" font-size="12" fill="#15803d" font-weight="normal" text-anchor="middle">通过</text>
    <rect x="334" y="288" width="250" height="94" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="1.5" />
    <text x="459.0" y="316" font-size="17" fill="#15803d" font-weight="bold" text-anchor="middle">验收通过才完成</text>
    <text x="459.0" y="343" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">completed / accepted=true</text>
    <rect x="644" y="288" width="250" height="94" rx="10" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5" />
    <text x="769.0" y="316" font-size="17" fill="#b91c1c" font-weight="bold" text-anchor="middle">协议错误或预算耗尽</text>
    <text x="769.0" y="343" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">failed / budget_exhausted</text>
    <text x="460" y="428" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">固定离线协议练习；不是原论文实验复现，也不评价模型理解质量。</text>
  </g>
</svg>
