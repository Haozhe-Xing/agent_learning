<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300">
  <defs>
    <style>text { font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif; }</style>
  </defs>
  <rect width="680" height="300" rx="14" fill="#f0f4f8"/>
  <text x="340" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2c3e50">薄内核 · 野业务：把可换性做到极致</text>

  <!-- 内核 -->
  <rect x="40" y="52" width="600" height="110" rx="10" fill="#2c3e50"/>
  <text x="60" y="78" font-size="14" font-weight="bold" fill="white">内核（薄）</text>
  <text x="60" y="100" font-size="11" fill="#bdc3c7">消息路由 · 配置加载 · 错误恢复 · 启动/关闭</text>
  <text x="60" y="122" font-size="11" fill="#95a5a6">只做插件调度，不承载任何业务能力</text>
  <text x="60" y="146" font-size="10" fill="#f1c40f">判定准则：换 LLM / DB / UI / 沙箱，改 0 行代码（只改配置）</text>

  <!-- 业务 -->
  <rect x="40" y="172" width="600" height="100" rx="10" fill="#3498db"/>
  <text x="60" y="198" font-size="14" font-weight="bold" fill="white">业务（野）—— 全部是插件</text>
  <text x="60" y="220" font-size="11" fill="#d6eaf8">LLM 适配 · 工具实现 · 记忆后端 · Skill 加载</text>
  <text x="60" y="240" font-size="11" fill="#d6eaf8">子 Agent · 沙箱 · UI —— 每个都可独立替换</text>
  <text x="60" y="260" font-size="10" fill="#aed6f1">能力可换、接口稳定、依赖显式、观测插件化</text>
</svg>
