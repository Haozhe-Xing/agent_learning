<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-labelledby="title">
<title id="title">Scratchpad：可检查的任务状态</title>
<style>text { font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }</style>
<rect width="900" height="460" rx="14" fill="#f0f4f8"/>
<text x="450" y="37" text-anchor="middle" font-size="20" font-weight="bold" fill="#233447">Scratchpad：可检查的任务状态</text>
<rect x="30" y="110" width="260" height="180" rx="10" fill="#2c3e50"/>
<text x="160" y="141" text-anchor="middle" font-size="16" fill="white" font-weight="bold">结果与来源</text>
<text x="160" y="173" text-anchor="middle" font-size="12" fill="white">工具观测 / 模型提议 / 产物引用</text>
<text x="160" y="205" text-anchor="middle" font-size="12" fill="white">不保存内部私有推理</text>
<rect x="320" y="110" width="260" height="180" rx="10" fill="#236fa3"/>
<text x="450" y="141" text-anchor="middle" font-size="16" fill="white" font-weight="bold">任务隔离的状态</text>
<text x="450" y="173" text-anchor="middle" font-size="12" fill="white">按主体 + 任务 + 键定位</text>
<text x="450" y="205" text-anchor="middle" font-size="12" fill="white">容量不足明确失败，不静默淘汰</text>
<rect x="610" y="110" width="260" height="180" rx="10" fill="#73519a"/>
<text x="740" y="141" text-anchor="middle" font-size="16" fill="white" font-weight="bold">独立检查与使用</text>
<text x="740" y="173" text-anchor="middle" font-size="12" fill="white">observed / verified / rejected</text>
<text x="740" y="205" text-anchor="middle" font-size="12" fill="white">参考数据不能改固定系统规则</text>
<line x1="290" y1="200" x2="315" y2="200" stroke="#65758a" stroke-width="2"/><polygon points="315,200 307,196 307,204" fill="#65758a"/>
<line x1="580" y1="200" x2="605" y2="200" stroke="#65758a" stroke-width="2"/><polygon points="605,200 597,196 597,204" fill="#65758a"/>
<rect x="30" y="402" width="840" height="40" rx="8" fill="#fff0e9" stroke="#c46b3e"/>
<text x="450" y="427" text-anchor="middle" font-size="12" fill="#873a24">完成或取消后按策略清理；跨会话保留另需同意和治理。</text>
</svg>
