<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#74889a"/></marker></defs>
<rect width="800" height="420" rx="12" fill="#f3f6fa"/>
<text x="400" y="31" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#243746" font-weight="bold">发布资料审查：通过、失败与耗尽分别结束</text>
<rect x="35" y="148" width="80" height="64" rx="10" fill="#334e68"/>
<text x="75" y="184" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="12" fill="white" font-weight="bold">START</text>
<line x1="115" y1="180" x2="150" y2="180" stroke="#74889a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="152" y="145" width="145" height="70" rx="10" fill="#277fba"/>
<text x="224" y="169" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="12" fill="white" font-weight="bold">独立检查</text>
<text x="224" y="188" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="11" fill="white">analyze</text>
<text x="224" y="205" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="10" fill="white">必需字段非空</text>
<line x1="297" y1="180" x2="340" y2="180" stroke="#74889a" stroke-width="2" marker-end="url(#arrow)"/>
<polygon points="400,140 460,180 400,220 340,180" fill="#ca7b16"/>
<text x="400" y="177" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="11" fill="white" font-weight="bold">结果</text>
<text x="400" y="192" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="8" fill="white">route_review</text>
<line x1="460" y1="180" x2="620" y2="180" stroke="#28835d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="540" y="168" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="10" fill="#22784f">无问题</text>
<rect x="622" y="150" width="140" height="60" rx="10" fill="#28835d"/>
<text x="692" y="175" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="12" fill="white" font-weight="bold">accepted</text>
<text x="692" y="194" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="10" fill="white">独立检查通过</text>
<line x1="400" y1="140" x2="400" y2="110" stroke="#bb4444" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="292" y="62" width="216" height="46" rx="10" fill="#bb4444"/>
<text x="400" y="80" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="11" fill="white" font-weight="bold">failed / budget_exhausted</text>
<text x="400" y="97" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="10" fill="white">错误或有问题且次数耗尽</text>
<line x1="400" y1="220" x2="400" y2="272" stroke="#a26920" stroke-width="2" marker-end="url(#arrow)"/>
<text x="500" y="243" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="10" fill="#975b13">有问题且有剩余次数</text>
<rect x="330" y="275" width="140" height="60" rx="10" fill="#8554a6"/>
<text x="400" y="298" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="12" fill="white" font-weight="bold">提出固定修订</text>
<text x="400" y="318" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="11" fill="white">repair</text>
<path d="M330 305 L224 305 L224 216" fill="none" stroke="#277fba" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
<text x="232" y="276" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="10" fill="#277fba">重新检查</text>
<path d="M152 154 L130 154 L130 85 L291 85" fill="none" stroke="#bb4444" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
<text x="180" y="74" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="9" fill="#bb4444">适配器错误</text>
<rect x="580" y="273" width="180" height="62" rx="10" fill="#e5edf5"/>
<text x="670" y="294" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#334e68" font-weight="bold">attempts += 1</text>
<text x="670" y="312" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="10" fill="#243746">每次审查计数</text>
<text x="670" y="327" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="10" fill="#243746">最多 max_attempts 次</text>
<rect x="40" y="357" width="720" height="48" rx="10" fill="white"/>
<text x="400" y="376" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#243746" font-weight="bold">上限停止 ≠ 通过；修订后仍须检查</text>
<text x="400" y="394" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="10" fill="#526879">图步数、业务次数和墙钟时间是不同预算</text>
</svg>
