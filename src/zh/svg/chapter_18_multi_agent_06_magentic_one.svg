<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
<title id="title">Magentic-One：两种台账与专门执行主体</title>
<desc id="desc">Original explanatory diagram after https://arxiv.org/html/2411.04468v1 §4. Ledgers guide orchestration and do not provide independent task acceptance. No paper artwork reproduced.</desc>
<metadata>Original illustration created for this book; no paper artwork or screenshot reproduced. Repository MIT license applies to this illustration.</metadata>
<style>text { font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }</style>
<rect width="960" height="500" rx="14" fill="#f1f5f9"/>
<text x="480" y="43" text-anchor="middle" font-size="23" font-weight="bold" fill="#22384c">Magentic-One：两种台账与专门执行主体</text>
<text x="480" y="78" text-anchor="middle" font-size="16" fill="#44596d" font-weight="bold">Orchestrator：外循环与内循环</text>
<rect x="45" y="105" width="385" height="135" rx="12" fill="#2d4965"/>
<text x="237.5" y="139" text-anchor="middle" font-size="20" fill="white" font-weight="bold">Task ledger</text>
<text x="237.5" y="177" text-anchor="middle" font-size="15" fill="white">已知 / 待查 / 待推导 / 猜测</text>
<text x="237.5" y="209" text-anchor="middle" font-size="15" fill="white">任务计划；必要时重规划</text>
<rect x="530" y="105" width="385" height="135" rx="12" fill="#287598"/>
<text x="722.5" y="139" text-anchor="middle" font-size="20" fill="white" font-weight="bold">Progress ledger</text>
<text x="722.5" y="177" text-anchor="middle" font-size="15" fill="white">完成？停滞？下一位执行者？</text>
<text x="722.5" y="209" text-anchor="middle" font-size="15" fill="white">当前指令；观察执行反馈</text>
<path d="M 435 173 L 517 173" fill="none" stroke="#738296" stroke-width="2"/>
<path d="M 517 168 L 525 173 L 517 178" fill="none" stroke="#738296" stroke-width="2"/>
<text x="480" y="263" text-anchor="middle" font-size="14" fill="#44596d">按需派发；结果与失败反馈回协调者</text>
<rect x="35" y="288" width="215" height="78" rx="10" fill="#fdfefe" stroke="#a8b9c8"/>
<text x="142.5" y="320" text-anchor="middle" font-size="16" fill="#273f56" font-weight="bold">WebSurfer</text>
<text x="142.5" y="347" text-anchor="middle" font-size="14" fill="#44596d">浏览器交互</text>
<rect x="270" y="288" width="215" height="78" rx="10" fill="#fdfefe" stroke="#a8b9c8"/>
<text x="377.5" y="320" text-anchor="middle" font-size="16" fill="#273f56" font-weight="bold">FileSurfer</text>
<text x="377.5" y="347" text-anchor="middle" font-size="14" fill="#44596d">文件预览导航</text>
<rect x="505" y="288" width="215" height="78" rx="10" fill="#fdfefe" stroke="#a8b9c8"/>
<text x="612.5" y="320" text-anchor="middle" font-size="16" fill="#273f56" font-weight="bold">Coder</text>
<text x="612.5" y="347" text-anchor="middle" font-size="14" fill="#44596d">编写与修改代码</text>
<rect x="740" y="288" width="215" height="78" rx="10" fill="#fdfefe" stroke="#a8b9c8"/>
<text x="847.5" y="320" text-anchor="middle" font-size="16" fill="#273f56" font-weight="bold">ComputerTerminal</text>
<text x="847.5" y="347" text-anchor="middle" font-size="14" fill="#44596d">执行代码 / 命令</text>
<rect x="30" y="395" width="900" height="68" rx="9" fill="#fff3e9" stroke="#be8156"/>
<text x="480" y="421" text-anchor="middle" font-size="14" fill="#754325">这是控制流示意；协调者声称完成不等于独立任务验收。</text>
<text x="480" y="447" text-anchor="middle" font-size="14" fill="#754325">图不证明生产权限、隔离安全或通用任务成功率。</text>
<text x="480" y="490" text-anchor="middle" font-size="11" fill="#58667a">本书原创示意，依据 Fourney et al., v1 §4 (2024)</text>
</svg>
