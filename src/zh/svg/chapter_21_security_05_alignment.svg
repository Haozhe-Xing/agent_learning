<g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
<text x="480" y="42" font-size="24" font-weight="700" fill="#172c4f">不同层次，分别提供证据</text>
<rect x="24" y="81" width="207" height="80" rx="12" fill="#dbeafe" stroke="#91a2bb"/>
<text x="127.5" y="129" font-size="20" fill="#172c4f">训练目标</text>
<path d="M236 121h17m-6-5 6 5-6 5" fill="none" stroke="#52647e" stroke-width="2"/>
<rect x="259" y="81" width="207" height="80" rx="12" fill="#e0e7ff" stroke="#91a2bb"/>
<text x="362.5" y="129" font-size="20" fill="#172c4f">宿主策略</text>
