<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
<title id="title">FActScore：支撑比例与任务覆盖不同</title>
<desc id="desc">Original explanatory diagram after https://arxiv.org/html/2305.14251v2 §§3–4 and Limitations; coverage is a separate book acceptance check. No paper artwork reproduced.</desc>
<metadata>Original illustration created for this book; no paper artwork or screenshot reproduced. Repository MIT license applies to this illustration.</metadata>
<style>text { font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }</style>
<rect width="960" height="500" rx="14" fill="#f1f5f9"/>
<text x="480" y="43" text-anchor="middle" font-size="23" font-weight="bold" fill="#22384c">FActScore：支撑比例与任务覆盖不同</text>
<rect x="30" y="95" width="280" height="255" rx="12" fill="#2d4965"/>
<text x="170" y="130" text-anchor="middle" font-size="18" fill="white" font-weight="bold">拆分回答</text>
<text x="170" y="177" text-anchor="middle" font-size="14" fill="white">把生成文本拆为原子事实</text>
<text x="170" y="216" text-anchor="middle" font-size="14" fill="white">一句话可能包含多个主张</text>
<text x="170" y="255" text-anchor="middle" font-size="14" fill="white">保留待检查的事实清单</text>
<text x="170" y="294" text-anchor="middle" font-size="14" fill="white">拆分本身也可能出错</text>
<rect x="340" y="95" width="280" height="255" rx="12" fill="#287598"/>
<text x="480" y="130" text-anchor="middle" font-size="18" fill="white" font-weight="bold">对照指定来源</text>
<text x="480" y="177" text-anchor="middle" font-size="14" fill="white">逐条寻找支撑证据</text>
<text x="480" y="216" text-anchor="middle" font-size="14" fill="white">人物传记 / Wikipedia 实验</text>
<text x="480" y="255" text-anchor="middle" font-size="14" fill="white">自动估计器仍会误判</text>
<text x="480" y="294" text-anchor="middle" font-size="14" fill="white">没有检索到不等于已证伪</text>
<rect x="650" y="95" width="280" height="255" rx="12" fill="#72608a"/>
<text x="790" y="130" text-anchor="middle" font-size="18" fill="white" font-weight="bold">事实支撑精度</text>
<text x="790" y="177" text-anchor="middle" font-size="14" fill="white">得到支持的原子事实比例</text>
<text x="790" y="216" text-anchor="middle" font-size="14" fill="white">相对于给定知识来源</text>
<text x="790" y="255" text-anchor="middle" font-size="14" fill="white">不直接衡量必答信息覆盖</text>
<text x="790" y="294" text-anchor="middle" font-size="14" fill="white">少答一个真事实仍可能漏项</text>
<path d="M 312 220 L 327 220" fill="none" stroke="#738296" stroke-width="2"/>
<path d="M 327 215 L 335 220 L 327 225" fill="none" stroke="#738296" stroke-width="2"/>
<path d="M 622 220 L 637 220" fill="none" stroke="#738296" stroke-width="2"/>
<path d="M 637 215 L 645 220 L 637 225" fill="none" stroke="#738296" stroke-width="2"/>
<rect x="30" y="385" width="900" height="83" rx="9" fill="#fff3e9" stroke="#be8156"/>
<text x="480" y="414" text-anchor="middle" font-size="14" fill="#754325">本书另查任务覆盖：期限与凭证是否都被回答？</text>
<text x="480" y="442" text-anchor="middle" font-size="14" fill="#754325">字面摘录检查不是 FActScore 自动估计器；支撑与完整性分别验收。</text>
<text x="480" y="490" text-anchor="middle" font-size="11" fill="#58667a">本书原创示意；固定版本与证据边界见正文。</text>
</svg>
