<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-labelledby="title">
<title id="title">两条回答路径，都需要验收</title>
<style>text { font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }</style>
<rect width="900" height="460" rx="14" fill="#f0f4f8"/>
<text x="450" y="37" text-anchor="middle" font-size="20" font-weight="bold" fill="#233447">两条回答路径，都需要验收</text>
<rect x="55" y="110" width="350" height="210" rx="10" fill="#2c3e50"/>
<text x="230" y="141" text-anchor="middle" font-size="16" fill="white" font-weight="bold">直接生成</text>
<text x="230" y="173" text-anchor="middle" font-size="12" fill="white">根据模型现有能力与当前输入回答</text>
<text x="230" y="205" text-anchor="middle" font-size="12" fill="white">适用性由任务决定</text>
<text x="230" y="237" text-anchor="middle" font-size="12" fill="white">没有指定资料不代表必错</text>
<rect x="495" y="110" width="350" height="210" rx="10" fill="#236fa3"/>
<text x="670" y="141" text-anchor="middle" font-size="16" fill="white" font-weight="bold">检索增强</text>
<text x="670" y="173" text-anchor="middle" font-size="12" fill="white">先选择获准资料，再构造回答</text>
<text x="670" y="205" text-anchor="middle" font-size="12" fill="white">增加解析、索引和召回故障</text>
<text x="670" y="237" text-anchor="middle" font-size="12" fill="white">有来源不代表主张正确或要求齐全</text>
<rect x="30" y="402" width="840" height="40" rx="8" fill="#fff0e9" stroke="#c46b3e"/>
<text x="450" y="427" text-anchor="middle" font-size="12" fill="#873a24">使用同一任务要求检查结果；不能用两次随意输出证明质量差异。</text>
</svg>
