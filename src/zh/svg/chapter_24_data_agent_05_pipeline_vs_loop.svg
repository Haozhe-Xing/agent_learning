<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" width="560" height="280" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6366f1"/>
    </marker>
  </defs>
  <rect width="560" height="280" rx="12" fill="#f8fafc"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">管道式 vs Agent 循环架构</text>

  <!-- 管道式 -->
  <rect x="16" y="46" width="528" height="60" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="280" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">宿主定义流水线（集成设计）</text>
  <text x="30" y="84" font-size="10" fill="#1d4ed8">用户问题</text>
  <text x="100" y="84" font-size="10" fill="#1d4ed8">→ SQL 候选</text>
  <text x="195" y="84" font-size="10" fill="#1d4ed8">→ 只读查询</text>
  <text x="270" y="84" font-size="10" fill="#1d4ed8">→ 统计</text>
  <text x="345" y="84" font-size="10" fill="#1d4ed8">→ 图表</text>
  <text x="420" y="84" font-size="10" fill="#1d4ed8">→ 洞察</text>
  <text x="495" y="84" font-size="10" fill="#1d4ed8">→ 报告</text>
  <text x="280" y="100" text-anchor="middle" font-size="10" fill="#1d4ed8">已有 SQL 边界；后续分析、图表与报告需补齐验收</text>

  <!-- Agent 循环 -->
  <rect x="16" y="118" width="528" height="60" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="280" y="136" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">Agent 循环（可选设计，控制器未提供）</text>
  <text x="30" y="156" font-size="10" fill="#15803d">用户问题</text>
  <text x="100" y="156" font-size="10" fill="#15803d">→ 决策</text>
  <text x="150" y="156" font-size="10" fill="#15803d">→ 工具</text>
  <text x="225" y="156" font-size="10" fill="#15803d">→ 执行</text>
  <text x="270" y="156" font-size="10" fill="#15803d">→ 观察</text>
  <text x="355" y="156" font-size="10" fill="#15803d">→ 决策</text>
  <text x="400" y="156" font-size="10" fill="#15803d">→ ...</text>
  <text x="440" y="156" font-size="10" fill="#15803d">→ 候选产物</text>
  <text x="280" y="172" text-anchor="middle" font-size="10" fill="#15803d">同样需要许可、次数/时间/结果预算和停止条件</text>

  <!-- 对比表 -->
  <rect x="16" y="190" width="528" height="80" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="280" y="208" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">先固定任务与验收标准</text>
  <text x="30" y="226" font-size="10" fill="#475569">调用次数：记录实际请求与重试，不由步骤数推定</text>
  <text x="30" y="242" font-size="10" fill="#475569">费用/时延：同任务实测；本章未提供对照结果</text>
  <text x="30" y="258" font-size="10" fill="#475569">交付：候选产物必须通过独立任务验收</text>
</svg>