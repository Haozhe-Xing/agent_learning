<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 590" role="img" aria-labelledby="title desc" font-family="Arial, PingFang SC, sans-serif">
<title id="title">MemGPT：存储与当前可见内容</title><desc id="desc">有限主上下文包括系统指令、工作区与FIFO队列。外部召回和归档存储通过显式函数访问。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8Z" fill="#475569"/></marker></defs>
<rect width="560" height="590" rx="12" fill="#fff"/>
<text x="280" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">MemGPT：存储与当前可见内容</text>
<rect x="30" y="62" width="500" height="230" rx="9" fill="#eff6ff" stroke="#64748b"/>
<text x="280.0" y="90" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">主上下文：有限的输入窗口</text>
<rect x="48" y="105" width="464" height="52" rx="9" fill="#fff" stroke="#64748b"/>
<text x="280.0" y="133" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">系统指令：只读</text>
<rect x="48" y="163" width="464" height="52" rx="9" fill="#fff" stroke="#64748b"/>
<text x="280.0" y="191" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">工作区：通过函数编辑</text>
<rect x="48" y="221" width="464" height="52" rx="9" fill="#fff" stroke="#64748b"/>
<text x="280.0" y="249" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">FIFO队列：近期消息与摘要</text>
<path d="M160,292 L160,388" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="345" y="327" text-anchor="middle" font-size="17" font-weight="normal" fill="#1e293b">显式函数搬运数据</text>
<text x="345" y="352" text-anchor="middle" font-size="17" font-weight="normal" fill="#1e293b">容量预警与队列淘汰</text>
<rect x="30" y="390" width="500" height="105" rx="9" fill="#f5f3ff" stroke="#64748b"/>
<text x="280.0" y="418" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">外部上下文：窗口之外</text>
<text x="280.0" y="445" text-anchor="middle" font-size="17" font-weight="normal" fill="#1e293b">召回存储：历史消息</text>
<text x="280.0" y="469" text-anchor="middle" font-size="17" font-weight="normal" fill="#1e293b">归档存储：额外内容</text>
<text x="280" y="536" text-anchor="middle" font-size="16" font-weight="normal" fill="#1e293b">保存于外部 ≠ 当前可见 ≠ 正确召回</text>
<text x="280" y="576" text-anchor="middle" font-size="14" font-weight="normal" fill="#475569">本书重绘，依据 Packer et al., v2 §2 (2024)</text>
</svg>
