<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="700" height="440">
  <defs>
    <style>text { font-family: 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif; }</style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#7f8c8d"/>
    </marker>
  </defs>
  <rect width="700" height="440" rx="14" fill="#f0f4f8"/>
  <text x="350" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">Harness 系统架构：Agent 主体 + 5 个治理模块</text>
  <text x="350" y="50" text-anchor="middle" font-size="10" fill="#7f8c8d">Agent 每次循环都经过 5 道治理闸门，失败率在一周内下降约一半</text>

  <!-- Agent 主体 -->
  <rect x="250" y="66" width="200" height="48" rx="8" fill="#2c3e50"/>
  <text x="350" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Agent 主体（agent.py）</text>
  <text x="350" y="104" text-anchor="middle" font-size="10" fill="#bdc3c7">Plan-Build-Verify-Fix 循环</text>

  <!-- 向下箭头 -->
  <line x1="350" y1="114" x2="350" y2="136" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 5 个治理模块（两排） -->
  <!-- 第一排：ContextManager / ToolRegistry -->
  <rect x="60" y="140" width="270" height="90" rx="8" fill="#3498db"/>
  <text x="195" y="164" text-anchor="middle" font-size="12" font-weight="bold" fill="white">ContextManager 上下文管理</text>
  <text x="195" y="184" text-anchor="middle" font-size="10" fill="#d6eaf8">监控利用率 · 超 40% 渐进压缩</text>
  <text x="195" y="200" text-anchor="middle" font-size="10" fill="#d6eaf8">超 70% 告警 · 防上下文焦虑</text>
  <text x="195" y="220" text-anchor="middle" font-size="9" fill="#aed6f1" font-style="italic">Step 2</text>

  <rect x="370" y="140" width="270" height="90" rx="8" fill="#e67e22"/>
  <text x="505" y="164" text-anchor="middle" font-size="12" font-weight="bold" fill="white">ToolRegistry 工具注册表</text>
  <text x="505" y="184" text-anchor="middle" font-size="10" fill="#fdebd0">权限分层（只读/写入/危险）</text>
  <text x="505" y="200" text-anchor="middle" font-size="10" fill="#fdebd0">危险操作拦截 · 白名单</text>
  <text x="505" y="220" text-anchor="middle" font-size="9" fill="#fadbd8" font-style="italic">Step 3</text>

  <!-- 第二排：ValidationGate / LoopDetector / Observability -->
  <rect x="60" y="250" width="200" height="90" rx="8" fill="#9b59b6"/>
  <text x="160" y="274" text-anchor="middle" font-size="12" font-weight="bold" fill="white">ValidationGate 验证门控</text>
  <text x="160" y="294" text-anchor="middle" font-size="10" fill="#e8daef">自验证循环</text>
  <text x="160" y="310" text-anchor="middle" font-size="10" fill="#e8daef">测试不过 → 自动修复</text>
  <text x="160" y="330" text-anchor="middle" font-size="9" fill="#d2b4de" font-style="italic">Step 4</text>

  <rect x="280" y="250" width="180" height="90" rx="8" fill="#16a085"/>
  <text x="370" y="274" text-anchor="middle" font-size="12" font-weight="bold" fill="white">LoopDetector</text>
  <text x="370" y="294" text-anchor="middle" font-size="10" fill="#d1f2eb">死循环检测</text>
  <text x="370" y="310" text-anchor="middle" font-size="10" fill="#d1f2eb">检测重复 → 切换策略</text>
  <text x="370" y="330" text-anchor="middle" font-size="9" fill="#a3e4d7" font-style="italic">Step 5</text>

  <rect x="480" y="250" width="180" height="90" rx="8" fill="#27ae60"/>
  <text x="570" y="274" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Observability</text>
  <text x="570" y="294" text-anchor="middle" font-size="10" fill="#d5f5e3">可观测性</text>
  <text x="570" y="310" text-anchor="middle" font-size="10" fill="#d5f5e3">仪表盘 · 实时监控</text>
  <text x="570" y="330" text-anchor="middle" font-size="9" fill="#a9dfbf" font-style="italic">（附在 agent.py）</text>

  <!-- Agent 到各模块的连线 -->
  <line x1="350" y1="136" x2="195" y2="136" stroke="#7f8c8d" stroke-width="1.5"/>
  <line x1="350" y1="136" x2="505" y2="136" stroke="#7f8c8d" stroke-width="1.5"/>
  <line x1="195" y1="136" x2="195" y2="136" stroke="#7f8c8d" stroke-width="1.5"/>
  <line x1="505" y1="136" x2="505" y2="136" stroke="#7f8c8d" stroke-width="1.5"/>

  <!-- 底部：AGENTS.md 宪法 -->
  <rect x="200" y="360" width="300" height="56" rx="8" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5"/>
  <text x="350" y="382" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a7d0a">AGENTS.md（Agent 宪法）</text>
  <text x="350" y="400" text-anchor="middle" font-size="10" fill="#b7950b">强制工作流 · 架构约束 · 禁止操作 —— 5 个模块都按它执行</text>
  <text x="350" y="416" text-anchor="middle" font-size="9" fill="#9a7d0a" font-style="italic">Step 1</text>

  <line x1="350" y1="340" x2="350" y2="358" stroke="#f39c12" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
</svg>
