<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330">
  <defs>
    <style>text { font-family: 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif; }</style>
    <marker id="arrow-down" markerWidth="8" markerHeight="8" refX="3" refY="6" orient="auto">
      <path d="M0,0 L6,0 L3,8 z" fill="#3498db"/>
    </marker>
    <marker id="arrow-up" markerWidth="8" markerHeight="8" refX="3" refY="0" orient="auto">
      <path d="M0,8 L6,8 L3,0 z" fill="#27ae60"/>
    </marker>
  </defs>
  <rect width="640" height="330" rx="14" fill="#f0f4f8"/>
  <text x="320" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">长期记忆机制（memdir）</text>

  <!-- 长期记忆层 -->
  <rect x="30" y="48" width="580" height="104" rx="10" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="320" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#155724">💾 长期记忆层（跨会话持久）</text>

  <rect x="50" y="82" width="250" height="54" rx="8" fill="#28a745"/>
  <text x="175" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="white">~/.claude/CLAUDE.md</text>
  <text x="175" y="122" text-anchor="middle" font-size="11" fill="#d5f5e3">全局永久记忆 · 所有项目始终加载</text>

  <rect x="340" y="82" width="250" height="54" rx="8" fill="#28a745"/>
  <text x="465" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="white">项目 / CLAUDE.md</text>
  <text x="465" y="122" text-anchor="middle" font-size="11" fill="#d5f5e3">项目级永久记忆 · 在该项目始终加载</text>

  <!-- 会话状态层 -->
  <rect x="30" y="196" width="580" height="92" rx="10" fill="#eaf4fb" stroke="#3498db" stroke-width="2"/>
  <text x="320" y="218" text-anchor="middle" font-size="13" font-weight="bold" fill="#2980b9">⏱️ 会话状态层（会话内临时）</text>

  <rect x="160" y="230" width="320" height="42" rx="8" fill="#3498db"/>
  <text x="320" y="250" text-anchor="middle" font-size="12" font-weight="bold" fill="white">上下文窗口</text>
  <text x="320" y="266" text-anchor="middle" font-size="11" fill="#d6eaf8">当前对话历史 · 受压缩管理</text>

  <!-- 加载箭头（长期 → 会话，向下）-->
  <line x1="180" y1="152" x2="180" y2="226" stroke="#3498db" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-down)"/>
  <text x="190" y="192" font-size="11" fill="#3498db" font-weight="bold">会话启动时自动加载 ↓</text>

  <!-- 写入箭头（会话 → 长期，向上）-->
  <line x1="460" y1="230" x2="460" y2="156" stroke="#27ae60" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-up)"/>
  <text x="470" y="196" font-size="11" fill="#27ae60" font-weight="bold"># 快捷键 / /memory 写入 ↑</text>

  <!-- 底部说明 -->
  <rect x="30" y="298" width="580" height="24" rx="6" fill="#e8f4fd"/>
  <text x="320" y="314" text-anchor="middle" font-size="11" fill="#2980b9">💡 用 # 快捷键把关键决策存入 memdir，下次会话自动加载，无需重复解释背景</text>
</svg>
