<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 660" role="img" aria-labelledby="title desc" font-family="Arial, PingFang SC, sans-serif"><title id="title">检索、融合与重排</title><desc id="desc">单条候选也须评分；提议不是验收。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#475569"/></marker></defs><rect width="560" height="660" rx="12" fill="white"/><text x="280" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">检索、融合与重排</text><rect x="30" y="60" width="500" height="58" rx="9" fill="#eff6ff" stroke="#64748b"/><text x="280.0" y="88" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">原始问题</text><path d="M180,118 L155,153" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M380,118 L405,153" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="155" width="235" height="80" rx="9" fill="#eff6ff" stroke="#64748b"/><text x="147.5" y="183" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">向量候选</text><text x="147.5" y="208" text-anchor="middle" font-size="17" font-weight="normal" fill="#1e293b">共享稳定ID</text><rect x="295" y="155" width="235" height="80" rx="9" fill="#fff7ed" stroke="#64748b"/><text x="412.5" y="183" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">BM25候选</text><text x="412.5" y="208" text-anchor="middle" font-size="17" font-weight="normal" fill="#1e293b">共享稳定ID</text><path d="M155,235 L240,278" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M405,235 L320,278" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="280" width="500" height="80" rx="9" fill="#f5f3ff" stroke="#64748b"/><text x="280.0" y="308" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">RRF按ID融合</text><text x="280.0" y="333" text-anchor="middle" font-size="17" font-weight="normal" fill="#1e293b">限制每路及最终候选数量</text><path d="M280,360 L280,398" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="400" width="500" height="80" rx="9" fill="#ecfdf5" stroke="#64748b"/><text x="280.0" y="428" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">校验评分提议</text><text x="280.0" y="453" text-anchor="middle" font-size="17" font-weight="normal" fill="#1e293b">未知、重复或缺失ID均拒绝</text><path d="M280,480 L280,518" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="520" width="500" height="80" rx="9" fill="#eff6ff" stroke="#64748b"/><text x="280.0" y="548" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">候选来源交给回答阶段</text><text x="280.0" y="573" text-anchor="middle" font-size="17" font-weight="normal" fill="#1e293b">另查原文支持与需求覆盖</text><text x="280" y="638" text-anchor="middle" font-size="17" fill="#334155">单条候选也须评分；提议不是验收。</text></svg>
