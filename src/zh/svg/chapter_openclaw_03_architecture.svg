<svg xmlns="http://www.w3.org/2000/svg" width="760" height="640" viewBox="0 0 760 640" role="img" aria-labelledby="title desc">
<title id="title">OpenClaw 案例：四种责任与两条边界</title>
<desc id="desc">Skills进入上下文；策略约束执行；工具结果返回模型；候选答复再验收与投递。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#52667d"/></marker></defs>
<rect width="760" height="640" rx="16" fill="#f4f7fb"/>
<g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif">
<text x="380" y="29" font-size="18" fill="#223449" font-weight="bold" text-anchor="middle">OpenClaw 案例：四种责任与两条边界</text>
<text x="380" y="51" font-size="12" fill="#52667d" font-weight="normal" text-anchor="middle">本书解释模型：不是官方类、事件类型或进程划分</text>
<rect x="28" y="76" width="448" height="72" rx="10" fill="#e6edf5" stroke="#d1dbe7"/>
<text x="252" y="103" font-size="15" fill="#223449" font-weight="bold" text-anchor="middle">渠道接入与投递</text>
<text x="252" y="126" font-size="11.5" fill="#223449" font-weight="normal" text-anchor="middle">渠道 · 账号 · 发送者 · 房间 / 线程 · 消息ID</text>
<rect x="28" y="174" width="448" height="72" rx="10" fill="#e1effb" stroke="#d1dbe7"/>
<text x="252" y="201" font-size="15" fill="#223449" font-weight="bold" text-anchor="middle">Gateway 与会话编排</text>
<text x="252" y="224" font-size="11.5" fill="#223449" font-weight="normal" text-anchor="middle">所选Agent · 会话范围 · 历史写入归属</text>
<rect x="28" y="272" width="448" height="86" rx="10" fill="#eee8fa" stroke="#d1dbe7"/>
<text x="252" y="299" font-size="15" fill="#223449" font-weight="bold" text-anchor="middle">上下文与模型提议</text>
<text x="252" y="322" font-size="11.5" fill="#223449" font-weight="normal" text-anchor="middle">保留角色、来源以及工具调用 / 结果对应关系</text>
<rect x="28" y="394" width="448" height="86" rx="10" fill="#fff0dd" stroke="#d1dbe7"/>
<text x="252" y="421" font-size="15" fill="#223449" font-weight="bold" text-anchor="middle">宿主控制的工具执行</text>
<text x="252" y="444" font-size="11.5" fill="#223449" font-weight="normal" text-anchor="middle">名称 / 参数 / 资源许可 / 预算；失败保留原因</text>
<line x1="252" y1="148" x2="252" y2="173" stroke="#52667d" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="252" y1="246" x2="252" y2="271" stroke="#52667d" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="164" y1="358" x2="164" y2="393" stroke="#52667d" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="341" y1="394" x2="341" y2="359" stroke="#52667d" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="171" y="383" font-size="10" fill="#223449" font-weight="normal" text-anchor="start">工具提议</text>
<text x="348" y="383" font-size="10" fill="#223449" font-weight="normal" text-anchor="start">调用结果</text>
<rect x="510" y="272" width="222" height="86" rx="10" fill="#e4f4e9" stroke="#d1dbe7"/>
<text x="621" y="295" font-size="14" fill="#223449" font-weight="bold" text-anchor="middle">Skills / 资料</text>
<text x="621" y="318" font-size="11.5" fill="#223449" font-weight="normal" text-anchor="middle">带来源的指导与证据</text>
<text x="621" y="338" font-size="11.5" fill="#223449" font-weight="normal" text-anchor="middle">不是工具执行授权</text>
<rect x="510" y="394" width="222" height="86" rx="10" fill="#f9e8e8" stroke="#d1dbe7"/>
<text x="621" y="417" font-size="14" fill="#223449" font-weight="bold" text-anchor="middle">宿主执行策略</text>
<text x="621" y="440" font-size="11.5" fill="#223449" font-weight="normal" text-anchor="middle">工具许可与资源限制</text>
<text x="621" y="460" font-size="11.5" fill="#223449" font-weight="normal" text-anchor="middle">沙箱依实际配置启用</text>
<line x1="510" y1="311" x2="477" y2="311" stroke="#52667d" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<line x1="510" y1="437" x2="477" y2="437" stroke="#52667d" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<path d="M476,335 H492 V519" fill="none" stroke="#52667d" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="486" y="502" font-size="10" fill="#223449" font-weight="normal" text-anchor="end">候选答复</text>
<rect x="28" y="520" width="704" height="64" rx="10" fill="#e8f2ef" stroke="#b3d2c7"/>
<text x="380" y="545" font-size="14" fill="#223449" font-weight="bold" text-anchor="middle">按已记录的渠道 / 账号 / 房间 / 线程回包</text>
<text x="380" y="567" font-size="12" fill="#223449" font-weight="normal" text-anchor="middle">实际投递证据，与独立任务验收分开记录</text>
<text x="380" y="609" font-size="11.5" fill="#52667d" font-weight="normal" text-anchor="middle">固定材料阅读：v2026.10.5；本节未安装产品或验证实际渠道</text>
<text x="380" y="628" font-size="11" fill="#52667d" font-weight="normal" text-anchor="middle">Skills进入上下文；策略约束执行；工具结果返回模型；候选答复再验收与投递。</text>
</g></svg>
