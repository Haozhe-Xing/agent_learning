<svg xmlns="http://www.w3.org/2000/svg" width="920" height="460" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">任务拆分：依赖有效不等于产物已达标</title>
  <desc id="desc">先验证有界依赖图，再检查实际产物；两种覆盖不能混为一谈。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#64748b" />
    </marker>
  </defs>
  <rect width="920" height="460" fill="#f8fafc" />
  <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="460" y="35" font-size="22" fill="#0f172a" font-weight="bold" text-anchor="middle">任务拆分：依赖有效不等于产物已达标</text>
    <rect x="24" y="64" width="872" height="48" rx="9" fill="#e8eef7" />
    <text x="460" y="89" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">执行前：唯一 ID、注册操作、已知依赖、无环、load 祖先、三项目标覆盖</text>
    <rect x="24" y="155" width="250" height="130" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" />
    <text x="149.0" y="183" font-size="17" fill="#2563eb" font-weight="bold" text-anchor="middle">read：读取资料</text>
    <text x="149.0" y="210" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">value 与 source 配对</text>
    <text x="149.0" y="233" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">审批记录 / 预算 / 回退</text>
    <text x="149.0" y="256" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">失败时不伪造空结果</text>
    <rect x="334" y="155" width="250" height="130" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" />
    <text x="459.0" y="183" font-size="17" fill="#2563eb" font-weight="bold" text-anchor="middle">brief：依赖 read</text>
    <text x="459.0" y="210" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">只在依赖成功后运行</text>
    <text x="459.0" y="233" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">消费已读取的资料副本</text>
    <text x="459.0" y="256" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">covers 只是计划声明</text>
    <rect x="644" y="155" width="250" height="130" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="1.5" />
    <text x="769.0" y="183" font-size="17" fill="#15803d" font-weight="bold" text-anchor="middle">实际验收</text>
    <text x="769.0" y="210" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">三个字段均存在</text>
    <text x="769.0" y="233" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">逐项核对来源与冻结值</text>
    <text x="769.0" y="256" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">缺项 / 冲突 → 不接受</text>
    <path d="M 276 220 L 332 220" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
    <path d="M 586 220 L 642 220" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="24" y="325" width="872" height="72" rx="9" fill="#e8eef7" />
    <text x="460" y="350" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">实现按拓扑序串行执行；不会因为写出 depends_on 就自动获得并行或 HTN。</text>
    <text x="460" y="374" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">替换计划先验证，再清空旧产物；重新读取资料也使旧简报验收失效。</text>
  </g>
</svg>
