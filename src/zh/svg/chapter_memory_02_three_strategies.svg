<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-labelledby="title">
<title id="title">对话历史：选择策略与预算</title>
<style>text { font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }</style>
<rect width="900" height="460" rx="14" fill="#f0f4f8"/>
<text x="450" y="37" text-anchor="middle" font-size="20" font-weight="bold" fill="#233447">对话历史：选择策略与预算</text>
<rect x="30" y="110" width="260" height="180" rx="10" fill="#2c3e50"/>
<text x="160" y="141" text-anchor="middle" font-size="16" fill="white" font-weight="bold">全量保留</text>
<text x="160" y="173" text-anchor="middle" font-size="12" fill="white">本次携带全部历史</text>
<text x="160" y="205" text-anchor="middle" font-size="12" fill="white">仍须检查输入大小与输出预留</text>
<rect x="320" y="110" width="260" height="180" rx="10" fill="#236fa3"/>
<text x="450" y="141" text-anchor="middle" font-size="16" fill="white" font-weight="bold">滑动窗口</text>
<text x="450" y="173" text-anchor="middle" font-size="12" fill="white">选择最新完整轮次</text>
<text x="450" y="205" text-anchor="middle" font-size="12" fill="white">固定规则和当前问题不能被裁掉</text>
<rect x="610" y="110" width="260" height="180" rx="10" fill="#73519a"/>
<text x="740" y="141" text-anchor="middle" font-size="16" fill="white" font-weight="bold">摘要与近期历史</text>
<text x="740" y="173" text-anchor="middle" font-size="12" fill="white">摘要仍是带来源的数据</text>
<text x="740" y="205" text-anchor="middle" font-size="12" fill="white">可能遗漏或出错；不能升为系统规则</text>
<rect x="30" y="402" width="840" height="40" rx="8" fill="#fff0e9" stroke="#c46b3e"/>
<text x="450" y="427" text-anchor="middle" font-size="12" fill="#873a24">字节、字符与 token 不混用；超出必需输入预算应明确失败。</text>
</svg>
