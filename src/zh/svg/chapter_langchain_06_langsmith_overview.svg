<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-label="先观察本地执行，再自愿选择外部追踪">
<title>先观察本地执行，再自愿选择外部追踪</title><desc>Trace 解释执行路径；独立预期判断任务是否满足。两者不能相互代替。</desc>
<rect width="800" height="520" rx="16" fill="#f8fafc"/>
<g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<text x="28" y="37" font-size="22" fill="#1e293b" font-weight="600" text-anchor="start">先观察本地执行，再自愿选择外部追踪</text><text x="28" y="63" font-size="13" fill="#475569" font-weight="400" text-anchor="start">Trace 解释执行路径；独立预期判断任务是否满足。两者不能相互代替。</text><rect x="28" y="93" width="360" height="211" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="46" y="122" font-size="16" fill="#15803d" font-weight="600" text-anchor="start">本地路径：本章实际执行</text><text x="46" y="148" font-size="14" fill="#475569" font-weight="400" text-anchor="start">Runnable → 局部 Callback</text><text x="46" y="171" font-size="14" fill="#475569" font-weight="400" text-anchor="start">记录 run / parent ID、事件和错误类型</text><text x="46" y="194" font-size="14" fill="#475569" font-weight="400" text-anchor="start">仅允许指定的短元数据字段</text><text x="46" y="217" font-size="14" fill="#475569" font-weight="400" text-anchor="start">不记录输入、输出或异常正文</text><text x="46" y="240" font-size="14" fill="#475569" font-weight="400" text-anchor="start">可写新的本地 JSON 文件</text><rect x="412" y="93" width="360" height="211" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="430" y="122" font-size="16" fill="#b45309" font-weight="600" text-anchor="start">外部路径：读者自愿配置</text><text x="430" y="148" font-size="14" fill="#475569" font-weight="400" text-anchor="start">明确工作区、项目、凭据、端点</text><text x="430" y="171" font-size="14" fill="#475569" font-weight="400" text-anchor="start">先审查实际发送字段与保留规则</text><text x="430" y="194" font-size="14" fill="#475569" font-weight="400" text-anchor="start">选择允许追踪的调用范围</text><text x="430" y="217" font-size="14" fill="#475569" font-weight="400" text-anchor="start">本章未登录、未上传或调用服务</text><text x="430" y="240" font-size="14" fill="#475569" font-weight="400" text-anchor="start">enabled=False 可关闭练习外部追踪</text><rect x="28" y="329" width="744" height="126" rx="12" fill="#eff6ff" stroke="#93c5fd"/><text x="46" y="359" font-size="16" fill="#2563eb" font-weight="600" text-anchor="start">独立回归：冻结预期 + 正常与失败用例</text><text x="46" y="387" font-size="14" fill="#475569" font-weight="400" text-anchor="start">检查最终结果、失败是否保留、调用次数与取消边界。</text><text x="46" y="410" font-size="14" fill="#475569" font-weight="400" text-anchor="start">缓存命中的模型 Span 仍可能存在；Span 数不等于实际请求数。</text><text x="28" y="492" font-size="14" fill="#475569" font-weight="400" text-anchor="start">本地元数据也可能敏感；字段白名单不是隐私识别器。</text></g></svg>
