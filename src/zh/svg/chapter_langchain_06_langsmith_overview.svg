<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360">
  <defs>
    <style>text { font-family: 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif; }</style>
    <marker id="ls" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#8e44ad"/>
    </marker>
  </defs>
  <rect width="800" height="360" rx="12" fill="#f8f9fa"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2c3e50">LangSmith：LLM 应用的可观测性平台</text>

  <!-- 应用层 -->
  <rect x="240" y="54" width="320" height="42" rx="8" fill="#2980b9" opacity="0.18" stroke="#2980b9" stroke-width="2"/>
  <text x="400" y="73" text-anchor="middle" font-size="13" font-weight="bold" fill="#2980b9">🦜 LangChain / LangGraph 应用</text>
  <text x="400" y="89" text-anchor="middle" font-size="10" fill="#888">设置环境变量后，所有调用自动上报</text>

  <line x1="400" y1="96" x2="400" y2="120" stroke="#8e44ad" stroke-width="1.6" marker-end="url(#ls)"/>

  <!-- 三大核心能力 -->
  <!-- Tracing -->
  <rect x="40" y="124" width="230" height="150" rx="10" fill="#e67e22" opacity="0.12" stroke="#e67e22" stroke-width="2"/>
  <text x="155" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#e67e22">🔍 Tracing 追踪</text>
  <text x="155" y="176" text-anchor="middle" font-size="11" fill="#555">自动记录 LLM 调用链</text>
  <text x="155" y="196" text-anchor="middle" font-size="11" fill="#555">工具执行 / Agent 决策</text>
  <text x="155" y="216" text-anchor="middle" font-size="11" fill="#555">Token 成本 / 延迟分解</text>
  <text x="155" y="252" text-anchor="middle" font-size="10" fill="#999">回答"在哪一步卡住了？"</text>

  <!-- Evaluation -->
  <rect x="285" y="124" width="230" height="150" rx="10" fill="#27ae60" opacity="0.12" stroke="#27ae60" stroke-width="2"/>
  <text x="400" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">📊 Evaluation 评估</text>
  <text x="400" y="176" text-anchor="middle" font-size="11" fill="#555">创建数据集 Dataset</text>
  <text x="400" y="196" text-anchor="middle" font-size="11" fill="#555">自动评估流水线</text>
  <text x="400" y="216" text-anchor="middle" font-size="11" fill="#555">回归测试 / 打分对比</text>
  <text x="400" y="252" text-anchor="middle" font-size="10" fill="#999">回答"这次改动变好了吗？"</text>

  <!-- Prompt Management -->
  <rect x="530" y="124" width="230" height="150" rx="10" fill="#8e44ad" opacity="0.12" stroke="#8e44ad" stroke-width="2"/>
  <text x="645" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#8e44ad">📝 Prompt 管理</text>
  <text x="645" y="176" text-anchor="middle" font-size="11" fill="#555">Prompt 版本控制</text>
  <text x="645" y="196" text-anchor="middle" font-size="11" fill="#555">A/B 测试</text>
  <text x="645" y="216" text-anchor="middle" font-size="11" fill="#555">团队协作与复用</text>
  <text x="645" y="252" text-anchor="middle" font-size="10" fill="#999">回答"用哪版 Prompt 最好？"</text>

  <!-- 底部说明 -->
  <rect x="120" y="298" width="560" height="44" rx="8" fill="#34495e" opacity="0.08" stroke="#34495e" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="400" y="318" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#34495e">Trace（一次请求链路）→ 由多个 Run（单步调用）组成 → 按 Project 分组</text>
  <text x="400" y="335" text-anchor="middle" font-size="10" fill="#7f8c8d">从 demo 走向生产，可观测性是把"黑盒"变"白盒"的第一步</text>
</svg>
