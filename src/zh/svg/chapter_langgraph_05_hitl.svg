<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#74889a"/></marker></defs>
<rect width="800" height="420" rx="12" fill="#f3f6fa"/>
<text x="400" y="31" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#243746" font-weight="bold">人工协作：暂停、绑定操作、授权后再执行</text>
<rect x="40" y="97" width="150" height="72" rx="10" fill="#277fba"/>
<text x="115" y="121" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="12" fill="white" font-weight="bold">准备具体操作</text>
<text x="115" y="140" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="10" fill="white">request_id + notice</text>
<text x="115" y="156" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="10" fill="white">operation_digest</text>
<line x1="190" y1="133" x2="230" y2="133" stroke="#74889a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="232" y="97" width="155" height="72" rx="10" fill="#bc5c37"/>
<text x="309" y="121" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="12" fill="white" font-weight="bold">动态暂停</text>
<text x="309" y="141" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="11" fill="white">interrupt(payload)</text>
<text x="309" y="157" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="10" fill="white">尚无业务写入</text>
<line x1="388" y1="133" x2="450" y2="133" stroke="#74889a" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
<text x="419" y="120" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="9" fill="#243746">payload</text>
<rect x="452" y="97" width="235" height="72" rx="10" fill="#e2eaf3"/>
<text x="570" y="121" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#243746" font-weight="bold">调用者读取并决策</text>
<text x="570" y="141" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="10" fill="#243746">本地fixture，不提供身份认证</text>
<text x="570" y="157" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="10" fill="#243746">同一 thread_id 与保存器</text>
<line x1="570" y1="169" x2="570" y2="230" stroke="#74889a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="666" y="204" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="10" fill="#243746">Command(resume=...)</text>
<rect x="452" y="232" width="235" height="70" rx="10" fill="#997423"/>
<text x="570" y="254" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="12" fill="white" font-weight="bold">核对决策与宿主许可</text>
<text x="570" y="273" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="10" fill="white">批准 + 操作摘要 + 策略</text>
<text x="570" y="289" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="10" fill="white">执行前再次核对</text>
<line x1="452" y1="267" x2="405" y2="267" stroke="#bb4444" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="250" y="237" width="154" height="60" rx="10" fill="#bb4444"/>
<text x="327" y="261" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="12" fill="white" font-weight="bold">denied / failed</text>
<text x="327" y="281" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="10" fill="white">不写入收据</text>
<line x1="687" y1="267" x2="717" y2="267" stroke="#28835d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="719" y="232" width="68" height="70" rx="10" fill="#28835d"/>
<text x="753" y="254" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="11" fill="white" font-weight="bold">记录</text>
<text x="753" y="273" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="10" fill="white">SQLite</text>
<text x="753" y="289" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="10" fill="white">收据</text>
<rect x="40" y="232" width="178" height="70" rx="10" fill="#dce8f3"/>
<text x="129" y="253" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#334e68" font-weight="bold">InMemorySaver</text>
<text x="129" y="272" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="10" fill="#243746">当前进程内检查点</text>
<text x="129" y="289" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="10" fill="#243746">不等于磁盘收据库</text>
<path d="M129 232 L129 197 L309 197 L309 170" fill="none" stroke="#74889a" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
<rect x="40" y="340" width="747" height="65" rx="10" fill="white"/>
<text x="413" y="361" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#243746" font-weight="bold">恢复会重跑暂停节点；暂停前不做业务副作用</text>
<text x="413" y="380" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="10" fill="#526879">收据主键去重并核对payload；图检查点不保证远程副作用仅一次</text>
<text x="413" y="397" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="10" fill="#526879">本练习无外部发布、审批UI、真实身份认证或磁盘图恢复</text>
</svg>
