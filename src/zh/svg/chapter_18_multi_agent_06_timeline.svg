<text x="480" y="43" text-anchor="middle" font-size="23" font-weight="bold" fill="#22384c">多 Agent 论文：三组阅读问题</text>
<rect x="30" y="95" width="280" height="255" rx="12" fill="#2d4965"/>
<text x="170" y="130" text-anchor="middle" font-size="18" fill="white" font-weight="bold">协作设计 · 2023–2024</text>
<text x="170" y="177" text-anchor="middle" font-size="14" fill="white">MetaGPT / ChatDev</text>
<text x="170" y="216" text-anchor="middle" font-size="14" fill="white">工件、澄清与阶段依赖</text>
<text x="170" y="255" text-anchor="middle" font-size="14" fill="white">AutoGen / Magentic-One</text>
<text x="170" y="294" text-anchor="middle" font-size="14" fill="white">对话控制与进度台账</text>
<rect x="340" y="95" width="280" height="255" rx="12" fill="#287598"/>
<text x="480" y="130" text-anchor="middle" font-size="18" fill="white" font-weight="bold">评估与诊断 · 2025</text>
<text x="480" y="177" text-anchor="middle" font-size="14" fill="white">MultiAgentBench</text>
<text x="480" y="216" text-anchor="middle" font-size="14" fill="white">产物、里程碑与协作评价</text>
<text x="480" y="255" text-anchor="middle" font-size="14" fill="white">MAST</text>
<text x="480" y="294" text-anchor="middle" font-size="14" fill="white">设计、失配与验证失败</text>
<rect x="650" y="95" width="280" height="255" rx="12" fill="#72608a"/>
<text x="790" y="130" text-anchor="middle" font-size="18" fill="white" font-weight="bold">适用边界 · 2026</text>
<text x="790" y="177" text-anchor="middle" font-size="14" fill="white">SAIGE（选读预印本）</text>
<text x="790" y="216" text-anchor="middle" font-size="14" fill="white">按依赖决定是否拆任务</text>
<text x="790" y="255" text-anchor="middle" font-size="14" fill="white">全体上下文与调用成本</text>
<text x="790" y="294" text-anchor="middle" font-size="14" fill="white">人数增加不保证结果更好</text>
<rect x="30" y="385" width="900" height="83" rx="9" fill="#fff3e9" stroke="#be8156"/>
<text x="480" y="414" text-anchor="middle" font-size="14" fill="#754325">阅读分组，不是性能排名或必经升级路线。</text>
<text x="480" y="442" text-anchor="middle" font-size="14" fill="#754325">固定任务、来源和全体预算，再比较单 Agent 与团队。</text>
<text x="480" y="490" text-anchor="middle" font-size="11" fill="#58667a">本书原创示意；固定版本与证据边界见正文。</text>
