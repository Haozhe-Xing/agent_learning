<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-label="描述引导提议；执行规则由宿主落实"><title>描述引导提议；执行规则由宿主落实</title><desc>描述、名字、Schema、上下文共同影响选择，不能用一段文字承诺准确率。</desc><rect width="800" height="520" rx="16" fill="#f8fafc"/><g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="28" y="38" font-size="22" fill="#1e293b" font-weight="600">描述引导提议；执行规则由宿主落实</text><text x="28" y="65" font-size="13" fill="#475569" font-weight="400">描述、名字、Schema、上下文共同影响选择，不能用一段文字承诺准确率。</text><rect x="28" y="89" width="360" height="151" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="46" y="119" font-size="16" fill="#2563eb" font-weight="600">Describe actual behavior</text><text x="46" y="147" font-size="14" fill="#475569" font-weight="400">功能、适用与排除场景</text><text x="46" y="171" font-size="14" fill="#475569" font-weight="400">参数格式、大小与必填项</text><text x="46" y="195" font-size="14" fill="#475569" font-weight="400">返回字段、单位、空结果</text><text x="46" y="219" font-size="14" fill="#475569" font-weight="400">本地范围与未实现能力</text><rect x="412" y="89" width="360" height="151" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="430" y="119" font-size="16" fill="#2563eb" font-weight="600">Host enforcement</text><text x="430" y="147" font-size="14" fill="#475569" font-weight="400">声明已授权不能扩大许可</text><text x="430" y="171" font-size="14" fill="#475569" font-weight="400">文字不能限制数据库或文件</text><text x="430" y="195" font-size="14" fill="#475569" font-weight="400">参数必须在执行前校验</text><text x="430" y="219" font-size="14" fill="#475569" font-weight="400">来源指令仍是参考数据</text><rect x="28" y="262" width="360" height="180" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="46" y="292" font-size="16" fill="#2563eb" font-weight="600">Independent cases</text><text x="46" y="320" font-size="14" fill="#475569" font-weight="400">应该调用 / 应该跳过</text><text x="46" y="344" font-size="14" fill="#475569" font-weight="400">无证据 / 缺参数</text><text x="46" y="368" font-size="14" fill="#475569" font-weight="400">恶意资料 / 有依赖步骤</text><text x="46" y="392" font-size="14" fill="#475569" font-weight="400">选择、参数、拒绝、答案分别评估</text><text x="46" y="416" font-size="14" fill="#475569" font-weight="400">对照实验先只改变描述</text><rect x="412" y="262" width="360" height="180" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="430" y="292" font-size="16" fill="#2563eb" font-weight="600">Measured boundary</text><text x="430" y="320" font-size="14" fill="#475569" font-weight="400">固定脚本不根据描述作决策</text><text x="430" y="344" font-size="14" fill="#475569" font-weight="400">本地只能检查合同与拒绝机制</text><text x="430" y="368" font-size="14" fill="#475569" font-weight="400">未做线上模型A/B实验</text><text x="430" y="392" font-size="14" fill="#475569" font-weight="400">实测需冻结版本、采样和预期</text><text x="430" y="416" font-size="14" fill="#475569" font-weight="400">不能报告无来源的提升百分比</text><text x="28" y="493" font-size="14" fill="#475569" font-weight="400">真实模型选择质量需要独立任务集；固定提供者通过不等于模型通过。</text></g></svg>
