<svg xmlns="http://www.w3.org/2000/svg" width="920" height="460" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">OODA：划分公开状态与职责</title>
  <desc id="desc">公开观察、任务比较、受限决策和执行反馈；是否完成由独立验收决定。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#64748b" />
    </marker>
  </defs>
  <rect width="920" height="460" fill="#f8fafc" />
  <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="460" y="35" font-size="22" fill="#0f172a" font-weight="bold" text-anchor="middle">OODA：划分公开状态与职责</text>
    <text x="460" y="68" font-size="15" fill="#334155" font-weight="normal" text-anchor="middle">发布简报：审批记录、预算、回退条件</text>
    <rect x="24" y="108" width="200" height="122" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" />
    <text x="124.0" y="136" font-size="17" fill="#2563eb" font-weight="bold" text-anchor="middle">观察 Observe</text>
    <text x="124.0" y="163" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">读取三项原始记录</text>
    <text x="124.0" y="186" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">保留 value 与 source</text>
    <path d="M 226 169 L 246 169" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="248" y="108" width="200" height="122" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" />
    <text x="348.0" y="136" font-size="17" fill="#2563eb" font-weight="bold" text-anchor="middle">定位 Orient</text>
    <text x="348.0" y="163" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">对照冻结的任务要求</text>
    <text x="348.0" y="186" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">标记缺失与冲突</text>
    <path d="M 450 169 L 470 169" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="472" y="108" width="200" height="122" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" />
    <text x="572.0" y="136" font-size="17" fill="#2563eb" font-weight="bold" text-anchor="middle">决策 Decide</text>
    <text x="572.0" y="163" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">选择已注册的操作</text>
    <text x="572.0" y="186" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">先核剩余调用预算</text>
    <path d="M 674 169 L 694 169" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="696" y="108" width="200" height="122" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" />
    <text x="796.0" y="136" font-size="17" fill="#2563eb" font-weight="bold" text-anchor="middle">行动 Act</text>
    <text x="796.0" y="163" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">执行 load / compose</text>
    <text x="796.0" y="186" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">记录结果或结构化错误</text>
    <path d="M 820 232 L 820 278 L 124 278 L 124 234" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
    <text x="460" y="270" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">新结果更新公开状态；预算耗尽或错误可以终止循环</text>
    <rect x="24" y="310" width="872" height="72" rx="9" fill="#e8eef7" />
    <text x="460" y="335" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">独立验收：来源一致 + 三项目标满足，才可 accepted=true</text>
    <text x="460" y="359" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">这是职责划分，不要求四次模型调用，也不是私有推理日志。</text>
  </g>
</svg>
