<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430">
  <defs>
    <style>text { font-family: 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif; }</style>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2c3e50"/>
    </marker>
  </defs>
  <rect width="800" height="430" rx="12" fill="#f8f9fa"/>
  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2c3e50">三种协商机制：收敛 Agent 分歧</text>

  <!-- 协商1：投票 -->
  <rect x="20" y="48" width="240" height="340" rx="10" fill="#e67e22" opacity="0.08" stroke="#e67e22" stroke-width="2"/>
  <text x="140" y="73" text-anchor="middle" font-size="13" font-weight="bold" fill="#e67e22">🗳 投票（Voting）</text>

  <rect x="45" y="88" width="60" height="32" rx="6" fill="#e67e22"/>
  <text x="75" y="108" text-anchor="middle" font-size="10" fill="white" font-weight="bold">Agent 1</text>
  <rect x="115" y="88" width="60" height="32" rx="6" fill="#e67e22"/>
  <text x="145" y="108" text-anchor="middle" font-size="10" fill="white" font-weight="bold">Agent 2</text>
  <rect x="185" y="88" width="60" height="32" rx="6" fill="#e67e22"/>
  <text x="215" y="108" text-anchor="middle" font-size="10" fill="white" font-weight="bold">Agent 3</text>

  <rect x="80" y="145" width="130" height="30" rx="6" fill="#fef5e7" stroke="#e67e22" stroke-width="1.5"/>
  <text x="145" y="165" text-anchor="middle" font-size="11" fill="#e67e22" font-weight="bold">多数表决</text>

  <line x1="75" y1="120" x2="110" y2="145" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="145" y1="120" x2="145" y2="145" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="215" y1="120" x2="180" y2="145" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="80" y="195" width="130" height="30" rx="6" fill="#e67e22"/>
  <text x="145" y="215" text-anchor="middle" font-size="11" fill="white" font-weight="bold">✓ 唯一结论</text>
  <line x1="145" y1="175" x2="145" y2="195" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="140" y="250" text-anchor="middle" font-size="10" fill="#555">✅ 简单可靠（ensemble）</text>
  <text x="140" y="266" text-anchor="middle" font-size="10" fill="#555">⚠️ 需异构 Agent 才有效</text>
  <text x="140" y="288" text-anchor="middle" font-size="10" fill="#7f8c8d">适用：客观判断题</text>

  <!-- 协商2：辩论 -->
  <rect x="280" y="48" width="240" height="340" rx="10" fill="#8e44ad" opacity="0.08" stroke="#8e44ad" stroke-width="2"/>
  <text x="400" y="73" text-anchor="middle" font-size="13" font-weight="bold" fill="#8e44ad">⚔️ 辩论（Debate）</text>

  <rect x="305" y="88" width="80" height="32" rx="6" fill="#8e44ad"/>
  <text x="345" y="108" text-anchor="middle" font-size="10" fill="white" font-weight="bold">正方（支持）</text>
  <rect x="415" y="88" width="80" height="32" rx="6" fill="#8e44ad"/>
  <text x="455" y="108" text-anchor="middle" font-size="10" fill="white" font-weight="bold">反方（反对）</text>

  <line x1="385" y1="104" x2="415" y2="104" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="415" y1="112" x2="385" y2="112" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="4,3"/>
  <text x="400" y="140" text-anchor="middle" font-size="9" fill="#555">多轮攻防</text>

  <rect x="330" y="155" width="140" height="30" rx="6" fill="#f4ecf7" stroke="#8e44ad" stroke-width="1.5"/>
  <text x="400" y="175" text-anchor="middle" font-size="11" fill="#8e44ad" font-weight="bold">裁判 Agent 裁决</text>
  <line x1="400" y1="140" x2="400" y2="155" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="330" y="205" width="140" height="30" rx="6" fill="#8e44ad"/>
  <text x="400" y="225" text-anchor="middle" font-size="11" fill="white" font-weight="bold">✓ 综合结论</text>
  <line x1="400" y1="185" x2="400" y2="205" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="400" y="260" text-anchor="middle" font-size="10" fill="#555">✅ 暴露盲点、论证全面</text>
  <text x="400" y="276" text-anchor="middle" font-size="10" fill="#555">⚠️ 成本约 3 倍</text>
  <text x="400" y="298" text-anchor="middle" font-size="10" fill="#7f8c8d">适用：主观权衡题</text>

  <!-- 协商3：合同网竞价 -->
  <rect x="540" y="48" width="240" height="340" rx="10" fill="#16a085" opacity="0.08" stroke="#16a085" stroke-width="2"/>
  <text x="660" y="73" text-anchor="middle" font-size="13" font-weight="bold" fill="#16a085">🤝 合同网（竞价）</text>

  <rect x="575" y="88" width="170" height="30" rx="6" fill="#16a085"/>
  <text x="660" y="108" text-anchor="middle" font-size="10" fill="white" font-weight="bold">发布者广播任务</text>

  <rect x="565" y="138" width="70" height="30" rx="6" fill="#eafaf1" stroke="#16a085" stroke-width="1.5"/>
  <text x="600" y="157" text-anchor="middle" font-size="9" fill="#16a085">投标 1</text>
  <rect x="645" y="138" width="70" height="30" rx="6" fill="#eafaf1" stroke="#16a085" stroke-width="1.5"/>
  <text x="680" y="157" text-anchor="middle" font-size="9" fill="#16a085">投标 2</text>
  <rect x="565" y="176" width="70" height="30" rx="6" fill="#eafaf1" stroke="#16a085" stroke-width="1.5"/>
  <text x="600" y="195" text-anchor="middle" font-size="9" fill="#16a085">投标 3</text>

  <line x1="640" y1="118" x2="610" y2="138" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="660" y1="118" x2="675" y2="138" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="650" y1="118" x2="605" y2="176" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="575" y="226" width="170" height="30" rx="6" fill="#16a085"/>
  <text x="660" y="246" text-anchor="middle" font-size="10" fill="white" font-weight="bold">✓ 选最优投标发包</text>
  <line x1="600" y1="206" x2="620" y2="226" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="680" y1="168" x2="670" y2="226" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="660" y="280" text-anchor="middle" font-size="10" fill="#555">✅ 让 Agent 自报能力</text>
  <text x="660" y="296" text-anchor="middle" font-size="10" fill="#555">⚠️ 需设计投标函数</text>
  <text x="660" y="318" text-anchor="middle" font-size="10" fill="#7f8c8d">适用：多 Agent 可做、效率不同</text>

  <!-- 底部总结 -->
  <rect x="100" y="400" width="600" height="22" rx="8" fill="#2c3e50" opacity="0.06"/>
  <text x="400" y="415" text-anchor="middle" font-size="10.5" fill="#7f8c8d">💡 投票答「是什么」，辩论定「选哪个」，合同网解「派给谁」——三者解决不同的分歧类型</text>
</svg>
