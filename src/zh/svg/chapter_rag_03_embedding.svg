<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 620" role="img" aria-labelledby="title desc" font-family="Arial, PingFang SC, sans-serif"><title id="title">从片段到向量候选</title><desc id="desc">距离不是正确率，也不是相关概率。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#475569"/></marker></defs><rect width="560" height="620" rx="12" fill="white"/><text x="280" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">从片段到向量候选</text><rect x="30" y="65" width="500" height="100" rx="9" fill="#eff6ff" stroke="#64748b"/><text x="280.0" y="93" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">索引文档</text><text x="280.0" y="118" text-anchor="middle" font-size="17" font-weight="normal" fill="#1e293b">id / text / source / version</text><text x="280.0" y="143" text-anchor="middle" font-size="17" font-weight="normal" fill="#1e293b">记录嵌入器修订与预处理</text><rect x="30" y="200" width="500" height="100" rx="9" fill="#f5f3ff" stroke="#64748b"/><text x="280.0" y="228" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Chroma集合：cosine空间</text><text x="280.0" y="253" text-anchor="middle" font-size="17" font-weight="normal" fill="#1e293b">向量 + 原文 + 来源与版本</text><text x="280.0" y="278" text-anchor="middle" font-size="17" font-weight="normal" fill="#1e293b">禁用默认嵌入器</text><rect x="30" y="335" width="500" height="82" rx="9" fill="#eff6ff" stroke="#64748b"/><text x="280.0" y="363" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">查询：使用相同的嵌入器</text><text x="280.0" y="388" text-anchor="middle" font-size="17" font-weight="normal" fill="#1e293b">查询 → 向量 → 有界近邻检索</text><rect x="30" y="452" width="500" height="82" rx="9" fill="#ecfdf5" stroke="#64748b"/><text x="280.0" y="480" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">候选记录</text><text x="280.0" y="505" text-anchor="middle" font-size="17" font-weight="normal" fill="#1e293b">ID、来源、版本与距离</text><path d="M280,165 L280,198" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M280,300 L280,333" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M280,417 L280,450" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="280" y="580" text-anchor="middle" font-size="17" fill="#334155">距离不是正确率，也不是相关概率。</text></svg>
