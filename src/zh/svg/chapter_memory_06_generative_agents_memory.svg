<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 590" role="img" aria-labelledby="title desc" font-family="Arial, PingFang SC, sans-serif">
<title id="title">Generative Agents：信息流</title><desc id="desc">观察进入记忆流。检索把相关内容送入规划，反思读取记忆并写回推断。示意不是三层存储。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8Z" fill="#475569"/></marker></defs>
<rect width="560" height="590" rx="12" fill="#fff"/>
<text x="280" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">Generative Agents：信息流</text>
<rect x="40" y="60" width="480" height="75" rx="9" fill="#eff6ff" stroke="#64748b"/>
<text x="280.0" y="88" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">观察</text>
<text x="280.0" y="115" text-anchor="middle" font-size="17" font-weight="normal" fill="#1e293b">环境事件、对话与行动记录</text>
<path d="M280,135 L280,163" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
<rect x="40" y="165" width="480" height="95" rx="9" fill="#eff6ff" stroke="#64748b"/>
<text x="280.0" y="193" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">记忆流</text>
<text x="280.0" y="220" text-anchor="middle" font-size="17" font-weight="normal" fill="#1e293b">记录观察、反思与计划</text>
<text x="280.0" y="244" text-anchor="middle" font-size="17" font-weight="normal" fill="#1e293b">保留时间及来源关联</text>
<path d="M155,260 L155,300" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
<path d="M405,260 L405,300" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<rect x="30" y="302" width="250" height="110" rx="9" fill="#eff6ff" stroke="#64748b"/>
<text x="155.0" y="330" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">检索</text>
<text x="155.0" y="357" text-anchor="middle" font-size="17" font-weight="normal" fill="#1e293b">时近性、重要性</text>
<text x="155.0" y="381" text-anchor="middle" font-size="17" font-weight="normal" fill="#1e293b">与当前情境的相关性</text>
<rect x="305" y="302" width="225" height="110" rx="9" fill="#f5f3ff" stroke="#64748b"/>
<text x="417.5" y="330" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">反思</text>
<text x="417.5" y="357" text-anchor="middle" font-size="17" font-weight="normal" fill="#1e293b">从记录推断结论</text>
<text x="417.5" y="381" text-anchor="middle" font-size="17" font-weight="normal" fill="#1e293b">再写入记忆流</text>
<path d="M155,412 L155,450" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
<rect x="40" y="452" width="480" height="75" rx="9" fill="#ecfdf5" stroke="#64748b"/>
<text x="280.0" y="480" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">规划与反应</text>
<text x="280.0" y="507" text-anchor="middle" font-size="17" font-weight="normal" fill="#1e293b">使用检索到的内容生成行为</text>
<text x="280" y="556" text-anchor="middle" font-size="16" font-weight="normal" fill="#1e293b">信息流示意；反思不是已验证事实。</text>
<text x="280" y="580" text-anchor="middle" font-size="14" font-weight="normal" fill="#475569">本书重绘，依据 Park et al., v2 §4 (2023)</text>
</svg>
