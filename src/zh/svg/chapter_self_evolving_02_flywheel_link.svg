<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L0,8 L9,4 z" fill="#4f46e5"/></marker>
  </defs>
  <rect width="760" height="360" rx="18" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Self-Evolution 与 Agentic 数据飞轮的串联</text>
  <text x="380" y="58" text-anchor="middle" font-size="13" fill="#64748b">同一闭环的两个层级：快循环改系统行为，慢循环改模型能力</text>

  <!-- Self-Evolution -->
  <rect x="60" y="90" width="280" height="80" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="200" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">Self-Evolution Agent（快循环）</text>
  <text x="200" y="140" text-anchor="middle" font-size="11" fill="#2563eb">改记忆 / Prompt / Skill / 流程</text>
  <text x="200" y="157" text-anchor="middle" font-size="11" fill="#2563eb">按天甚至按任务更新</text>

  <!-- 数据飞轮 -->
  <rect x="420" y="90" width="280" height="80" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8"/>
  <text x="560" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#b91c1c">Agentic 数据飞轮（慢循环）</text>
  <text x="560" y="140" text-anchor="middle" font-size="11" fill="#dc2626">改训练数据 / 奖励模型 / 策略模型</text>
  <text x="560" y="157" text-anchor="middle" font-size="11" fill="#dc2626">按周或月训练发布</text>

  <!-- 向右：产出经验 -->
  <line x1="340" y1="120" x2="418" y2="120" stroke="#4f46e5" stroke-width="2.2" marker-end="url(#arr)"/>
  <text x="379" y="111" text-anchor="middle" font-size="10" fill="#4f46e5">高质量经验 /</text>
  <text x="379" y="135" text-anchor="middle" font-size="10" fill="#4f46e5">失败归因 / 技能草案</text>

  <!-- 更强模型 -->
  <rect x="300" y="218" width="160" height="56" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="380" y="242" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">更强的 Agent 模型</text>
  <text x="380" y="261" text-anchor="middle" font-size="10" fill="#16a34a">部署回执行系统</text>

  <!-- 飞轮→更强模型 -->
  <path d="M560 170 L560 246 L463 246" fill="none" stroke="#ef4444" stroke-width="2.2" marker-end="url(#arr)"/>
  <text x="600" y="210" font-size="10" fill="#dc2626" text-anchor="middle">过滤/标注/训练</text>

  <!-- 更强模型→Self-Evolution（回路） -->
  <path d="M300 246 L200 246 L200 172" fill="none" stroke="#22c55e" stroke-width="2.2" marker-end="url(#arr)"/>
  <text x="160" y="212" font-size="10" fill="#16a34a" text-anchor="middle">产生更</text>
  <text x="160" y="228" font-size="10" fill="#16a34a" text-anchor="middle">高质量轨迹</text>

  <!-- 对比表 -->
  <rect x="60" y="296" width="640" height="48" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="380" y="317" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">快循环：规则校验 + 沙箱 + 回滚｜慢循环：离线评估 + 基准测试 + 灰度发布</text>
  <text x="380" y="336" text-anchor="middle" font-size="11" fill="#64748b">Self-Evolution 负责快速系统级改进，数据飞轮负责长期模型级增强，二者互补</text>
</svg>
