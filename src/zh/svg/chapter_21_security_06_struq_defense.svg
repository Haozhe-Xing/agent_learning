<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
<title id="title">StruQ：前端与训练共同构成方法</title>
<desc id="desc">Original explanatory diagram after https://arxiv.org/html/2402.06363v2 §§4–6; no original paper artwork reproduced.</desc>
<metadata>Original illustration created for this book; no paper artwork or screenshot reproduced. Repository MIT license applies to this illustration.</metadata>
<style>text { font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }</style>
<rect width="960" height="500" rx="14" fill="#f1f5f9"/>
<text x="480" y="43" text-anchor="middle" font-size="23" font-weight="bold" fill="#22384c">StruQ：前端与训练共同构成方法</text>
<rect x="30" y="95" width="280" height="255" rx="12" fill="#2d4965"/>
<text x="170" y="130" text-anchor="middle" font-size="18" fill="white" font-weight="bold">安全前端</text>
<text x="170" y="177" text-anchor="middle" font-size="14" fill="white">分开指令区与数据区</text>
<text x="170" y="216" text-anchor="middle" font-size="14" fill="white">使用保留分隔标记</text>
<text x="170" y="255" text-anchor="middle" font-size="14" fill="white">处理数据中的伪造标记</text>
<text x="170" y="294" text-anchor="middle" font-size="14" fill="white">不只是加一个 XML 标签</text>
<rect x="340" y="95" width="280" height="255" rx="12" fill="#287598"/>
<text x="480" y="130" text-anchor="middle" font-size="18" fill="white" font-weight="bold">经专门训练的模型</text>
<text x="480" y="177" text-anchor="middle" font-size="14" fill="white">结构化指令微调</text>
<text x="480" y="216" text-anchor="middle" font-size="14" fill="white">训练样例含数据侧攻击</text>
<text x="480" y="255" text-anchor="middle" font-size="14" fill="white">学习忽略资料区指令</text>
<text x="480" y="294" text-anchor="middle" font-size="14" fill="white">运行时使用相同输入约定</text>
<rect x="650" y="95" width="280" height="255" rx="12" fill="#72608a"/>
<text x="790" y="130" text-anchor="middle" font-size="18" fill="white" font-weight="bold">分别评估</text>
<text x="790" y="177" text-anchor="middle" font-size="14" fill="white">合法任务的效用</text>
<text x="790" y="216" text-anchor="middle" font-size="14" fill="white">指定攻击集下的成功率</text>
<text x="790" y="255" text-anchor="middle" font-size="14" fill="white">自适应攻击与组件消融</text>
<text x="790" y="294" text-anchor="middle" font-size="14" fill="white">结果限于受测模型和设置</text>
<path d="M 312 220 L 327 220" fill="none" stroke="#738296" stroke-width="2"/>
<path d="M 327 215 L 335 220 L 327 225" fill="none" stroke="#738296" stroke-width="2"/>
<path d="M 622 220 L 637 220" fill="none" stroke="#738296" stroke-width="2"/>
<path d="M 637 215 L 645 220 L 637 225" fill="none" stroke="#738296" stroke-width="2"/>
<rect x="30" y="385" width="900" height="83" rx="9" fill="#fff3e9" stroke="#be8156"/>
<text x="480" y="414" text-anchor="middle" font-size="14" fill="#754325">本书未训练该模型或复现其防御分数。</text>
<text x="480" y="442" text-anchor="middle" font-size="14" fill="#754325">模型抗注入能力不能代替宿主工具授权。</text>
<text x="480" y="490" text-anchor="middle" font-size="11" fill="#58667a">本书原创示意；固定版本与证据边界见正文。</text>
</svg>
