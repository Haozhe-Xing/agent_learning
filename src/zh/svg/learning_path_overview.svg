<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1020" width="1000" height="1020" role="img" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>逐步构建可验证、可控、可部署的 Agent</title><desc>25章 · 7个部分 · 应用交付在前，研究进阶在后</desc>
<rect width="1000" height="1020" fill="#f8fafc"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#64748b"/></marker></defs>
<text x="40" y="42" font-size="25" fill="#0f172a" font-weight="700">逐步构建可验证、可控、可部署的 Agent</text>
<text x="40" y="75" font-size="17" fill="#334155" font-weight="400">25章 · 7个部分 · 应用交付在前，研究进阶在后</text>
<rect x="40" y="102" width="920" height="105" rx="12" fill="#fff" stroke="#cbd5e1"/>
<rect x="54" y="116" width="122" height="76" rx="12" fill="#f1f5f9" stroke="#e2e8f0"/>
<text x="115" y="161" font-size="26" fill="#1d4ed8" font-weight="700" text-anchor="middle">1–2</text>
<text x="195" y="131" font-size="20" fill="#0f172a" font-weight="700">第一部分 · 入门</text>
<text x="195" y="161" font-size="17" fill="#334155" font-weight="400">定义任务与模型基线</text>
<text x="195" y="188" font-size="15" fill="#334155" font-weight="400">产物：任务卡、输入/返回/失败记录</text>
<rect x="807" y="112" width="140" height="27" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="877" y="131" font-size="14" fill="#1d4ed8" font-weight="600" text-anchor="middle">主线</text>
<line x1="115" y1="208" x2="115" y2="219" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
<rect x="40" y="222" width="920" height="105" rx="12" fill="#fff" stroke="#cbd5e1"/>
<rect x="54" y="236" width="122" height="76" rx="12" fill="#f1f5f9" stroke="#e2e8f0"/>
<text x="115" y="281" font-size="26" fill="#1d4ed8" font-weight="700" text-anchor="middle">3–9</text>
<text x="195" y="251" font-size="20" fill="#0f172a" font-weight="700">第二部分 · 核心能力</text>
<text x="195" y="281" font-size="17" fill="#334155" font-weight="400">工具 → 记忆 → 规划 → 证据 → 上下文 → Harness</text>
<text x="195" y="308" font-size="15" fill="#334155" font-weight="400">产物：实际数据链与独立验收；第9章按需封装技能</text>
<rect x="807" y="232" width="140" height="27" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="877" y="251" font-size="14" fill="#1d4ed8" font-weight="600" text-anchor="middle">3–8主线</text>
<line x1="115" y1="328" x2="115" y2="339" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
<rect x="40" y="342" width="920" height="105" rx="12" fill="#fff" stroke="#cbd5e1"/>
<rect x="54" y="356" width="122" height="76" rx="12" fill="#f1f5f9" stroke="#e2e8f0"/>
<text x="115" y="401" font-size="26" fill="#166534" font-weight="700" text-anchor="middle">10–15</text>
<text x="195" y="371" font-size="20" fill="#0f172a" font-weight="700">第三部分 · 框架与实现选择</text>
<text x="195" y="401" font-size="17" fill="#334155" font-weight="400">10/11 开发库按需；12–15 产品与架构案例选读</text>
<text x="195" y="428" font-size="15" fill="#334155" font-weight="400">产物：保留同一契约的迁移或采用/跳过记录</text>
<rect x="807" y="352" width="140" height="27" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="877" y="371" font-size="14" fill="#166534" font-weight="600" text-anchor="middle">按需选择</text>
<line x1="115" y1="448" x2="115" y2="459" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
<rect x="40" y="462" width="920" height="105" rx="12" fill="#fff" stroke="#cbd5e1"/>
<rect x="54" y="476" width="122" height="76" rx="12" fill="#f1f5f9" stroke="#e2e8f0"/>
<text x="115" y="521" font-size="26" fill="#166534" font-weight="700" text-anchor="middle">16–17</text>
<text x="195" y="491" font-size="20" fill="#0f172a" font-weight="700">第四部分 · 协作与集成</text>
<text x="195" y="521" font-size="17" fill="#334155" font-weight="400">单 Agent 有瓶颈再协作；跨系统边界再选协议</text>
<text x="195" y="548" font-size="15" fill="#334155" font-weight="400">产物：交接、总预算、错误与连接契约</text>
<rect x="807" y="472" width="140" height="27" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="877" y="491" font-size="14" fill="#166534" font-weight="600" text-anchor="middle">按需选择</text>
<line x1="115" y1="568" x2="115" y2="579" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
<rect x="40" y="582" width="920" height="105" rx="12" fill="#fff" stroke="#cbd5e1"/>
<rect x="54" y="596" width="122" height="76" rx="12" fill="#f1f5f9" stroke="#e2e8f0"/>
<text x="115" y="641" font-size="26" fill="#1d4ed8" font-weight="700" text-anchor="middle">18–20</text>
<text x="195" y="611" font-size="20" fill="#0f172a" font-weight="700">第五部分 · 验证与部署</text>
<text x="195" y="641" font-size="17" fill="#334155" font-weight="400">版本化评估 → 宿主安全边界 → 服务交付</text>
<text x="195" y="668" font-size="15" fill="#334155" font-weight="400">产物：回归、安全和运行证据；未验证门禁保持打开</text>
<rect x="807" y="592" width="140" height="27" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="877" y="611" font-size="14" fill="#1d4ed8" font-weight="600" text-anchor="middle">交付必读</text>
<line x1="115" y1="688" x2="115" y2="699" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
<rect x="40" y="702" width="920" height="105" rx="12" fill="#fff" stroke="#cbd5e1"/>
<rect x="54" y="716" width="122" height="76" rx="12" fill="#f1f5f9" stroke="#e2e8f0"/>
<text x="115" y="761" font-size="26" fill="#1d4ed8" font-weight="700" text-anchor="middle">21–23</text>
<text x="195" y="731" font-size="20" fill="#0f172a" font-weight="700">第六部分 · 综合项目</text>
<text x="195" y="761" font-size="17" fill="#334155" font-weight="400">编程 / 数据分析 / 多模态，选择一个交付</text>
<text x="195" y="788" font-size="15" fill="#334155" font-weight="400">产物：一个领域项目的独立验收报告</text>
<rect x="807" y="712" width="140" height="27" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="877" y="731" font-size="14" fill="#1d4ed8" font-weight="600" text-anchor="middle">三选一</text>
<line x1="115" y1="808" x2="115" y2="819" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
<rect x="40" y="822" width="920" height="105" rx="12" fill="#fff" stroke="#cbd5e1"/>
<rect x="54" y="836" width="122" height="76" rx="12" fill="#f1f5f9" stroke="#e2e8f0"/>
<text x="115" y="881" font-size="26" fill="#7e22ce" font-weight="700" text-anchor="middle">24–25</text>
<text x="195" y="851" font-size="20" fill="#0f172a" font-weight="700">第七部分 · 研究进阶</text>
<text x="195" y="881" font-size="17" fill="#334155" font-weight="400">24 模型训练 / 25 提示、技能与系统改进</text>
<text x="195" y="908" font-size="15" fill="#334155" font-weight="400">产物：独立保留集上的对照实验与回退记录</text>
<rect x="807" y="832" width="140" height="27" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="877" y="851" font-size="14" fill="#7e22ce" font-weight="600" text-anchor="middle">研究选读</text>
<text x="40" y="977" font-size="17" fill="#0f172a" font-weight="600">目录顺序不等于前置依赖：按需求选择分支，评估与权限检查贯穿始终。</text>
<text x="40" y="1005" font-size="16" fill="#334155" font-weight="400">示例、读者练习及尚未验证范围，见各章首页与贯穿项目页。</text>
</svg>
