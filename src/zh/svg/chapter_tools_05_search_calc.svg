<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-label="本地搜索 → 依赖计算 → 回答 → 独立验收"><title>本地搜索 → 依赖计算 → 回答 → 独立验收</title><desc>3轮固定提供者消费实际观察；2次工具处理；默认不创建任何线上客户端。</desc><rect width="800" height="520" rx="16" fill="#f8fafc"/><g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="28" y="38" font-size="22" fill="#1e293b" font-weight="600">本地搜索 → 依赖计算 → 回答 → 独立验收</text><text x="28" y="65" font-size="13" fill="#475569" font-weight="400">3轮固定提供者消费实际观察；2次工具处理；默认不创建任何线上客户端。</text><rect x="28" y="89" width="360" height="151" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="46" y="119" font-size="16" fill="#2563eb" font-weight="600">1. Search local documents</text><text x="46" y="147" font-size="14" fill="#475569" font-weight="400">查询Moon distance</text><text x="46" y="171" font-size="14" fill="#475569" font-weight="400">返回moon-v1 / 原文 / SHA-256</text><text x="46" y="195" font-size="14" fill="#475569" font-weight="400">冻结教学数据：384400 km</text><text x="46" y="219" font-size="14" fill="#475569" font-weight="400">无结果时不能编造计算依据</text><rect x="412" y="89" width="360" height="151" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="430" y="119" font-size="16" fill="#2563eb" font-weight="600">2. Calculate</text><text x="430" y="147" font-size="14" fill="#475569" font-weight="400">下一轮读取实际搜索结果</text><text x="430" y="171" font-size="14" fill="#475569" font-weight="400">384400 ×1000 /299792458</text><text x="430" y="195" font-size="14" fill="#475569" font-weight="400">共享AST解释器真实执行</text><text x="430" y="219" font-size="14" fill="#475569" font-weight="400">不能把独立步骤标成并行收益</text><rect x="28" y="262" width="360" height="180" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="46" y="292" font-size="16" fill="#2563eb" font-weight="600">3. Final output</text><text x="46" y="320" font-size="14" fill="#475569" font-weight="400">读取实际计算结果组织答案</text><text x="46" y="344" font-size="14" fill="#475569" font-weight="400">1.28222038194 seconds [moon-v1]</text><text x="46" y="368" font-size="14" fill="#475569" font-weight="400">保留调用ID、输入和结果</text><text x="46" y="392" font-size="14" fill="#475569" font-weight="400">工具错误/预算超限仍未完成</text><text x="46" y="416" font-size="14" fill="#475569" font-weight="400">非空文字不是最终正确性证明</text><rect x="412" y="262" width="360" height="180" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="430" y="292" font-size="16" fill="#2563eb" font-weight="600">4. Independent rubric</text><text x="430" y="320" font-size="14" fill="#475569" font-weight="400">不调用提供者或safe_math</text><text x="430" y="344" font-size="14" fill="#475569" font-weight="400">固定题目、原文、摘要与表达式</text><text x="430" y="368" font-size="14" fill="#475569" font-weight="400">Decimal独立计算，核对单位/引用</text><text x="430" y="392" font-size="14" fill="#475569" font-weight="400">篡改结果或资料必须失败</text><text x="430" y="416" font-size="14" fill="#475569" font-weight="400">只验证声明的月球夹具任务</text><text x="28" y="493" font-size="14" fill="#475569" font-weight="400">SDK HTTP替身测试只验证序列化与往返；线上模型选择与网络资料质量未测。</text></g></svg>
