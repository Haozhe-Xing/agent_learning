<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-label="按任务缺口选择；满足要求即可停止">
<title>按任务缺口选择；满足要求即可停止</title><desc>本书选型模型；不是官方服务内部结构，也不是强制的技术升级顺序。</desc>
<rect width="800" height="520" rx="16" fill="#f8fafc"/>
<g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<text x="28" y="37" font-size="22" fill="#1e293b" font-weight="600" text-anchor="start">按任务缺口选择；满足要求即可停止</text><text x="28" y="63" font-size="13" fill="#475569" font-weight="400" text-anchor="start">本书选型模型；不是官方服务内部结构，也不是强制的技术升级顺序。</text><rect x="28" y="91" width="744" height="76" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="46" y="118" font-size="15" fill="#475569" font-weight="600" text-anchor="start">流程已知</text><text x="303" y="118" font-size="16" fill="#2563eb" font-weight="600" text-anchor="start">Runnable</text><text x="46" y="147" font-size="14" fill="#475569" font-weight="400" text-anchor="start">检查类型、分支、失败与验收；可停在这里</text><rect x="28" y="179" width="744" height="76" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="46" y="206" font-size="15" fill="#475569" font-weight="600" text-anchor="start">模型选择工具</text><text x="303" y="206" font-size="16" fill="#2563eb" font-weight="600" text-anchor="start">create_agent</text><text x="46" y="235" font-size="14" fill="#475569" font-weight="400" text-anchor="start">配置工具权限与预算；可停在这里</text><rect x="28" y="267" width="744" height="76" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="46" y="294" font-size="15" fill="#475569" font-weight="600" text-anchor="start">需要显式状态/恢复</text><text x="303" y="294" font-size="16" fill="#2563eb" font-weight="600" text-anchor="start">LangGraph</text><text x="46" y="323" font-size="14" fill="#475569" font-weight="400" text-anchor="start">另行配置持久化并测试恢复与重复副作用</text><rect x="28" y="355" width="744" height="76" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="46" y="382" font-size="15" fill="#475569" font-weight="600" text-anchor="start">另有运维需求</text><text x="303" y="382" font-size="16" fill="#2563eb" font-weight="600" text-anchor="start">可选托管服务</text><text x="46" y="411" font-size="14" fill="#475569" font-weight="400" text-anchor="start">审查数据、权限、区域、成本与服务边界</text><rect x="28" y="458" width="744" height="42" rx="12" fill="#eff6ff" stroke="#93c5fd"/><text x="400" y="485" font-size="14" fill="#2563eb" font-weight="600" text-anchor="middle">始终由应用定义：谁能做什么、失败是什么、怎样证明任务完成。</text></g></svg>
