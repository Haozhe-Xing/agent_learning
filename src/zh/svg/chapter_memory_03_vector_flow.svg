<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-labelledby="title">
<title id="title">长期记忆：先治理，再检索</title>
<style>text { font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }</style>
<rect width="900" height="460" rx="14" fill="#f0f4f8"/>
<text x="450" y="37" text-anchor="middle" font-size="20" font-weight="bold" fill="#233447">长期记忆：先治理，再检索</text>
<rect x="30" y="110" width="260" height="180" rx="10" fill="#2c3e50"/>
<text x="160" y="141" text-anchor="middle" font-size="16" fill="white" font-weight="bold">明确记录</text>
<text x="160" y="173" text-anchor="middle" font-size="12" fill="white">宿主确认用途、同意与来源</text>
<text x="160" y="205" text-anchor="middle" font-size="12" fill="white">模型提取仅产生候选</text>
<rect x="320" y="110" width="260" height="180" rx="10" fill="#236fa3"/>
<text x="450" y="141" text-anchor="middle" font-size="16" fill="white" font-weight="bold">持久化与索引</text>
<text x="450" y="173" text-anchor="middle" font-size="12" fill="white">记录ID / 编码版本 / 指定距离</text>
<text x="450" y="205" text-anchor="middle" font-size="12" fill="white">人工向量只测试存储机制</text>
<rect x="610" y="110" width="260" height="180" rx="10" fill="#73519a"/>
<text x="740" y="141" text-anchor="middle" font-size="16" fill="white" font-weight="bold">有范围的候选</text>
<text x="740" y="173" text-anchor="middle" font-size="12" fill="white">先按主体及来源过滤，再排序</text>
<text x="740" y="205" text-anchor="middle" font-size="12" fill="white">相似度不是正确概率</text>
<line x1="290" y1="200" x2="315" y2="200" stroke="#65758a" stroke-width="2"/><polygon points="315,200 307,196 307,204" fill="#65758a"/>
<line x1="580" y1="200" x2="605" y2="200" stroke="#65758a" stroke-width="2"/><polygon points="605,200 597,196 597,204" fill="#65758a"/>
<rect x="30" y="402" width="840" height="40" rx="8" fill="#fff0e9" stroke="#c46b3e"/>
<text x="450" y="427" text-anchor="middle" font-size="12" fill="#873a24">删除还需检查派生索引和缓存；身份认证由宿主落实。</text>
</svg>
