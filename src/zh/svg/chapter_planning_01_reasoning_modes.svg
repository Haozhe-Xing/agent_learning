<svg xmlns="http://www.w3.org/2000/svg" width="920" height="460" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">推理方式：提案与检验要分开</title>
  <desc id="desc">四种推理方式以及各自需要的外部检验。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#64748b" />
    </marker>
  </defs>
  <rect width="920" height="460" fill="#f8fafc" />
  <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="460" y="35" font-size="22" fill="#0f172a" font-weight="bold" text-anchor="middle">推理方式：提案与检验要分开</text>
    <rect x="24" y="75" width="424" height="122" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" />
    <text x="236.0" y="103" font-size="17" fill="#2563eb" font-weight="bold" text-anchor="middle">演绎 Deduction</text>
    <text x="236.0" y="130" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">从规则与前提推出结论</text>
    <text x="236.0" y="153" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">检验：前提真实，推导有效</text>
    <rect x="472" y="75" width="424" height="122" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="1.5" />
    <text x="684.0" y="103" font-size="17" fill="#15803d" font-weight="bold" text-anchor="middle">归纳 Induction</text>
    <text x="684.0" y="130" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">从有限样本提出一般规律</text>
    <text x="684.0" y="153" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">检验：留出样本与适用边界</text>
    <rect x="24" y="218" width="424" height="122" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" />
    <text x="236.0" y="246" font-size="17" fill="#7c3aed" font-weight="bold" text-anchor="middle">溯因 Abduction</text>
    <text x="236.0" y="273" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">为观察结果提出可能解释</text>
    <text x="236.0" y="296" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">检验：区分假设的额外证据</text>
    <rect x="472" y="218" width="424" height="122" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.5" />
    <text x="684.0" y="246" font-size="17" fill="#b45309" font-weight="bold" text-anchor="middle">类比 Analogy</text>
    <text x="684.0" y="273" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">把相似任务的方案作为候选</text>
    <text x="684.0" y="296" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">检验：当前约束与差异</text>
    <rect x="24" y="365" width="872" height="72" rx="9" fill="#e8eef7" />
    <text x="460" y="390" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">这些词描述解决问题的方法；一段解释文本不能证明模型内部实际经过了哪些步骤。</text>
    <text x="460" y="414" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">发布简报练习只验收可观察的字段、来源和任务要求。</text>
  </g>
</svg>
