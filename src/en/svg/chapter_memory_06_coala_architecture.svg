<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 590" role="img" aria-labelledby="title desc" font-family="Arial, PingFang SC, sans-serif">
<title id="title">CoALA: Three Design Dimensions</title><desc id="desc">Working memory differs from long-term episodic, semantic, and procedural memory. Action space and decision-making are separate dimensions, not a fixed four-step pipeline.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8Z" fill="#475569"/></marker></defs>
<rect width="560" height="590" rx="12" fill="#fff"/>
<text x="280" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">CoALA: Three Design Dimensions</text>
<rect x="30" y="60" width="500" height="75" rx="9" fill="#eff6ff" stroke="#64748b"/>
<text x="280.0" y="88" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Working memory</text>
<text x="280.0" y="115" text-anchor="middle" font-size="17" font-weight="normal" fill="#1e293b">Current observations and task/reasoning state</text>
<path d="M280,135 L280,166" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<rect x="30" y="168" width="500" height="175" rx="9" fill="#f5f3ff" stroke="#64748b"/>
<text x="280.0" y="196" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Long-term memory</text>
<text x="52" y="228" text-anchor="start" font-size="17" font-weight="normal" fill="#1e293b">Episodic: past events and experiences</text>
<text x="52" y="269" text-anchor="start" font-size="17" font-weight="normal" fill="#1e293b">Semantic: facts, concepts, and inferred knowledge</text>
<text x="52" y="310" text-anchor="start" font-size="17" font-weight="normal" fill="#1e293b">Procedural: agent code and model weights</text>
<rect x="30" y="365" width="500" height="98" rx="9" fill="#ecfdf5" stroke="#64748b"/>
<text x="280.0" y="393" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Action space</text>
<text x="280.0" y="420" text-anchor="middle" font-size="17" font-weight="normal" fill="#1e293b">Internal: reasoning, retrieval, learning</text>
<text x="280.0" y="444" text-anchor="middle" font-size="17" font-weight="normal" fill="#1e293b">External: tools, environments, other actors</text>
<rect x="30" y="482" width="500" height="64" rx="9" fill="#fff7ed" stroke="#64748b"/>
<text x="280.0" y="510" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Decisions: propose, evaluate, select actions</text>
<text x="280" y="571" text-anchor="middle" font-size="14" font-weight="normal" fill="#475569">Book diagram after Sumers et al., v3 §4 (2024)</text>
</svg>
