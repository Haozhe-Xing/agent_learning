<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 340" width="500" height="340" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <rect width="500" height="340" rx="12" fill="#f8fafc"/>
  <text x="250" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Curriculum Learning: Easy-to-Hard Training Schedule</text>

  <!-- Stage 1 -->
  <rect x="24" y="46" width="452" height="80" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="80" y="68" font-size="13" font-weight="bold" fill="#15803d">Stage 1 (Warm-up)</text>
  <text x="80" y="86" font-size="11" fill="#166534">Build basic capability with easy problems first</text>
  <rect x="280" y="56" width="180" height="60" rx="6" fill="#bbf7d0" stroke="#4ade80" stroke-width="1"/>
  <text x="370" y="76" text-anchor="middle" font-size="11" fill="#166534">Pass rate: 60%-80%</text>
  <text x="370" y="94" text-anchor="middle" font-size="11" fill="#166534">Establish "doing well</text>
  <text x="370" y="110" text-anchor="middle" font-size="11" fill="#166534">gets rewarded" understanding</text>

  <!-- Arrow -->
  <line x1="250" y1="126" x2="250" y2="144" stroke="#6366f1" stroke-width="2.5">
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6366f1"/>
    </marker>
  </line>
  <polygon points="244,144 256,144 250,154" fill="#6366f1"/>

  <!-- Stage 2 -->
  <rect x="24" y="156" width="452" height="80" rx="10" fill="#fef9c3" stroke="#eab308" stroke-width="2"/>
  <text x="80" y="178" font-size="13" font-weight="bold" fill="#a16207">Stage 2 (Ramp-up)</text>
  <text x="80" y="196" font-size="11" fill="#a16207">Gradually increase difficulty</text>
  <rect x="280" y="166" width="180" height="60" rx="6" fill="#fef08a" stroke="#facc15" stroke-width="1"/>
  <text x="370" y="186" text-anchor="middle" font-size="11" fill="#a16207">Pass rate: 30%-60%</text>
  <text x="370" y="204" text-anchor="middle" font-size="11" fill="#a16207">Model begins to explore</text>
  <text x="370" y="220" text-anchor="middle" font-size="11" fill="#a16207">more complex strategies</text>

  <!-- Arrow -->
  <polygon points="244,236 256,236 250,246" fill="#6366f1"/>

  <!-- Stage 3 -->
  <rect x="24" y="248" width="452" height="80" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="80" y="270" font-size="13" font-weight="bold" fill="#b91c1c">Stage 3 (Challenge)</text>
  <text x="80" y="288" font-size="11" fill="#b91c1c">Tackle high-difficulty problems</text>
  <rect x="280" y="258" width="180" height="60" rx="6" fill="#fecaca" stroke="#f87171" stroke-width="1"/>
  <text x="370" y="278" text-anchor="middle" font-size="11" fill="#b91c1c">Pass rate: 10%-30%</text>
  <text x="370" y="296" text-anchor="middle" font-size="11" fill="#b91c1c">Truly creative</text>
  <text x="370" y="312" text-anchor="middle" font-size="11" fill="#b91c1c">strategies emerge</text>
</svg>