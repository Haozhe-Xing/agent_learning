<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-label="Host checks and results correlated to original IDs"><title>Host checks and results correlated to original IDs</title><desc>A Chat Completions function-tool subset; strict and SDK types do not replace host checks.</desc><rect width="800" height="520" rx="16" fill="#f8fafc"/><g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="28" y="38" font-size="22" fill="#1e293b" font-weight="600">Host checks and results correlated to original IDs</text><text x="28" y="65" font-size="13" fill="#475569" font-weight="400">A Chat Completions function-tool subset; strict and SDK types do not replace host checks.</text><rect x="28" y="89" width="360" height="150" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="46" y="119" font-size="16" fill="#2563eb" font-weight="600">1. Schema + assistant</text><text x="46" y="147" font-size="14" fill="#475569" font-weight="400">Descriptions, argument types and fields</text><text x="46" y="171" font-size="14" fill="#475569" font-weight="400">tool_calls: id / type / function</text><text x="46" y="195" font-size="14" fill="#475569" font-weight="400">arguments is untrusted JSON text</text><text x="46" y="219" font-size="14" fill="#475569" font-weight="400">A name is not execution permission</text><rect x="412" y="89" width="360" height="150" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="430" y="119" font-size="16" fill="#2563eb" font-weight="600">2. Host</text><text x="430" y="147" font-size="14" fill="#475569" font-weight="400">Check IDs and budget for the whole batch</text><text x="430" y="171" font-size="14" fill="#475569" font-weight="400">Check registration and current permission</text><text x="430" y="195" font-size="14" fill="#475569" font-weight="400">Check JSON, fields, types and values</text><text x="430" y="219" font-size="14" fill="#475569" font-weight="400">Keep identifiable denials and failures</text><rect x="28" y="262" width="360" height="180" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="46" y="292" font-size="16" fill="#2563eb" font-weight="600">3. Tool results</text><text x="46" y="320" font-size="14" fill="#475569" font-weight="400">One result for each admitted call</text><text x="46" y="344" font-size="14" fill="#475569" font-weight="400">role: tool + original tool_call_id</text><text x="46" y="368" font-size="14" fill="#475569" font-weight="400">Structured ok / code / value</text><text x="46" y="392" font-size="14" fill="#475569" font-weight="400">Skip later calls after a batch failure</text><text x="46" y="416" font-size="14" fill="#475569" font-weight="400">Reject unaffordable batches before work</text><rect x="412" y="262" width="360" height="180" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="430" y="292" font-size="16" fill="#2563eb" font-weight="600">4. Next turn / acceptance</text><text x="430" y="320" font-size="14" fill="#475569" font-weight="400">Complete correspondence before next turn</text><text x="430" y="344" font-size="14" fill="#475569" font-weight="400">Dependent steps consume actual results</text><text x="430" y="368" font-size="14" fill="#475569" font-weight="400">Tool errors keep the task incomplete</text><text x="430" y="392" font-size="14" fill="#475569" font-weight="400">Final text still needs independent checks</text><text x="430" y="416" font-size="14" fill="#475569" font-weight="400">Blank/truncated/refused output is no success</text><text x="28" y="493" font-size="14" fill="#475569" font-weight="400">Call IDs provide correlation, not identity, authority, or idempotency.</text></g></svg>
