<text x="752" y="209" font-size="17" fill="#0f172a" font-weight="600">Choose one capstone</text>
<text x="752" y="235" font-size="15" fill="#334155" font-weight="400">Code, data or media</text>
<text x="48" y="275" font-size="16" fill="#334155" font-weight="400">Use evaluation and permissions from the first exercise. Libraries are optional.</text>
