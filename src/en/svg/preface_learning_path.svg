<text x="48" y="346" font-size="20" fill="#166534" font-weight="700">Branches triggered by a concrete need</text>
<rect x="48" y="361" width="292" height="87" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="60" y="388" font-size="21" fill="#166534" font-weight="700">9</text>
<text x="60" y="414" font-size="17" fill="#0f172a" font-weight="600">Reuse a verified workflow</text>
<text x="60" y="437" font-size="15" fill="#334155" font-weight="400">Skill contract, same permissions</text>
<rect x="354" y="361" width="292" height="87" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="366" y="388" font-size="21" fill="#166534" font-weight="700">12–15</text>
<text x="366" y="414" font-size="17" fill="#0f172a" font-weight="600">Optional product/design cases</text>
<text x="366" y="437" font-size="15" fill="#334155" font-weight="400">Choose a relevant case or skip</text>
<rect x="660" y="361" width="292" height="87" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="672" y="388" font-size="21" fill="#166534" font-weight="700">16–17</text>
<text x="672" y="414" font-size="17" fill="#0f172a" font-weight="600">Collaboration or integration</text>
<text x="672" y="437" font-size="15" fill="#334155" font-weight="400">Establish the actual boundary</text>
<rect x="28" y="494" width="944" height="119" rx="12" fill="#faf5ff" stroke="#e9d5ff"/>
<text x="48" y="527" font-size="19" fill="#7e22ce" font-weight="700">24–25 Research: measured limitations justify training or automatic improvement</text>
<text x="48" y="560" font-size="18" fill="#334155" font-weight="400">Frozen baseline → independent held-out set → candidate checks → activate or revert</text>
<text x="48" y="590" font-size="16" fill="#334155" font-weight="400">Training is not an application prerequisite; prompt/skill changes need not train weights.</text>
<text x="40" y="650" font-size="19" fill="#0f172a" font-weight="600">Every chapter: previous failure → addition → acceptance evidence → next decision</text>
<text x="40" y="681" font-size="16" fill="#334155" font-weight="400">The contents define the order. Chapters label supplied examples, exercises and verification limits.</text>
