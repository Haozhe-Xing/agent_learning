<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="760" height="460" fill="#F0F3F7" rx="12"/>

  <!-- Title -->
  <text x="380" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1A2340">LLM Architecture Evolution Panorama: Consensus Stack vs Frontier Divergence</text>

  <!-- === Left: Consensus Stack 2024-2025 === -->
  <rect x="30" y="55" width="330" height="380" rx="10" fill="white" stroke="#2C3E6B" stroke-width="2"/>
  <!-- Title bar -->
  <rect x="30" y="55" width="330" height="46" rx="10" fill="#2C3E6B"/>
  <rect x="30" y="89" width="330" height="12" fill="#2C3E6B"/>
  <text x="195" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Consensus Stack</text>
  <text x="195" y="95" text-anchor="middle" font-size="12" fill="#BDC8E8">2024-2025, adopted by almost all mainstream LLMs</text>

  <!-- Component list -->
  <g transform="translate(50, 118)">
    <rect x="0" y="0" width="290" height="36" rx="6" fill="#EBF5FB" stroke="#85C1E9" stroke-width="1"/>
    <text x="22" y="22" font-size="13" fill="#1A5276" font-weight="bold">1. Decoder-Only Architecture</text>
    <text x="22" y="22" font-size="11" fill="#5D6D7E">                              Autoregressive generation, no Encoder</text>

    <rect x="0" y="46" width="290" height="36" rx="6" fill="#EBF5FB" stroke="#85C1E9" stroke-width="1"/>
    <text x="22" y="68" font-size="13" fill="#1A5276" font-weight="bold">2. Pre-LayerNorm + RMSNorm</text>

    <rect x="0" y="92" width="290" height="36" rx="6" fill="#E9F7EF" stroke="#82E0AA" stroke-width="1"/>
    <text x="22" y="114" font-size="13" fill="#1E8449" font-weight="bold">3. RoPE Position Encoding ✅</text>
    <text x="22" y="114" font-size="11" fill="#5D6D7E">                             Strong extrapolation</text>

    <rect x="0" y="138" width="290" height="36" rx="6" fill="#FEF9E7" stroke="#FAD7A0" stroke-width="1"/>
    <text x="22" y="160" font-size="13" fill="#7D6608" font-weight="bold">4. SwiGLU Activation Function</text>
    <text x="22" y="160" font-size="11" fill="#5D6D7E">                       Gating mechanism, better performance</text>

    <rect x="0" y="184" width="290" height="36" rx="6" fill="#F9EBF8" stroke="#C39BD3" stroke-width="1"/>
    <text x="22" y="206" font-size="13" fill="#6C3483" font-weight="bold">5. GQA or MLA Attention</text>
    <text x="22" y="206" font-size="11" fill="#5D6D7E">                          Reduce KV Cache overhead</text>

    <rect x="0" y="230" width="290" height="36" rx="6" fill="#FDEDEC" stroke="#F1948A" stroke-width="1"/>
    <text x="22" y="252" font-size="13" fill="#922B21" font-weight="bold">6. No Bias</text>

    <rect x="0" y="276" width="290" height="36" rx="6" fill="#EBF5FB" stroke="#85C1E9" stroke-width="1"/>
    <text x="22" y="298" font-size="13" fill="#1A5276" font-weight="bold">7. Large-scale Models → MoE</text>
    <text x="22" y="298" font-size="11" fill="#5D6D7E">                          Sparse activation, expand parameter count</text>
  </g>

  <!-- === Right: Frontier Divergence 2026 === -->
  <rect x="400" y="55" width="330" height="380" rx="10" fill="white" stroke="#E74C3C" stroke-width="2"/>
  <!-- Title bar -->
  <rect x="400" y="55" width="330" height="46" rx="10" fill="#E74C3C"/>
  <rect x="400" y="89" width="330" height="12" fill="#E74C3C"/>
  <text x="565" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Frontier Divergence</text>
  <text x="565" y="95" text-anchor="middle" font-size="12" fill="#FADBD8">2026 new breakthroughs, architecture competition reignited</text>

  <!-- Innovation list -->
  <g transform="translate(420, 118)">
    <rect x="0" y="0" width="290" height="44" rx="6" fill="#FDEDEC" stroke="#E74C3C" stroke-width="1.5"/>
    <text x="16" y="18" font-size="12" font-weight="bold" fill="#C0392B">Hybrid Attention Mechanism</text>
    <text x="16" y="34" font-size="11" fill="#7B241C">Gated DeltaNet · Kimi Linear · Lightning Attn</text>

    <rect x="0" y="54" width="290" height="44" rx="6" fill="#FEF9E7" stroke="#F39C12" stroke-width="1.5"/>
    <text x="16" y="72" font-size="12" font-weight="bold" fill="#D35400">Residual Connection Rewrite</text>
    <text x="16" y="88" font-size="11" fill="#7D6608">Attention Residuals · mHC Hyper-connections (DeepSeek V4)</text>

    <rect x="0" y="108" width="290" height="44" rx="6" fill="#E9F7EF" stroke="#27AE60" stroke-width="1.5"/>
    <text x="16" y="126" font-size="12" font-weight="bold" fill="#1A7A3C">Optimizer Innovation</text>
    <text x="16" y="142" font-size="11" fill="#1E8449">MuonClip replacing AdamW (Kimi K2 / K2.5)</text>

    <rect x="0" y="162" width="290" height="44" rx="6" fill="#EBF5FB" stroke="#3498DB" stroke-width="1.5"/>
    <text x="16" y="180" font-size="12" font-weight="bold" fill="#1A5276">Knowledge-Reasoning Separation</text>
    <text x="16" y="196" font-size="11" fill="#2471A3">Engram memory architecture (DeepSeek V4)</text>

    <rect x="0" y="216" width="290" height="44" rx="6" fill="#F9EBF8" stroke="#8E44AD" stroke-width="1.5"/>
    <text x="16" y="234" font-size="12" font-weight="bold" fill="#6C3483">Multi-Token Prediction (MTP)</text>
    <text x="16" y="250" font-size="11" fill="#7D3C98">Predict multiple tokens simultaneously (DeepSeek V4 / Qwen3.5)</text>

    <rect x="0" y="270" width="290" height="44" rx="6" fill="#FDEDEC" stroke="#E74C3C" stroke-width="1"/>
    <text x="16" y="288" font-size="12" font-weight="bold" fill="#C0392B">Architecture Competition Reignited</text>
    <text x="16" y="304" font-size="11" fill="#7B241C">From "data and scale" competition to real architectural innovation</text>
  </g>

  <!-- Middle relation indicator -->
  <text x="380" y="250" text-anchor="middle" font-size="28" fill="#BDC3C7">→</text>
  <text x="380" y="272" text-anchor="middle" font-size="11" fill="#95A5A6">Built on</text>
  <text x="380" y="285" text-anchor="middle" font-size="11" fill="#95A5A6">consensus base</text>

  <!-- Bottom -->
  <rect x="30" y="445" width="700" height="10" rx="4" fill="#EBF5FB"/>
  <text x="380" y="438" text-anchor="middle" font-size="11" fill="#2471A3">Differentiated competition is returning from "training data and scale" to architectural innovation — consensus stack is the foundation, breakthroughs are on the right</text>
</svg>
