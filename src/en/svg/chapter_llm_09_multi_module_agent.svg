<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L9,4 z" fill="#4f46e5"/>
    </marker>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L9,4 z" fill="#ef4444"/>
    </marker>
  </defs>
  <rect width="880" height="480" rx="18" fill="#f8fafc"/>
  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Multi-Module System of a Document QA Agent</text>
  <text x="440" y="58" text-anchor="middle" font-size="13" fill="#64748b">Each module has its own Prompt; changing one may affect others</text>

  <!-- User input -->
  <ellipse cx="110" cy="120" rx="70" ry="24" fill="#cffafe" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="110" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#0e7490">User Question</text>

  <!-- Query Analyzer -->
  <rect x="60" y="175" width="130" height="70" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="125" y="199" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">Query Analyzer</text>
  <text x="125" y="217" text-anchor="middle" font-size="10" fill="#2563eb">Understand user intent</text>
  <text x="125" y="233" text-anchor="middle" font-size="9" fill="#ef4444">⚠ Intent misjudged</text>

  <!-- Retriever -->
  <rect x="60" y="275" width="130" height="70" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="125" y="299" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">Retriever</text>
  <text x="125" y="317" text-anchor="middle" font-size="10" fill="#16a34a">Generate query to find docs</text>
  <text x="125" y="333" text-anchor="middle" font-size="9" fill="#ef4444">⚠ Retrieved irrelevant docs</text>

  <!-- Reader -->
  <rect x="270" y="275" width="130" height="70" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="335" y="299" text-anchor="middle" font-size="13" font-weight="bold" fill="#c2410c">Reader</text>
  <text x="335" y="317" text-anchor="middle" font-size="10" fill="#ea580c">Extract evidence from docs</text>
  <text x="335" y="333" text-anchor="middle" font-size="9" fill="#ef4444">⚠ Citated weak evidence</text>

  <!-- Reasoner -->
  <rect x="270" y="175" width="130" height="70" rx="12" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.5"/>
  <text x="335" y="199" text-anchor="middle" font-size="13" font-weight="bold" fill="#be185d">Reasoner</text>
  <text x="335" y="217" text-anchor="middle" font-size="10" fill="#db2777">Combine evidence into answer</text>
  <text x="335" y="233" text-anchor="middle" font-size="9" fill="#ef4444">⚠ Unsupported reasoning</text>

  <!-- Tool Selector -->
  <rect x="480" y="275" width="130" height="70" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="545" y="299" text-anchor="middle" font-size="13" font-weight="bold" fill="#6d28d9">Tool Selector</text>
  <text x="545" y="317" text-anchor="middle" font-size="10" fill="#7c3aed">Decide which tool to call</text>
  <text x="545" y="333" text-anchor="middle" font-size="9" fill="#ef4444">⚠ Wrong tool chosen</text>

  <!-- Validator -->
  <rect x="480" y="175" width="130" height="70" rx="12" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="545" y="199" text-anchor="middle" font-size="13" font-weight="bold" fill="#0e7490">Validator</text>
  <text x="545" y="217" text-anchor="middle" font-size="10" fill="#0891b2">Check answer reliability</text>
  <text x="545" y="233" text-anchor="middle" font-size="9" fill="#ef4444">⚠ Missed hallucination</text>

  <!-- Formatter -->
  <rect x="680" y="175" width="130" height="70" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="745" y="199" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">Formatter</text>
  <text x="745" y="217" text-anchor="middle" font-size="10" fill="#b45309">Output JSON / report</text>
  <text x="745" y="233" text-anchor="middle" font-size="9" fill="#ef4444">⚠ Broke schema</text>

  <!-- Safety Module -->
  <rect x="680" y="275" width="130" height="70" rx="12" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="745" y="299" text-anchor="middle" font-size="13" font-weight="bold" fill="#b91c1c">Safety Module</text>
  <text x="745" y="317" text-anchor="middle" font-size="10" fill="#dc2626">Block unsafe requests</text>
  <text x="745" y="333" text-anchor="middle" font-size="9" fill="#ef4444">⚠ Rules too lax or strict</text>

  <!-- Final Output -->
  <ellipse cx="745" cy="400" rx="70" ry="24" fill="#cffafe" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="745" y="406" text-anchor="middle" font-size="13" font-weight="bold" fill="#0e7490">Final Answer</text>

  <!-- Main flow arrows -->
  <line x1="110" y1="144" x2="115" y2="170" stroke="#4f46e5" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="125" y1="245" x2="125" y2="270" stroke="#4f46e5" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="190" y1="310" x2="265" y2="310" stroke="#4f46e5" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="335" y1="275" x2="335" y2="250" stroke="#4f46e5" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="400" y1="210" x2="475" y2="210" stroke="#4f46e5" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="610" y1="210" x2="675" y2="210" stroke="#4f46e5" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="745" y1="245" x2="745" y2="372" stroke="#4f46e5" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Tool selector branch -->
  <line x1="400" y1="310" x2="475" y2="310" stroke="#4f46e5" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Bottom problem box -->
  <rect x="130" y="388" width="440" height="70" rx="14" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/>
  <text x="350" y="412" text-anchor="middle" font-size="14" font-weight="bold" fill="#b91c1c">Final answer is wrong—which Prompt to edit?</text>
  <text x="350" y="432" text-anchor="middle" font-size="11" fill="#64748b">Retrieval too broad? Reader didn't demand citations? Reasoner allowed guessing?</text>
  <text x="350" y="448" text-anchor="middle" font-size="11" fill="#64748b">Validator missed errors? Or formatter corrupted structure?</text>

  <!-- Red dashed line from answer to problem box -->
  <path d="M675 400 L575 420" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr2)"/>
</svg>