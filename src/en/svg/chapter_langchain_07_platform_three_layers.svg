<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300">
  <defs>
    <style>text { font-family: 'Helvetica Neue', Arial, sans-serif; }</style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#7f8c8d"/>
    </marker>
  </defs>
  <rect width="680" height="300" rx="14" fill="#f0f4f8"/>
  <text x="340" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2c3e50">LangGraph Platform: Three-Layer Architecture</text>

  <rect x="60" y="48" width="560" height="62" rx="8" fill="#3498db"/>
  <text x="340" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="white">API Server (REST entry point)</text>
  <text x="340" y="92" text-anchor="middle" font-size="11" fill="#d6eaf8">Deployed on Kubernetes / Cloud Run · request routing, auth</text>

  <line x1="340" y1="110" x2="340" y2="132" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="60" y="134" width="560" height="62" rx="8" fill="#27ae60"/>
  <text x="340" y="158" text-anchor="middle" font-size="14" font-weight="bold" fill="white">State Server (state persistence)</text>
  <text x="340" y="178" text-anchor="middle" font-size="11" fill="#d5f5e3">Redis / PostgreSQL / in-memory · graph state &amp; checkpoints</text>

  <line x1="340" y1="196" x2="340" y2="218" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="60" y="220" width="560" height="62" rx="8" fill="#e67e22"/>
  <text x="340" y="244" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Worker Pool (async Workers)</text>
  <text x="340" y="264" text-anchor="middle" font-size="11" fill="#fdebd0">Runs the Agent · horizontally scalable · consumes queued tasks</text>
</svg>
