<text x="28" y="37" font-size="22" fill="#1e293b" font-weight="600" text-anchor="start">Choose by the missing capability, then stop</text><text x="28" y="63" font-size="13" fill="#475569" font-weight="400" text-anchor="start">A book decision model, not an official service architecture or a required upgrade sequence.</text><rect x="28" y="91" width="744" height="76" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="46" y="118" font-size="15" fill="#475569" font-weight="600" text-anchor="start">Known workflow</text><text x="303" y="118" font-size="16" fill="#2563eb" font-weight="600" text-anchor="start">Runnable</text><text x="46" y="147" font-size="14" fill="#475569" font-weight="400" text-anchor="start">Test values, routing, failure, acceptance; stop here</text><rect x="28" y="179" width="744" height="76" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="46" y="206" font-size="15" fill="#475569" font-weight="600" text-anchor="start">Model selects tools</text><text x="303" y="206" font-size="16" fill="#2563eb" font-weight="600" text-anchor="start">create_agent</text><text x="46" y="235" font-size="14" fill="#475569" font-weight="400" text-anchor="start">Set tool permissions and budgets; stop here</text><rect x="28" y="267" width="744" height="76" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="46" y="294" font-size="15" fill="#475569" font-weight="600" text-anchor="start">State / recovery needed</text><text x="303" y="294" font-size="16" fill="#2563eb" font-weight="600" text-anchor="start">LangGraph</text><text x="46" y="323" font-size="14" fill="#475569" font-weight="400" text-anchor="start">Configure persistence; test replay and side effects</text><rect x="28" y="355" width="744" height="76" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="46" y="382" font-size="15" fill="#475569" font-weight="600" text-anchor="start">Operations need</text><text x="303" y="382" font-size="16" fill="#2563eb" font-weight="600" text-anchor="start">Optional hosting</text><text x="46" y="411" font-size="14" fill="#475569" font-weight="400" text-anchor="start">Review data, access, region, costs, service limits</text><rect x="28" y="458" width="744" height="42" rx="12" fill="#eff6ff" stroke="#93c5fd"/><text x="400" y="485" font-size="14" fill="#2563eb" font-weight="600" text-anchor="middle">The application defines authority, failure, and evidence of completion.</text></g></svg>
