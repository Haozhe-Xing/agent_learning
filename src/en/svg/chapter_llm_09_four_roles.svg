<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L9,4 z" fill="#4f46e5"/>
    </marker>
  </defs>
  <rect width="800" height="380" rx="18" fill="#f8fafc"/>
  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">The Four Roles of Auto Prompt Optimization</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="#64748b">Execute → Evaluate → Rewrite → Select, like a curriculum committee refining textbooks</text>

  <!-- Executor -->
  <rect x="40" y="100" width="155" height="90" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="117" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">Executor</text>
  <text x="117" y="150" text-anchor="middle" font-size="11" fill="#2563eb">Runs task with current Prompt</text>
  <text x="117" y="168" text-anchor="middle" font-size="11" fill="#2563eb">Produces output and trace</text>
  <text x="117" y="183" text-anchor="middle" font-size="10" fill="#94a3b8">Analogy: student taking test</text>

  <!-- Evaluator -->
  <rect x="230" y="100" width="155" height="90" rx="14" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="307" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#15803d">Evaluator</text>
  <text x="307" y="150" text-anchor="middle" font-size="11" fill="#16a34a">Judges answer quality</text>
  <text x="307" y="168" text-anchor="middle" font-size="11" fill="#16a34a">Gives scores & text feedback</text>
  <text x="307" y="183" text-anchor="middle" font-size="10" fill="#94a3b8">Analogy: teacher grading homework</text>

  <!-- Rewriter -->
  <rect x="420" y="100" width="155" height="90" rx="14" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
  <text x="497" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#be185d">Rewriter</text>
  <text x="497" y="150" text-anchor="middle" font-size="11" fill="#db2777">Modifies Prompt from feedback</text>
  <text x="497" y="168" text-anchor="middle" font-size="11" fill="#db2777">Generates new candidate versions</text>
  <text x="497" y="183" text-anchor="middle" font-size="10" fill="#94a3b8">Analogy: teacher revising handouts</text>

  <!-- Selector -->
  <rect x="610" y="100" width="155" height="90" rx="14" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="687" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#6d28d9">Selector</text>
  <text x="687" y="150" text-anchor="middle" font-size="11" fill="#7c3aed">Decides which version to keep</text>
  <text x="687" y="168" text-anchor="middle" font-size="11" fill="#7c3aed">Multi-dimensional judgment</text>
  <text x="687" y="183" text-anchor="middle" font-size="10" fill="#94a3b8">Analogy: committee selecting textbook</text>

  <!-- Arrows -->
  <line x1="195" y1="145" x2="225" y2="145" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="385" y1="145" x2="415" y2="145" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="575" y1="145" x2="605" y2="145" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Bottom: Cycle back to executor -->
  <path d="M687 190 L687 230 L117 230 L117 195" fill="none" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Who can play each role -->
  <rect x="40" y="260" width="725" height="100" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="400" y="286" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">The four roles can be played by the same or different components</text>

  <text x="117" y="312" text-anchor="middle" font-size="11" fill="#3b82f6">Executor → Cheap small model</text>
  <text x="307" y="312" text-anchor="middle" font-size="11" fill="#22c55e">Evaluator → Rules / Unit tests / Human</text>
  <text x="497" y="312" text-anchor="middle" font-size="11" fill="#ec4899">Rewriter → Stronger model</text>
  <text x="687" y="312" text-anchor="middle" font-size="11" fill="#8b5cf6">Selector → Validation set + Safety check</text>

  <text x="400" y="346" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748b">Core Pipeline: Execute → Observe → Explain → Modify → Validate → Select</text>
</svg>