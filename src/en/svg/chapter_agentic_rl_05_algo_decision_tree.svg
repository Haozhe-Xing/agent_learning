<svg viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#2C3E6B"/>
    </marker>
  </defs>
  <rect width="760" height="380" fill="#F8FAFC" rx="12"/>
  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1A2340">RL Algorithm Selection Decision Tree</text>

  <!-- Root question -->
  <rect x="220" y="45" width="320" height="38" rx="8" fill="#2C3E6B"/>
  <text x="380" y="69" text-anchor="middle" font-size="13" fill="white" font-weight="bold">Does the task have objectively verifiable evaluation criteria?</text>

  <!-- Left branch line (No) -->
  <line x1="265" y1="83" x2="170" y2="115" stroke="#2C3E6B" stroke-width="2" marker-end="url(#a)"/>
  <text x="200" y="106" text-anchor="middle" font-size="12" fill="#E74C3C" font-weight="bold">No</text>

  <!-- Right branch line (Yes) -->
  <line x1="495" y1="83" x2="580" y2="115" stroke="#2C3E6B" stroke-width="2" marker-end="url(#a)"/>
  <text x="555" y="106" text-anchor="middle" font-size="12" fill="#27AE60" font-weight="bold">Yes</text>

  <!-- Left child question -->
  <rect x="40" y="115" width="260" height="38" rx="8" fill="#5D6D7E"/>
  <text x="170" y="139" text-anchor="middle" font-size="12" fill="white">Does evaluation mainly rely on human preference?</text>

  <!-- Left sub-branch (Yes) -->
  <line x1="100" y1="153" x2="70" y2="185" stroke="#5D6D7E" stroke-width="2" marker-end="url(#a)"/>
  <text x="70" y="175" text-anchor="middle" font-size="11" fill="#27AE60" font-weight="bold">Yes</text>

  <!-- Left sub-branch (No) -->
  <line x1="240" y1="153" x2="270" y2="185" stroke="#5D6D7E" stroke-width="2" marker-end="url(#a)"/>
  <text x="268" y="175" text-anchor="middle" font-size="11" fill="#E74C3C" font-weight="bold">No</text>

  <!-- Left sub-sub question: preference data -->
  <rect x="20" y="185" width="175" height="38" rx="8" fill="#8E44AD"/>
  <text x="107" y="203" text-anchor="middle" font-size="11" fill="white">Enough preference labeled data?</text>
  <text x="107" y="217" text-anchor="middle" font-size="10" fill="#E8DAEF">(Human preference comparison samples)</text>

  <line x1="60" y1="223" x2="60" y2="255" stroke="#8E44AD" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="43" y="247" font-size="11" fill="#27AE60" font-weight="bold">Yes</text>
  <line x1="155" y1="223" x2="155" y2="255" stroke="#8E44AD" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="157" y="247" font-size="11" fill="#E74C3C" font-weight="bold">No</text>

  <!-- DPO recommendation -->
  <rect x="20" y="255" width="78" height="52" rx="8" fill="#27AE60"/>
  <text x="59" y="275" text-anchor="middle" font-size="13" fill="white" font-weight="bold">DPO</text>
  <text x="59" y="291" text-anchor="middle" font-size="10" fill="white">✅ Simplest</text>
  <text x="59" y="303" text-anchor="middle" font-size="10" fill="white">Efficient</text>

  <!-- Collect preference data or PPO+RM -->
  <rect x="110" y="255" width="88" height="52" rx="8" fill="#7F8C8D"/>
  <text x="154" y="275" text-anchor="middle" font-size="11" fill="white">Collect First</text>
  <text x="154" y="291" text-anchor="middle" font-size="11" fill="white">Preference Data</text>
  <text x="154" y="305" text-anchor="middle" font-size="10" fill="#BDC3C7">or PPO+RM</text>

  <!-- Left No: consider SFT -->
  <rect x="238" y="185" width="122" height="52" rx="8" fill="#95A5A6"/>
  <text x="299" y="205" text-anchor="middle" font-size="11" fill="white">Consider whether</text>
  <text x="299" y="221" text-anchor="middle" font-size="11" fill="white">RL is needed</text>
  <text x="299" y="237" text-anchor="middle" font-size="10" fill="#ECF0F1">(Maybe SFT is enough)</text>

  <!-- Right child question: model size -->
  <rect x="460" y="115" width="240" height="38" rx="8" fill="#1A6B9A"/>
  <text x="580" y="139" text-anchor="middle" font-size="12" fill="white">Model size > 7B parameters?</text>

  <line x1="520" y1="153" x2="490" y2="185" stroke="#1A6B9A" stroke-width="2" marker-end="url(#a)"/>
  <text x="493" y="176" font-size="11" fill="#27AE60" font-weight="bold">Yes</text>
  <line x1="640" y1="153" x2="660" y2="185" stroke="#1A6B9A" stroke-width="2" marker-end="url(#a)"/>
  <text x="660" y="176" font-size="11" fill="#E74C3C" font-weight="bold">No</text>

  <!-- GRPO recommendation -->
  <rect x="440" y="185" width="100" height="70" rx="8" fill="#27AE60"/>
  <text x="490" y="207" text-anchor="middle" font-size="14" fill="white" font-weight="bold">GRPO</text>
  <text x="490" y="225" text-anchor="middle" font-size="11" fill="white">✅ Memory-friendly</text>
  <text x="490" y="241" text-anchor="middle" font-size="11" fill="white">DeepSeek-R1</text>
  <text x="490" y="253" text-anchor="middle" font-size="11" fill="#D4EFDF">Verified</text>

  <!-- PPO or GRPO -->
  <rect x="568" y="185" width="120" height="70" rx="8" fill="#5D6D7E"/>
  <text x="628" y="207" text-anchor="middle" font-size="12" fill="white">PPO or GRPO</text>
  <text x="628" y="224" text-anchor="middle" font-size="11" fill="#BDC3C7">Both OK</text>

  <line x1="598" y1="255" x2="590" y2="283" stroke="#5D6D7E" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="658" y1="255" x2="665" y2="283" stroke="#5D6D7E" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="555" y="283" width="78" height="42" rx="6" fill="#2471A3"/>
  <text x="594" y="302" text-anchor="middle" font-size="11" fill="white" font-weight="bold">PPO</text>
  <text x="594" y="318" text-anchor="middle" font-size="10" fill="#AED6F1">General Toolchain</text>

  <rect x="644" y="283" width="78" height="42" rx="6" fill="#1A7A52"/>
  <text x="683" y="302" text-anchor="middle" font-size="11" fill="white" font-weight="bold">GRPO</text>
  <text x="683" y="318" text-anchor="middle" font-size="10" fill="#A9DFBF">Simple & Efficient</text>

  <!-- Bottom note -->
  <rect x="30" y="350" width="700" height="22" rx="5" fill="#EBF5FB"/>
  <text x="380" y="365" text-anchor="middle" font-size="11" fill="#2471A3">💡 GRPO has the lowest memory overhead on large models (no Critic model needed), verified effective by top models like DeepSeek-R1</text>
</svg>
