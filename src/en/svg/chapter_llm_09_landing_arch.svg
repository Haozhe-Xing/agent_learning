<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L9,4 z" fill="#4f46e5"/>
    </marker>
  </defs>
  <rect width="900" height="520" rx="18" fill="#f8fafc"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Auto Prompt Optimization: Minimal Viable Architecture</text>
  <text x="450" y="58" text-anchor="middle" font-size="13" fill="#64748b">Start with three core components, add features incrementally</text>

  <!-- Core three-piece label -->
  <rect x="40" y="78" width="820" height="36" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="450" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">Step 1: Core Three Components (Required)</text>

  <!-- Evaluator -->
  <rect x="40" y="130" width="250" height="120" rx="14" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="165" y="158" text-anchor="middle" font-size="16" font-weight="bold" fill="#15803d">Evaluator</text>
  <text x="165" y="180" text-anchor="middle" font-size="12" fill="#16a34a">Rule-based Eval (Simplest)</text>
  <line x1="70" y1="195" x2="260" y2="195" stroke="#bbf7d0" stroke-width="1"/>
  <text x="165" y="215" text-anchor="middle" font-size="11" fill="#15803d">· Keyword matching</text>
  <text x="165" y="233" text-anchor="middle" font-size="11" fill="#15803d">· JSON schema validation</text>
  <text x="165" y="251" text-anchor="middle" font-size="11" fill="#15803d">· Unit test pass rate</text>

  <!-- Prompt Candidate Pool -->
  <rect x="325" y="130" width="250" height="120" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="450" y="158" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d4ed8">Prompt Candidate Pool</text>
  <text x="450" y="180" text-anchor="middle" font-size="12" fill="#2563eb">Version Management (Core)</text>
  <line x1="355" y1="195" x2="545" y2="195" stroke="#bfdbfe" stroke-width="1"/>
  <text x="450" y="215" text-anchor="middle" font-size="11" fill="#1d4ed8">· Initial version + variant versions</text>
  <text x="450" y="233" text-anchor="middle" font-size="11" fill="#1d4ed8">· Each version bound to eval score</text>
  <text x="450" y="251" text-anchor="middle" font-size="11" fill="#1d4ed8">· Validation set + safety checks</text>

  <!-- Simple Selector -->
  <rect x="610" y="130" width="250" height="120" rx="14" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="735" y="158" text-anchor="middle" font-size="16" font-weight="bold" fill="#6d28d9">Simple Selector</text>
  <text x="735" y="180" text-anchor="middle" font-size="12" fill="#7c3aed">Greedy / Bandit</text>
  <line x1="640" y1="195" x2="830" y2="195" stroke="#ddd6fe" stroke-width="1"/>
  <text x="735" y="215" text-anchor="middle" font-size="11" fill="#6d28d9">· Greedy: Pick highest validation score</text>
  <text x="735" y="233" text-anchor="middle" font-size="11" fill="#6d28d9">· Bandit: Balance exploration & exploitation</text>
  <text x="735" y="251" text-anchor="middle" font-size="11" fill="#6d28d9">· Safety gate: Block dangerous changes</text>

  <!-- Arrow connections for core three -->
  <line x1="290" y1="190" x2="320" y2="190" stroke="#4f46e5" stroke-width="2.2" marker-end="url(#arr)"/>
  <line x1="575" y1="190" x2="605" y2="190" stroke="#4f46e5" stroke-width="2.2" marker-end="url(#arr)"/>

  <!-- Advanced label -->
  <rect x="40" y="278" width="820" height="36" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="450" y="302" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">Step 2: Add Reflection (Recommended)</text>

  <!-- Reflection Rewriter -->
  <rect x="40" y="330" width="280" height="80" rx="14" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.5"/>
  <text x="180" y="358" text-anchor="middle" font-size="15" font-weight="bold" fill="#be185d">Reflection Rewriter</text>
  <text x="180" y="378" text-anchor="middle" font-size="11" fill="#db2777">LLM reads error trace, rewrites Prompt</text>
  <text x="180" y="396" text-anchor="middle" font-size="11" fill="#db2777">Key: Require concrete edit suggestions</text>

  <!-- Enhanced Evaluator -->
  <rect x="350" y="330" width="230" height="80" rx="14" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="465" y="358" text-anchor="middle" font-size="15" font-weight="bold" fill="#0e7490">Enhanced Evaluator</text>
  <text x="465" y="378" text-anchor="middle" font-size="11" fill="#0891b2">LLM-as-judge</text>
  <text x="465" y="396" text-anchor="middle" font-size="11" fill="#0891b2">Human spot-check + hybrid rules</text>

  <!-- Trace Collector -->
  <rect x="610" y="330" width="250" height="80" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="735" y="358" text-anchor="middle" font-size="15" font-weight="bold" fill="#c2410c">Trace Collector</text>
  <text x="735" y="378" text-anchor="middle" font-size="11" fill="#ea580c">Record full execution trace</text>
  <text x="735" y="396" text-anchor="middle" font-size="11" fill="#ea580c">Input / Output / Intermediates / Tool calls</text>

  <!-- Advanced label -->
  <rect x="40" y="430" width="820" height="36" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1"/>
  <text x="450" y="454" text-anchor="middle" font-size="14" font-weight="bold" fill="#6d28d9">Step 3: Advanced Optimization (GEPA-Style)</text>

  <rect x="40" y="478" width="820" height="30" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="450" y="498" text-anchor="middle" font-size="11" fill="#64748b">Pareto Front · Population Evolution · Multi-Objective Eval · Skill Retention · Auto Adversarial Testing</text>
</svg>