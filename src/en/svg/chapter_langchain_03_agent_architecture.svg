<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 0 800 330" role="img" aria-labelledby="title desc">
<title id="title">create_agent: an observable message loop</title><desc id="desc">Tool requests become ToolMessages; the model then runs again</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#475569"/></marker></defs>
<rect width="800" height="330" rx="14" fill="#f8fafc"/>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle" fill="#0f172a">
<text x="400" y="29" font-size="20" font-weight="bold">create_agent: an observable message loop</text>
<text x="400" y="52" font-size="12" fill="#475569">Tool requests become ToolMessages; the model then runs again</text>
<rect x="30" y="113" width="185" height="82" rx="10" fill="#dbeafe" stroke="#60a5fa"/>
<text x="122" y="146" font-size="17" font-weight="bold">Model node</text><text x="122" y="172" font-size="13">AIMessage</text>
<rect x="310" y="113" width="200" height="82" rx="10" fill="#dcfce7" stroke="#4ade80"/>
<text x="410" y="146" font-size="17" font-weight="bold">Registered tool</text><text x="410" y="172" font-size="13">calculate → safe_math</text>
<rect x="605" y="113" width="165" height="82" rx="10" fill="#fef3c7" stroke="#fbbf24"/>
<text x="687" y="146" font-size="17" font-weight="bold">Final message</text><text x="687" y="172" font-size="12">No tool_calls: finish</text>
<path d="M215 140 H310" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="337" y="103" font-size="12">tool_calls: name, args, ID</text>
<path d="M410 195 V222 H122 V195" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="270" y="242" font-size="12">ToolMessage: result + matching call ID</text>
<path d="M122 113 V75 H687 V113" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="625" y="68" font-size="12">No tool requests</text>
<rect x="30" y="260" width="740" height="33" rx="8" fill="#e2e8f0"/>
<text x="400" y="282" font-size="13" font-weight="bold">Before execution: model-call limit / tool-request limit</text>
<text x="400" y="314" font-size="12" fill="#475569">messages records actions; call counts, graph steps, and elapsed time differ</text>
</g></svg>