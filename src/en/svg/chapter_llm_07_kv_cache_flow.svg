<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 240" width="520" height="240" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6366f1"/>
    </marker>
  </defs>
  <rect width="520" height="240" rx="12" fill="#f8fafc"/>
  <text x="260" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">KV Cache: Prefill vs Decode Two Phases</text>

  <!-- Prefill -->
  <rect x="16" y="44" width="230" height="100" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="131" y="62" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">Prefill Phase (Compute-bound)</text>
  <text x="131" y="78" text-anchor="middle" font-size="10" fill="#3b82f6">Input full prompt (parallel processing)</text>
  <text x="131" y="94" text-anchor="middle" font-size="10" fill="#3b82f6">Compute Q/K/V for all tokens at once</text>
  <text x="131" y="110" text-anchor="middle" font-size="10" fill="#3b82f6">Initialize KV Cache</text>
  <rect x="28" y="118" width="206" height="20" rx="4" fill="#bfdbfe" stroke="#60a5fa" stroke-width="1"/>
  <text x="131" y="132" text-anchor="middle" font-size="10" fill="#1e40af">GPU compute fully utilized ✅</text>

  <!-- Decode -->
  <rect x="274" y="44" width="230" height="100" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="389" y="62" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">Decode Phase (Memory bandwidth-bound)</text>
  <text x="389" y="78" text-anchor="middle" font-size="10" fill="#22c55e">Process only 1 new token at a time</text>
  <text x="389" y="94" text-anchor="middle" font-size="10" fill="#22c55e">Read historical K/V from KV Cache</text>
  <text x="389" y="110" text-anchor="middle" font-size="10" fill="#22c55e">Attention matrix: 1 × N (vs N×N)</text>
  <rect x="286" y="118" width="206" height="20" rx="4" fill="#bbf7d0" stroke="#4ade80" stroke-width="1"/>
  <text x="389" y="132" text-anchor="middle" font-size="10" fill="#166534">Bottleneck is memory bandwidth, not compute ⚠️</text>

  <!-- KV Cache explanation -->
  <rect x="16" y="158" width="488" height="70" rx="8" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
  <text x="260" y="176" text-anchor="middle" font-size="12" font-weight="bold" fill="#a16207">Cost of KV Cache</text>
  <text x="260" y="194" text-anchor="middle" font-size="11" fill="#a16207">Memory = 2 × n_layers × n_kv_heads × head_dim × seq_len × dtype_bytes</text>
  <text x="260" y="212" text-anchor="middle" font-size="10" fill="#a16207">Llama 2-70B (MHA): ~2.5 GB / 1K tokens | Llama 3-70B (GQA): ~0.32 GB / 1K tokens</text>
  <text x="260" y="224" text-anchor="middle" font-size="10" fill="#a16207">DeepSeek-V3 (MLA): ~0.04 GB / 1K tokens  ← ~70x improvement!</text>
</svg>
