<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 340" width="420" height="340" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <!-- Background -->
  <rect width="420" height="340" rx="12" fill="#f8fafc"/>
  <!-- Title -->
  <text x="210" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Layered Architecture Dependency Rules</text>

  <!-- Layer 4：api/routes -->
  <rect x="60" y="55" width="300" height="52" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="210" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">api/routes/（Route Layer）</text>
  <text x="210" y="95" text-anchor="middle" font-size="11" fill="#3b82f6">← Only callable by server.ts</text>

  <!-- Arrow 4→3 -->
  <line x1="210" y1="107" x2="210" y2="128" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="225" y="121" font-size="10" fill="#64748b">Depends on</text>

  <!-- Layer 3：services -->
  <rect x="60" y="130" width="300" height="52" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="210" y="151" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">services/（Business Logic Layer）</text>
  <text x="210" y="170" text-anchor="middle" font-size="11" fill="#22c55e">← Only callable by api/routes</text>

  <!-- Arrow 3→2 -->
  <line x1="210" y1="182" x2="210" y2="203" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="225" y="196" font-size="10" fill="#64748b">Depends on</text>

  <!-- Layer 2：lib/db -->
  <rect x="60" y="205" width="300" height="52" rx="8" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
  <text x="210" y="226" text-anchor="middle" font-size="13" font-weight="bold" fill="#a16207">lib/db/（Data Access Layer）</text>
  <text x="210" y="245" text-anchor="middle" font-size="11" fill="#eab308">← Only callable by services</text>

  <!-- Arrow 2→1 -->
  <line x1="210" y1="257" x2="210" y2="278" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="225" y="271" font-size="10" fill="#64748b">Depends on</text>

  <!-- Layer 1：types -->
  <rect x="60" y="280" width="300" height="44" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="210" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#7e22ce">types/（Type Definitions）</text>
  <text x="210" y="317" text-anchor="middle" font-size="11" fill="#a855f7">← Depends on no internal modules</text>

  <!-- Arrow标记 -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>