<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="680" height="280">
  <defs>
    <style>text { font-family: 'Helvetica Neue', Arial, sans-serif; }</style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#7f8c8d"/>
    </marker>
  </defs>
  <rect width="680" height="280" rx="14" fill="#f0f4f8"/>
  <text x="340" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2c3e50">Cross-Channel Identity: Session Merge</text>

  <rect x="220" y="46" width="240" height="40" rx="8" fill="#2c3e50"/>
  <text x="340" y="71" text-anchor="middle" font-size="13" font-weight="bold" fill="white">UserIdentity.phone = "+1-555-0123"</text>

  <line x1="340" y1="86" x2="340" y2="106" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="80" y="108" width="210" height="34" rx="6" fill="#27ae60"/>
  <text x="185" y="130" text-anchor="middle" font-size="11" font-weight="bold" fill="white">whatsapp:+1-555-0123</text>
  <rect x="80" y="146" width="210" height="34" rx="6" fill="#3498db"/>
  <text x="185" y="168" text-anchor="middle" font-size="11" font-weight="bold" fill="white">telegram:+1-555-0123</text>
  <rect x="80" y="184" width="210" height="34" rx="6" fill="#16a085"/>
  <text x="185" y="206" text-anchor="middle" font-size="11" font-weight="bold" fill="white">signal:+1-555-0123</text>

  <line x1="290" y1="125" x2="330" y2="125" stroke="#7f8c8d" stroke-width="1.6"/>
  <line x1="290" y1="163" x2="330" y2="163" stroke="#7f8c8d" stroke-width="1.6"/>
  <line x1="290" y1="201" x2="330" y2="201" stroke="#7f8c8d" stroke-width="1.6"/>
  <line x1="330" y1="125" x2="330" y2="201" stroke="#7f8c8d" stroke-width="1.6"/>
  <line x1="330" y1="163" x2="350" y2="163" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="360" y="130" width="240" height="66" rx="8" fill="#8e44ad"/>
  <text x="480" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="white">unified session</text>
  <text x="480" y="170" text-anchor="middle" font-size="11" fill="#e8daef">user:phone-555-0123</text>
  <text x="480" y="186" text-anchor="middle" font-size="10" fill="#d2b4de">three channels share one session</text>

  <text x="340" y="236" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3e50">Shared: Memory · Skills · Persona (consistent)</text>
  <text x="340" y="256" text-anchor="middle" font-size="10" fill="#7f8c8d">No matter which channel the user messages from, the Agent remembers the same person, skills, and tone</text>
</svg>
