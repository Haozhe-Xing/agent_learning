<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="760" height="410" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <marker id="dn" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto"><path d="M1,0 L9,0 L5,9 z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="760" height="410" rx="18" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">自我进化的四个层级</text>
  <text x="380" y="58" text-anchor="middle" font-size="13" fill="#64748b">越往下收益越大，但风险与成本也越高</text>

  <!-- 左侧递进轴 -->
  <text x="92" y="92" font-size="11" fill="#94a3b8" text-anchor="middle">低</text>
  <line x1="92" y1="104" x2="92" y2="340" stroke="#cbd5e1" stroke-width="2" marker-end="url(#dn)"/>
  <text x="92" y="364" font-size="11" fill="#94a3b8" text-anchor="middle">高</text>
  <text x="74" y="222" font-size="11" fill="#94a3b8" text-anchor="middle" transform="rotate(-90 74 222)">收益 / 成本 / 风险</text>

  <!-- L1 -->
  <rect x="150" y="80" width="430" height="58" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="170" y="104" font-size="14" font-weight="bold" fill="#15803d">L1 记忆进化</text>
  <text x="170" y="125" font-size="11" fill="#16a34a">把成功策略与失败教训写入长期记忆 · 成本低 · 风险：记忆污染</text>

  <!-- L2 -->
  <rect x="150" y="148" width="470" height="58" rx="10" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="170" y="172" font-size="14" font-weight="bold" fill="#0e7490">L2 Prompt 进化</text>
  <text x="170" y="193" font-size="11" fill="#0891b2">自动生成更好的指令与约束（System Prompt / 工具说明）· 成本低-中 · 风险：过拟合</text>

  <!-- L3 -->
  <rect x="150" y="216" width="510" height="58" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="170" y="240" font-size="14" font-weight="bold" fill="#1d4ed8">L3 Skill 进化</text>
  <text x="170" y="261" font-size="11" fill="#2563eb">把高频任务封装为可复用技能 / 脚本 / 工作流 · 成本中 · 风险：技能错误被反复复用</text>

  <!-- L4 -->
  <rect x="150" y="284" width="560" height="58" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8"/>
  <text x="170" y="308" font-size="14" font-weight="bold" fill="#b91c1c">L4 Model 进化</text>
  <text x="170" y="329" font-size="11" fill="#dc2626">通过数据飞轮做 SFT / DPO / RL 更新权重 · 成本高 · 风险：灾难性遗忘、难回退</text>

  <text x="380" y="376" text-anchor="middle" font-size="12" fill="#475569">生产实践：先从 L1 / L2 起步，轨迹稳定后再进入 L3 技能沉淀与 L4 模型训练</text>
  <text x="380" y="396" text-anchor="middle" font-size="11" fill="#94a3b8">第一类工作对应 L1–L3（不改权重），第二 / 三类工作对应 L4（改权重）</text>
</svg>
