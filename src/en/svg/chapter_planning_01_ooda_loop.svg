<svg xmlns="http://www.w3.org/2000/svg" width="920" height="460" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">OODA: public state and responsibilities</title>
  <desc id="desc">Public observations, requirement comparison, bounded decisions and feedback; acceptance is checked independently.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#64748b" />
    </marker>
  </defs>
  <rect width="920" height="460" fill="#f8fafc" />
  <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="460" y="35" font-size="22" fill="#0f172a" font-weight="bold" text-anchor="middle">OODA: public state and responsibilities</text>
    <text x="460" y="68" font-size="15" fill="#334155" font-weight="normal" text-anchor="middle">Release brief: approval record, budget and rollback condition</text>
    <rect x="24" y="108" width="200" height="122" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" />
    <text x="124.0" y="136" font-size="17" fill="#2563eb" font-weight="bold" text-anchor="middle">Observe</text>
    <text x="124.0" y="163" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">Read three source records</text>
    <text x="124.0" y="186" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">Keep value and source</text>
    <path d="M 226 169 L 246 169" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="248" y="108" width="200" height="122" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" />
    <text x="348.0" y="136" font-size="17" fill="#2563eb" font-weight="bold" text-anchor="middle">Orient</text>
    <text x="348.0" y="163" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">Compare frozen requirements</text>
    <text x="348.0" y="186" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">Identify gaps and conflicts</text>
    <path d="M 450 169 L 470 169" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="472" y="108" width="200" height="122" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" />
    <text x="572.0" y="136" font-size="17" fill="#2563eb" font-weight="bold" text-anchor="middle">Decide</text>
    <text x="572.0" y="163" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">Choose a registered action</text>
    <text x="572.0" y="186" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">Check the remaining budget</text>
    <path d="M 674 169 L 694 169" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="696" y="108" width="200" height="122" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" />
    <text x="796.0" y="136" font-size="17" fill="#2563eb" font-weight="bold" text-anchor="middle">Act</text>
    <text x="796.0" y="163" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">Run load / compose</text>
    <text x="796.0" y="186" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">Record results or errors</text>
    <path d="M 820 232 L 820 278 L 124 278 L 124 234" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
    <text x="460" y="270" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">New results update state; errors or exhausted budgets can end the loop</text>
    <rect x="24" y="310" width="872" height="72" rx="9" fill="#e8eef7" />
    <text x="460" y="335" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">Independent acceptance: source support + all three requirements must pass</text>
    <text x="460" y="359" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">These are responsibilities, not four required model calls or a private reasoning log.</text>
  </g>
</svg>
