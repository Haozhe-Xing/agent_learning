<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-labelledby="title">
<title id="title">RAG: Documents to Independent Acceptance</title>
<style>text { font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }</style>
<rect width="900" height="460" rx="14" fill="#f0f4f8"/>
<text x="450" y="37" text-anchor="middle" font-size="20" font-weight="bold" fill="#233447">RAG: Documents to Independent Acceptance</text>
<rect x="30" y="85" width="260" height="115" rx="10" fill="#2c3e50"/>
<text x="160" y="116" text-anchor="middle" font-size="16" fill="white" font-weight="bold">① Load and chunk</text>
<text x="160" y="145" text-anchor="middle" font-size="12" fill="white">Source / version / original offsets</text>
<text x="160" y="174" text-anchor="middle" font-size="12" fill="white">Extraction failure stays visible</text>
<rect x="320" y="85" width="260" height="115" rx="10" fill="#236fa3"/>
<text x="450" y="116" text-anchor="middle" font-size="16" fill="white" font-weight="bold">② Index</text>
<text x="450" y="145" text-anchor="middle" font-size="12" fill="white">Chunk IDs / scope / encoder contract</text>
<text x="450" y="174" text-anchor="middle" font-size="12" fill="white">Source changes must reach indexes</text>
<rect x="610" y="85" width="260" height="115" rx="10" fill="#73519a"/>
<text x="740" y="116" text-anchor="middle" font-size="16" fill="white" font-weight="bold">③ Retrieve candidates</text>
<text x="740" y="145" text-anchor="middle" font-size="12" fill="white">Filter access before ranking</text>
<text x="740" y="174" text-anchor="middle" font-size="12" fill="white">A hit is not an answer</text>
<rect x="610" y="250" width="260" height="115" rx="10" fill="#936018"/>
<text x="740" y="281" text-anchor="middle" font-size="16" fill="white" font-weight="bold">④ Context and answer</text>
<text x="740" y="310" text-anchor="middle" font-size="12" fill="white">Attributed data within a budget</text>
<text x="740" y="339" text-anchor="middle" font-size="12" fill="white">Reference text grants no permissions</text>
<rect x="320" y="250" width="260" height="115" rx="10" fill="#237b57"/>
<text x="450" y="281" text-anchor="middle" font-size="16" fill="white" font-weight="bold">⑤ Independent acceptance</text>
<text x="450" y="310" text-anchor="middle" font-size="12" fill="white">Attribution / support / coverage</text>
<text x="450" y="339" text-anchor="middle" font-size="12" fill="white">Retain missing, unknown, failed</text>
<line x1="290" y1="142" x2="315" y2="142" stroke="#65758a" stroke-width="2"/><polygon points="315,142 307,138 307,146" fill="#65758a"/>
<line x1="580" y1="142" x2="605" y2="142" stroke="#65758a" stroke-width="2"/><polygon points="605,142 597,138 597,146" fill="#65758a"/>
<line x1="740" y1="200" x2="740" y2="245" stroke="#65758a" stroke-width="2"/><polygon points="740,245 736,237 744,237" fill="#65758a"/>
<line x1="610" y1="307" x2="585" y2="307" stroke="#65758a" stroke-width="2"/><polygon points="585,307 593,303 593,311" fill="#65758a"/>
<rect x="30" y="402" width="840" height="40" rx="8" fill="#fff0e9" stroke="#c46b3e"/>
<text x="450" y="427" text-anchor="middle" font-size="12" fill="#873a24">Citations do not establish completeness; task acceptance is a separate decision.</text>
</svg>
