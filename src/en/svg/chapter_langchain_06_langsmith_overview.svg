<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-label="Observe locally; choose remote tracing explicitly">
<title>Observe locally; choose remote tracing explicitly</title><desc>Traces explain execution; independent expectations assess the task. Neither replaces the other.</desc>
<rect width="800" height="520" rx="16" fill="#f8fafc"/>
<g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<text x="28" y="37" font-size="22" fill="#1e293b" font-weight="600" text-anchor="start">Observe locally; choose remote tracing explicitly</text><text x="28" y="63" font-size="13" fill="#475569" font-weight="400" text-anchor="start">Traces explain execution; independent expectations assess the task. Neither replaces the other.</text><rect x="28" y="93" width="360" height="211" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="46" y="122" font-size="16" fill="#15803d" font-weight="600" text-anchor="start">Local path: exercised here</text><text x="46" y="148" font-size="14" fill="#475569" font-weight="400" text-anchor="start">Runnable → local Callback</text><text x="46" y="171" font-size="14" fill="#475569" font-weight="400" text-anchor="start">Run / parent IDs, events, error types</text><text x="46" y="194" font-size="14" fill="#475569" font-weight="400" text-anchor="start">Allowlisted short metadata fields only</text><text x="46" y="217" font-size="14" fill="#475569" font-weight="400" text-anchor="start">No prompt, output, or error-message text</text><text x="46" y="240" font-size="14" fill="#475569" font-weight="400" text-anchor="start">Optional new local JSON file</text><rect x="412" y="93" width="360" height="211" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="430" y="122" font-size="16" fill="#b45309" font-weight="600" text-anchor="start">Remote path: reader opts in</text><text x="430" y="148" font-size="14" fill="#475569" font-weight="400" text-anchor="start">Choose workspace, project, key, endpoint</text><text x="430" y="171" font-size="14" fill="#475569" font-weight="400" text-anchor="start">Review actual fields and retention</text><text x="430" y="194" font-size="14" fill="#475569" font-weight="400" text-anchor="start">Select which calls may be traced</text><text x="430" y="217" font-size="14" fill="#475569" font-weight="400" text-anchor="start">No service login or upload tested here</text><text x="430" y="240" font-size="14" fill="#475569" font-weight="400" text-anchor="start">enabled=False disables exercise tracing</text><rect x="28" y="329" width="744" height="126" rx="12" fill="#eff6ff" stroke="#93c5fd"/><text x="46" y="359" font-size="16" fill="#2563eb" font-weight="600" text-anchor="start">Independent regression: frozen expectations and negative cases</text><text x="46" y="387" font-size="14" fill="#475569" font-weight="400" text-anchor="start">Check results, retained failures, attempts, and cancellation boundaries.</text><text x="46" y="410" font-size="14" fill="#475569" font-weight="400" text-anchor="start">A cached call can still have a model span; spans are not request counts.</text><text x="28" y="492" font-size="14" fill="#475569" font-weight="400" text-anchor="start">Local metadata may still be sensitive; an allowlist is not a privacy classifier.</text></g></svg>
