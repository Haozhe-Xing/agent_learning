<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L9,4 z" fill="#4f46e5"/>
    </marker>
  </defs>
  <rect width="880" height="440" rx="18" fill="#f8fafc"/>
  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Feedback Quality Comparison: Good vs Bad Feedback</text>
  <text x="440" y="58" text-anchor="middle" font-size="13" fill="#64748b">Good feedback is like a teacher grading homework—specific, causal, actionable, localized</text>

  <!-- Bad Feedback -->
  <rect x="30" y="85" width="400" height="310" rx="14" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="230" y="115" text-anchor="middle" font-size="17" font-weight="bold" fill="#b91c1c">Bad Feedback ❌</text>

  <rect x="55" y="135" width="350" height="40" rx="8" fill="#fecaca" stroke="#ef4444" stroke-width="1"/>
  <text x="230" y="159" text-anchor="middle" font-size="13" fill="#b91c1c">"Format is wrong."</text>
  <text x="230" y="192" text-anchor="middle" font-size="11" fill="#64748b">→ Which field is missing? How to fix?</text>

  <rect x="55" y="215" width="350" height="40" rx="8" fill="#fecaca" stroke="#ef4444" stroke-width="1"/>
  <text x="230" y="239" text-anchor="middle" font-size="13" fill="#b91c1c">"Answer is wrong."</text>
  <text x="230" y="272" text-anchor="middle" font-size="11" fill="#64748b">→ Which step went wrong?</text>

  <rect x="55" y="295" width="350" height="40" rx="8" fill="#fecaca" stroke="#ef4444" stroke-width="1"/>
  <text x="230" y="319" text-anchor="middle" font-size="13" fill="#b91c1c">"Be more accurate."</text>
  <text x="230" y="352" text-anchor="middle" font-size="11" fill="#64748b">→ What constraints or rules to add?</text>

  <!-- Good Feedback -->
  <rect x="450" y="85" width="400" height="310" rx="14" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="650" y="115" text-anchor="middle" font-size="17" font-weight="bold" fill="#15803d">Good Feedback ✅</text>

  <rect x="475" y="135" width="350" height="40" rx="8" fill="#bbf7d0" stroke="#22c55e" stroke-width="1"/>
  <text x="650" y="159" text-anchor="middle" font-size="13" fill="#15803d">"JSON is missing the deadline field."</text>
  <text x="650" y="192" text-anchor="middle" font-size="11" fill="#64748b">→ Specific: Knows which field is missing</text>

  <rect x="475" y="215" width="350" height="40" rx="8" fill="#bbf7d0" stroke="#22c55e" stroke-width="1"/>
  <text x="650" y="239" text-anchor="middle" font-size="13" fill="#15803d">"Model ignored the document containing the answer."</text>
  <text x="650" y="272" text-anchor="middle" font-size="11" fill="#64748b">→ Causal: Knows why it's wrong</text>

  <rect x="475" y="295" width="350" height="40" rx="8" fill="#bbf7d0" stroke="#22c55e" stroke-width="1"/>
  <text x="650" y="319" text-anchor="middle" font-size="13" fill="#15803d">"Must list supporting evidence before answering."</text>
  <text x="650" y="352" text-anchor="middle" font-size="11" fill="#64748b">→ Actionable: Knows which rule to add</text>

  <!-- Four traits label -->
  <rect x="200" y="405" width="480" height="26" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="440" y="423" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">Four Traits of Good Feedback: Specific · Causal · Actionable · Localized</text>
</svg>