<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-label="LCEL: composition and runtime boundaries">
<title>LCEL: composition and runtime boundaries</title><desc>| connects compatible values; verify streaming, retries, and cancellation per component.</desc>
<rect width="800" height="520" rx="16" fill="#f8fafc"/>
<g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<text x="28" y="37" font-size="22" fill="#1e293b" font-weight="600" text-anchor="start">LCEL: composition and runtime boundaries</text><text x="28" y="63" font-size="13" fill="#475569" font-weight="400" text-anchor="start">| connects compatible values; verify streaming, retries, and cancellation per component.</text><rect x="28" y="91" width="156" height="89" rx="12" fill="#eff6ff" stroke="#93c5fd"/><text x="106" y="122" font-size="15" fill="#2563eb" font-weight="600" text-anchor="middle">Request</text><text x="106" y="154" font-size="14" fill="#475569" font-weight="400" text-anchor="middle">dict</text><path d="M184 136H217 M211 131L217 136L211 141" fill="none" stroke="#64748b" stroke-width="2"/><rect x="224" y="91" width="156" height="89" rx="12" fill="#eff6ff" stroke="#93c5fd"/><text x="302" y="122" font-size="15" fill="#2563eb" font-weight="600" text-anchor="middle">Prompt</text><text x="302" y="154" font-size="14" fill="#475569" font-weight="400" text-anchor="middle">PromptValue</text><path d="M380 136H413 M407 131L413 136L407 141" fill="none" stroke="#64748b" stroke-width="2"/><rect x="420" y="91" width="156" height="89" rx="12" fill="#eff6ff" stroke="#93c5fd"/><text x="498" y="122" font-size="15" fill="#2563eb" font-weight="600" text-anchor="middle">Fixed chat model</text><text x="498" y="154" font-size="14" fill="#475569" font-weight="400" text-anchor="middle">AIMessage</text><path d="M576 136H609 M603 131L609 136L603 141" fill="none" stroke="#64748b" stroke-width="2"/><rect x="616" y="91" width="156" height="89" rx="12" fill="#eff6ff" stroke="#93c5fd"/><text x="694" y="122" font-size="15" fill="#2563eb" font-weight="600" text-anchor="middle">Text parser</text><text x="694" y="154" font-size="14" fill="#475569" font-weight="400" text-anchor="middle">str</text><rect x="28" y="202" width="360" height="112" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="46" y="231" font-size="16" fill="#2563eb" font-weight="600" text-anchor="start">Value boundary</text><text x="46" y="257" font-size="14" fill="#475569" font-weight="400" text-anchor="start">with_types describes a schema</text><text x="46" y="280" font-size="14" fill="#475569" font-weight="400" text-anchor="start">Explicit code must validate runtime input</text><rect x="412" y="202" width="360" height="112" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="430" y="231" font-size="16" fill="#2563eb" font-weight="600" text-anchor="start">Stream boundary</text><text x="430" y="257" font-size="14" fill="#475569" font-weight="400" text-anchor="start">A blocking stage can buffer input</text><text x="430" y="280" font-size="14" fill="#475569" font-weight="400" text-anchor="start">stream does not ensure token streaming</text><rect x="28" y="332" width="360" height="112" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="46" y="361" font-size="16" fill="#2563eb" font-weight="600" text-anchor="start">Recovery boundary</text><text x="46" y="387" font-size="14" fill="#475569" font-weight="400" text-anchor="start">Retry selected errors; bound attempts</text><text x="46" y="410" font-size="14" fill="#475569" font-weight="400" text-anchor="start">No stitched fallback after partial output</text><rect x="412" y="332" width="360" height="112" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="430" y="361" font-size="16" fill="#2563eb" font-weight="600" text-anchor="start">Concurrency / cancellation</text><text x="430" y="387" font-size="14" fill="#475569" font-weight="400" text-anchor="start">max_concurrency bounds this batch</text><text x="430" y="410" font-size="14" fill="#475569" font-weight="400" text-anchor="start">Canceling a wait may leave work running</text><text x="28" y="492" font-size="14" fill="#475569" font-weight="400" text-anchor="start">Valid format, execution completion, and task acceptance remain separate states.</text></g></svg>
