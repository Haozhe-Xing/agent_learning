<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="500" height="280" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <rect width="500" height="280" rx="12" fill="#f8fafc"/>
  <text x="250" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">SelfCheckGPT: Detecting Hallucination via Sampling Consistency</text>

  <!-- Real Knowledge -->
  <rect x="16" y="46" width="225" height="150" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="123" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">✅ Real Knowledge</text>
  <text x="123" y="80" text-anchor="middle" font-size="11" fill="#22c55e">"When was Python released?"</text>
  <rect x="28" y="90" width="201" height="22" rx="4" fill="#bbf7d0" stroke="#4ade80" stroke-width="1"/>
  <text x="128" y="106" text-anchor="middle" font-size="10" fill="#166534">Sample 1: "Python was released in 1991"</text>
  <rect x="28" y="116" width="201" height="22" rx="4" fill="#bbf7d0" stroke="#4ade80" stroke-width="1"/>
  <text x="128" y="132" text-anchor="middle" font-size="10" fill="#166534">Sample 2: "Python was first released in 1991"</text>
  <rect x="28" y="142" width="201" height="22" rx="4" fill="#bbf7d0" stroke="#4ade80" stroke-width="1"/>
  <text x="128" y="158" text-anchor="middle" font-size="10" fill="#166534">Sample 3: "Python was released in 1991"</text>
  <rect x="28" y="172" width="201" height="18" rx="4" fill="#4ade80" stroke="#16a34a" stroke-width="1.5"/>
  <text x="128" y="185" text-anchor="middle" font-size="10" font-weight="bold" fill="#14532d">High consistency → Likely real knowledge</text>

  <!-- Hallucination -->
  <rect x="259" y="46" width="225" height="150" rx="10" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="371" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#be123c">❌ Hallucination</text>
  <text x="371" y="80" text-anchor="middle" font-size="11" fill="#f43f5e">"What papers did John Doe publish in 2023?"</text>
  <rect x="271" y="90" width="201" height="22" rx="4" fill="#fecdd3" stroke="#fb7185" stroke-width="1"/>
  <text x="371" y="106" text-anchor="middle" font-size="10" fill="#9f1239">Sample 1: "AI Applications in Healthcare"</text>
  <rect x="271" y="116" width="201" height="22" rx="4" fill="#fecdd3" stroke="#fb7185" stroke-width="1"/>
  <text x="371" y="132" text-anchor="middle" font-size="10" fill="#9f1239">Sample 2: "Recent Advances in Deep Learning"</text>
  <rect x="271" y="142" width="201" height="22" rx="4" fill="#fecdd3" stroke="#fb7185" stroke-width="1"/>
  <text x="371" y="158" text-anchor="middle" font-size="10" fill="#9f1239">Sample 3: "A Survey of Natural Language Processing"</text>
  <rect x="271" y="172" width="201" height="18" rx="4" fill="#fca5a5" stroke="#ef4444" stroke-width="1.5"/>
  <text x="371" y="185" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f1d1d">High inconsistency → Likely hallucination</text>

  <!-- Core Insight -->
  <rect x="16" y="208" width="468" height="60" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="250" y="226" text-anchor="middle" font-size="12" font-weight="bold" fill="#3730a3">Core Insight</text>
  <text x="250" y="244" text-anchor="middle" font-size="11" fill="#4338ca">Facts the model truly "knows" → Consistent across multiple samples</text>
  <text x="250" y="260" text-anchor="middle" font-size="11" fill="#4338ca">Content the model "fabricates" → Different answers each time</text>
</svg>