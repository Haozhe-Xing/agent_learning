<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="500" height="280" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6366f1"/>
    </marker>
  </defs>
  <rect width="500" height="280" rx="12" fill="#f8fafc"/>
  <text x="250" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">FActScore: Atomic Fact Decomposition &amp; Verification</text>

  <!-- Step 1 -->
  <rect x="16" y="46" width="468" height="100" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="250" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">Step 1: Atomic Fact Decomposition</text>
  <rect x="28" y="72" width="440" height="28" rx="6" fill="#bfdbfe" stroke="#60a5fa" stroke-width="1"/>
  <text x="248" y="91" text-anchor="middle" font-size="11" fill="#1e40af">Input: "Einstein was born in Ulm, Germany in 1879 and was a theoretical physicist."</text>
  <text x="28" y="116" font-size="10" fill="#1d4ed8" dx="8">→ "Einstein was born in 1879"  ← Verifiable</text>
  <text x="28" y="130" font-size="10" fill="#1d4ed8" dx="8">→ "Einstein was born in Germany"  ← Verifiable</text>
  <text x="248" y="116" font-size="10" fill="#1d4ed8" dx="8">→ "Einstein was born in Ulm"  ← Verifiable</text>
  <text x="248" y="130" font-size="10" fill="#1d4ed8" dx="8">→ "Einstein was a theoretical physicist"  ← Verifiable</text>

  <line x1="250" y1="146" x2="250" y2="164" stroke="#6366f1" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 2 -->
  <rect x="16" y="166" width="468" height="80" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="250" y="184" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">Step 2: Individual Verification</text>
  <text x="250" y="202" text-anchor="middle" font-size="11" fill="#166534">For each atomic fact, search knowledge sources (e.g., Wikipedia) for verification</text>
  <rect x="80" y="210" width="340" height="28" rx="6" fill="#4ade80" stroke="#16a34a" stroke-width="1.5"/>
  <text x="250" y="229" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">FActScore = Supported atomic facts / Total atomic facts</text>

  <!-- Note -->
  <rect x="16" y="256" width="468" height="18" rx="4" fill="#e0e7ff" stroke="#6366f1" stroke-width="1"/>
  <text x="250" y="269" text-anchor="middle" font-size="10" fill="#3730a3">💡 Takeaway: Implement "atomic fact decomposition + individual verification" for automated fact-checking in Agents</text>
</svg>