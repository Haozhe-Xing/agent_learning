<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
<title id="title">FActScore: Support Precision Differs from Coverage</title>
<desc id="desc">Original explanatory diagram after https://arxiv.org/html/2305.14251v2 §§3–4 and Limitations; coverage is a separate book acceptance check. No paper artwork reproduced.</desc>
<metadata>Original illustration created for this book; no paper artwork or screenshot reproduced. Repository MIT license applies to this illustration.</metadata>
<style>text { font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }</style>
<rect width="960" height="500" rx="14" fill="#f1f5f9"/>
<text x="480" y="43" text-anchor="middle" font-size="23" font-weight="bold" fill="#22384c">FActScore: Support Precision Differs from Coverage</text>
<rect x="30" y="95" width="280" height="255" rx="12" fill="#2d4965"/>
<text x="170" y="130" text-anchor="middle" font-size="18" fill="white" font-weight="bold">Split the response</text>
<text x="170" y="177" text-anchor="middle" font-size="14" fill="white">Decompose into atomic facts</text>
<text x="170" y="216" text-anchor="middle" font-size="14" fill="white">One sentence can mix claims</text>
<text x="170" y="255" text-anchor="middle" font-size="14" fill="white">Retain a checkable claim list</text>
<text x="170" y="294" text-anchor="middle" font-size="14" fill="white">Decomposition may also fail</text>
<rect x="340" y="95" width="280" height="255" rx="12" fill="#287598"/>
<text x="480" y="130" text-anchor="middle" font-size="18" fill="white" font-weight="bold">Check a chosen source</text>
<text x="480" y="177" text-anchor="middle" font-size="14" fill="white">Look for support for each claim</text>
<text x="480" y="216" text-anchor="middle" font-size="14" fill="white">Biography / Wikipedia experiments</text>
<text x="480" y="255" text-anchor="middle" font-size="14" fill="white">Automatic estimators can err</text>
<text x="480" y="294" text-anchor="middle" font-size="14" fill="white">No retrieved support is not disproof</text>
<rect x="650" y="95" width="280" height="255" rx="12" fill="#72608a"/>
<text x="790" y="130" text-anchor="middle" font-size="18" fill="white" font-weight="bold">Factual precision</text>
<text x="790" y="177" text-anchor="middle" font-size="14" fill="white">Fraction of supported atomic facts</text>
<text x="790" y="216" text-anchor="middle" font-size="14" fill="white">Relative to the knowledge source</text>
<text x="790" y="255" text-anchor="middle" font-size="14" fill="white">Not required-answer coverage</text>
<text x="790" y="294" text-anchor="middle" font-size="14" fill="white">One true fact may leave omissions</text>
<path d="M 312 220 L 327 220" fill="none" stroke="#738296" stroke-width="2"/>
<path d="M 327 215 L 335 220 L 327 225" fill="none" stroke="#738296" stroke-width="2"/>
<path d="M 622 220 L 637 220" fill="none" stroke="#738296" stroke-width="2"/>
<path d="M 637 215 L 645 220 L 637 225" fill="none" stroke="#738296" stroke-width="2"/>
<rect x="30" y="385" width="900" height="83" rx="9" fill="#fff3e9" stroke="#be8156"/>
<text x="480" y="414" text-anchor="middle" font-size="14" fill="#754325">The book separately checks task coverage: are deadline and proof both answered?</text>
<text x="480" y="442" text-anchor="middle" font-size="14" fill="#754325">Literal-excerpt checks are not FActScore’s estimator; validate support and completeness separately.</text>
<text x="480" y="490" text-anchor="middle" font-size="11" fill="#58667a">Original book illustration; fixed sources and evidence scope are cited in the text.</text>
</svg>
