<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="700" height="360">
  <defs>
    <style>text { font-family: 'Helvetica Neue', Arial, sans-serif; }</style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2c3e50"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#9333ea"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="700" height="360" rx="14" fill="#f0f4f8"/>
  <text x="350" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">Code Review Flow (Claude Code + Human)</text>

  <rect x="20" y="56" width="120" height="56" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="80" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">👨‍💻 Developer</text>
  <text x="80" y="98" text-anchor="middle" font-size="11" fill="#3b82f6">opens PR</text>
  <line x1="140" y1="84" x2="166" y2="84" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="170" y="56" width="150" height="56" rx="10" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="245" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#7e22ce">🤖 Claude Code</text>
  <text x="245" y="98" text-anchor="middle" font-size="11" fill="#9333ea">auto review (CI)</text>
  <line x1="320" y1="84" x2="346" y2="84" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="350" y="56" width="160" height="56" rx="10" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="430" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#7e22ce">📋 Structured report</text>
  <text x="430" y="98" text-anchor="middle" font-size="10" fill="#9333ea">🔴 must-fix · 🟡 suggest · 🟢 praise</text>
  <line x1="510" y1="84" x2="536" y2="84" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="540" y="56" width="140" height="56" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="610" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">👀 Human reviewer</text>
  <text x="610" y="98" text-anchor="middle" font-size="11" fill="#3b82f6">focuses on 🔴 issues</text>

  <line x1="610" y1="112" x2="610" y2="146" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)"/>
  <polygon points="610,148 660,176 610,204 560,176" fill="#f39c12" stroke="#e67e22" stroke-width="1.5"/>
  <text x="610" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Verify?</text>

  <line x1="660" y1="176" x2="688" y2="176" stroke="#16a34a" stroke-width="2"/>
  <line x1="688" y1="176" x2="688" y2="290" stroke="#16a34a" stroke-width="2"/>
  <line x1="688" y1="290" x2="402" y2="290" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="678" y="240" text-anchor="middle" font-size="11" fill="#16a34a" font-weight="bold">No</text>

  <line x1="560" y1="176" x2="400" y2="176" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <text x="480" y="168" text-anchor="middle" font-size="11" fill="#9333ea" font-weight="bold">Yes</text>
  <rect x="280" y="156" width="118" height="42" rx="8" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="339" y="174" text-anchor="middle" font-size="11" font-weight="bold" fill="#7e22ce">🤖 Claude Code</text>
  <text x="339" y="190" text-anchor="middle" font-size="11" fill="#9333ea">verify fix</text>

  <path d="M 280 177 L 130 177 L 130 84 L 536 84" fill="none" stroke="#9333ea" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrow-purple)"/>
  <text x="150" y="130" text-anchor="middle" font-size="10" fill="#9333ea" font-weight="bold">re-submit after verify</text>

  <rect x="180" y="272" width="220" height="40" rx="20" fill="#16a34a"/>
  <text x="290" y="297" text-anchor="middle" font-size="13" font-weight="bold" fill="white">✅ Human Approve → Merge</text>
</svg>
