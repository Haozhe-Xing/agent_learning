<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
<title id="title">Indirect Injection: Data, Proposals and Execution</title>
<desc id="desc">Concepts: https://arxiv.org/html/2302.12173v2 §§3–5. Host authorization/budget gate is the book engineering synthesis, not a reproduced paper defense.</desc>
<metadata>Original illustration created for this book; no paper artwork or screenshot reproduced. Repository MIT license applies to this illustration.</metadata>
<style>text { font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }</style>
<rect width="960" height="500" rx="14" fill="#f1f5f9"/>
<text x="480" y="43" text-anchor="middle" font-size="23" font-weight="bold" fill="#22384c">Indirect Injection: Data, Proposals and Execution</text>
<rect x="30" y="95" width="280" height="255" rx="12" fill="#2d4965"/>
<text x="170" y="130" text-anchor="middle" font-size="18" fill="white" font-weight="bold">Untrusted entry</text>
<text x="170" y="177" text-anchor="middle" font-size="14" fill="white">Web pages / documents / tool returns</text>
<text x="170" y="216" text-anchor="middle" font-size="14" fill="white">Attacker-controlled data fields</text>
<text x="170" y="255" text-anchor="middle" font-size="14" fill="white">Data may contain instructions</text>
<text x="170" y="294" text-anchor="middle" font-size="14" fill="white">Source labels grant no permission</text>
<rect x="340" y="95" width="280" height="255" rx="12" fill="#287598"/>
<text x="480" y="130" text-anchor="middle" font-size="18" fill="white" font-weight="bold">Agent proposal</text>
<text x="480" y="177" text-anchor="middle" font-size="14" fill="white">Fixed policy and current task</text>
<text x="480" y="216" text-anchor="middle" font-size="14" fill="white">May propose a tool call</text>
<text x="480" y="255" text-anchor="middle" font-size="14" fill="white">Model output is not authorization</text>
<text x="480" y="294" text-anchor="middle" font-size="14" fill="white">Retain proposal and provenance</text>
<rect x="650" y="95" width="280" height="255" rx="12" fill="#72608a"/>
<text x="790" y="130" text-anchor="middle" font-size="18" fill="white" font-weight="bold">Host boundary</text>
<text x="790" y="177" text-anchor="middle" font-size="14" fill="white">Identity / resource / args / budget</text>
<text x="790" y="216" text-anchor="middle" font-size="14" fill="white">Trusted code checks before effects</text>
<text x="790" y="255" text-anchor="middle" font-size="14" fill="white">Retain denial, failure, exhaustion</text>
<text x="790" y="294" text-anchor="middle" font-size="14" fill="white">Inspect actual state changes</text>
<path d="M 312 220 L 327 220" fill="none" stroke="#738296" stroke-width="2"/>
<path d="M 327 215 L 335 220 L 327 225" fill="none" stroke="#738296" stroke-width="2"/>
<path d="M 622 220 L 637 220" fill="none" stroke="#738296" stroke-width="2"/>
<path d="M 637 215 L 645 220 L 637 225" fill="none" stroke="#738296" stroke-width="2"/>
<rect x="30" y="385" width="900" height="83" rx="9" fill="#fff3e9" stroke="#be8156"/>
<text x="480" y="414" text-anchor="middle" font-size="14" fill="#754325">The paper describes the entry threat; the host gate is this book’s engineering requirement.</text>
<text x="480" y="442" text-anchor="middle" font-size="14" fill="#754325">Role separation or prompt warnings alone do not establish injection resistance.</text>
<text x="480" y="490" text-anchor="middle" font-size="11" fill="#58667a">Original book illustration; fixed sources and evidence scope are cited in the text.</text>
</svg>
