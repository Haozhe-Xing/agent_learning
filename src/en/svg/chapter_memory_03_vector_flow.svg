<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-labelledby="title">
<title id="title">Long-Term Memory: Govern Before Retrieval</title>
<style>text { font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }</style>
<rect width="900" height="460" rx="14" fill="#f0f4f8"/>
<text x="450" y="37" text-anchor="middle" font-size="20" font-weight="bold" fill="#233447">Long-Term Memory: Govern Before Retrieval</text>
<rect x="30" y="110" width="260" height="180" rx="10" fill="#2c3e50"/>
<text x="160" y="141" text-anchor="middle" font-size="16" fill="white" font-weight="bold">Explicit record</text>
<text x="160" y="173" text-anchor="middle" font-size="12" fill="white">Host checks purpose, consent, source</text>
<text x="160" y="205" text-anchor="middle" font-size="12" fill="white">Model extraction only proposes</text>
<rect x="320" y="110" width="260" height="180" rx="10" fill="#236fa3"/>
<text x="450" y="141" text-anchor="middle" font-size="16" fill="white" font-weight="bold">Persistence and index</text>
<text x="450" y="173" text-anchor="middle" font-size="12" fill="white">Record ID / encoder version / metric</text>
<text x="450" y="205" text-anchor="middle" font-size="12" fill="white">Manual vectors test mechanics only</text>
<rect x="610" y="110" width="260" height="180" rx="10" fill="#73519a"/>
<text x="740" y="141" text-anchor="middle" font-size="16" fill="white" font-weight="bold">Scoped candidates</text>
<text x="740" y="173" text-anchor="middle" font-size="12" fill="white">Filter owner/source before ranking</text>
<text x="740" y="205" text-anchor="middle" font-size="12" fill="white">Similarity is not truth probability</text>
<line x1="290" y1="200" x2="315" y2="200" stroke="#65758a" stroke-width="2"/><polygon points="315,200 307,196 307,204" fill="#65758a"/>
<line x1="580" y1="200" x2="605" y2="200" stroke="#65758a" stroke-width="2"/><polygon points="605,200 597,196 597,204" fill="#65758a"/>
<rect x="30" y="402" width="840" height="40" rx="8" fill="#fff0e9" stroke="#c46b3e"/>
<text x="450" y="427" text-anchor="middle" font-size="12" fill="#873a24">Deletion also examines derived indexes/caches; the host authenticates identities.</text>
</svg>
