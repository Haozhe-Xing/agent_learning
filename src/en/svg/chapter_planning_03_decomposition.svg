<svg xmlns="http://www.w3.org/2000/svg" width="920" height="460" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">Decomposition: valid dependencies do not prove a valid result</title>
  <desc id="desc">Validate a bounded DAG, then verify the actual artifact; declared and actual coverage differ.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#64748b" />
    </marker>
  </defs>
  <rect width="920" height="460" fill="#f8fafc" />
  <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="460" y="35" font-size="22" fill="#0f172a" font-weight="bold" text-anchor="middle">Decomposition: valid dependencies do not prove a valid result</text>
    <rect x="24" y="64" width="872" height="48" rx="9" fill="#e8eef7" />
    <text x="460" y="89" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">Before execution: unique IDs, known ops/dependencies, no cycles, load ancestor, all goals</text>
    <rect x="24" y="155" width="250" height="130" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" />
    <text x="149.0" y="183" font-size="17" fill="#2563eb" font-weight="bold" text-anchor="middle">read: load observations</text>
    <text x="149.0" y="210" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">Pair each value with its source</text>
    <text x="149.0" y="233" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">Approval / budget / rollback</text>
    <text x="149.0" y="256" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">Failures are not empty success</text>
    <rect x="334" y="155" width="250" height="130" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" />
    <text x="459.0" y="183" font-size="17" fill="#2563eb" font-weight="bold" text-anchor="middle">brief: depends on read</text>
    <text x="459.0" y="210" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">Run only after dependency success</text>
    <text x="459.0" y="233" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">Consume a copy of loaded facts</text>
    <text x="459.0" y="256" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">covers is only a plan declaration</text>
    <rect x="644" y="155" width="250" height="130" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="1.5" />
    <text x="769.0" y="183" font-size="17" fill="#15803d" font-weight="bold" text-anchor="middle">Actual acceptance</text>
    <text x="769.0" y="210" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">All three output fields exist</text>
    <text x="769.0" y="233" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">Check sources and frozen values</text>
    <text x="769.0" y="256" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">Missing / conflicting → reject</text>
    <path d="M 276 220 L 332 220" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
    <path d="M 586 220 L 642 220" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="24" y="325" width="872" height="72" rx="9" fill="#e8eef7" />
    <text x="460" y="350" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">Execution is sequential in topological order; depends_on does not provide parallelism or HTN.</text>
    <text x="460" y="374" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">Validate a replacement before clearing artifacts; a new read invalidates the old brief.</text>
  </g>
</svg>
