<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 260" width="500" height="260" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6366f1"/>
    </marker>
  </defs>
  <rect width="500" height="260" rx="12" fill="#f8fafc"/>
  <text x="250" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">SFT Data vs RL Data</text>

  <!-- SFT -->
  <rect x="20" y="50" width="215" height="160" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="127" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">SFT Data</text>
  <text x="127" y="90" text-anchor="middle" font-size="11" fill="#3b82f6">Imitation learning ("follow the example")</text>

  <rect x="36" y="100" width="183" height="30" rx="6" fill="#bfdbfe" stroke="#60a5fa" stroke-width="1"/>
  <text x="127" y="120" text-anchor="middle" font-size="11" fill="#1e40af">Question + Standard Answer</text>

  <line x1="127" y1="130" x2="127" y2="148" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="36" y="150" width="183" height="44" rx="6" fill="#93c5fd" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="127" y="168" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">Model Learns</text>
  <text x="127" y="185" text-anchor="middle" font-size="11" fill="#1e3a8a">"Answer like a human"</text>

  <!-- RL -->
  <rect x="265" y="50" width="215" height="160" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="372" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">RL Data</text>
  <text x="372" y="90" text-anchor="middle" font-size="11" fill="#22c55e">Exploration learning ("find the optimum yourself")</text>

  <rect x="281" y="100" width="183" height="30" rx="6" fill="#bbf7d0" stroke="#4ade80" stroke-width="1"/>
  <text x="372" y="120" text-anchor="middle" font-size="11" fill="#166534">Question + Reward Function</text>

  <line x1="372" y1="130" x2="372" y2="148" stroke="#22c55e" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="281" y="150" width="183" height="44" rx="6" fill="#4ade80" stroke="#16a34a" stroke-width="1.5"/>
  <text x="372" y="168" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">Model Learns</text>
  <text x="372" y="185" text-anchor="middle" font-size="11" fill="#14532d">"Get the task done in the environment"</text>

  <!-- Note -->
  <rect x="20" y="224" width="460" height="28" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1"/>
  <text x="250" y="243" text-anchor="middle" font-size="11" fill="#3730a3">💡 RL needs no standard answer — let the model explore: reward for winning, penalty for losing</text>
</svg>