<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L9,4 z" fill="#4f46e5"/>
    </marker>
  </defs>
  <rect width="860" height="400" rx="18" fill="#f8fafc"/>
  <text x="430" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">ProTeGi: Textual Gradient Descent</text>
  <text x="430" y="58" text-anchor="middle" font-size="13" fill="#64748b">Use natural language criticism as "gradients" and rewriting as "parameter updates"</text>

  <!-- Run training samples -->
  <rect x="30" y="95" width="145" height="55" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="102" y="119" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">Run Training Samples</text>
  <text x="102" y="137" text-anchor="middle" font-size="10" fill="#2563eb">Execute with Current Prompt</text>

  <!-- Find error cases -->
  <rect x="210" y="95" width="145" height="55" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="282" y="119" text-anchor="middle" font-size="13" font-weight="bold" fill="#b91c1c">Find Error Samples</text>
  <text x="282" y="137" text-anchor="middle" font-size="10" fill="#dc2626">Which ones are wrong?</text>

  <!-- Text criticism -->
  <rect x="390" y="85" width="155" height="75" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="467" y="109" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">LLM Criticism</text>
  <text x="467" y="127" text-anchor="middle" font-size="10" fill="#b45309">"Prompt didn't require</text>
  <text x="467" y="142" text-anchor="middle" font-size="10" fill="#b45309">distinguishing known from unknown"</text>

  <!-- Text gradient label -->
  <rect x="390" y="172" width="155" height="32" rx="8" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
  <text x="467" y="194" text-anchor="middle" font-size="13" font-weight="bold" fill="#854d0e">This is the "Text Gradient"</text>

  <!-- Rewrite in opposite direction -->
  <rect x="585" y="85" width="155" height="75" rx="10" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
  <text x="662" y="109" text-anchor="middle" font-size="13" font-weight="bold" fill="#be185d">LLM Rewrites Prompt</text>
  <text x="662" y="127" text-anchor="middle" font-size="10" fill="#db2777">"Add rule: distinguish</text>
  <text x="662" y="142" text-anchor="middle" font-size="10" fill="#db2777">known from unknown info"</text>

  <!-- Generate candidates -->
  <rect x="585" y="172" width="155" height="32" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="662" y="194" text-anchor="middle" font-size="13" font-weight="bold" fill="#6d28d9">Generate Candidate Prompts</text>

  <!-- Beam Search -->
  <rect x="390" y="230" width="350" height="55" rx="10" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="565" y="254" text-anchor="middle" font-size="13" font-weight="bold" fill="#0e7490">Beam Search + Bandit Strategy</text>
  <text x="565" y="272" text-anchor="middle" font-size="10" fill="#0891b2">Keep the most promising candidates, gradually eliminate</text>

  <!-- Keep the best -->
  <rect x="390" y="310" width="155" height="50" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="467" y="336" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">Keep Best Candidate</text>
  <text x="467" y="352" text-anchor="middle" font-size="10" fill="#16a34a">Continue Iterating</text>

  <!-- Output prompt -->
  <rect x="585" y="310" width="155" height="50" rx="10" fill="#cffafe" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="662" y="336" text-anchor="middle" font-size="13" font-weight="bold" fill="#0e7490">Output Optimized Prompt</text>

  <!-- Arrows -->
  <line x1="175" y1="122" x2="205" y2="122" stroke="#4f46e5" stroke-width="2.2" marker-end="url(#arr)"/>
  <line x1="355" y1="122" x2="385" y2="122" stroke="#4f46e5" stroke-width="2.2" marker-end="url(#arr)"/>
  <line x1="545" y1="122" x2="580" y2="122" stroke="#4f46e5" stroke-width="2.2" marker-end="url(#arr)"/>
  <line x1="467" y1="160" x2="467" y2="169" stroke="#4f46e5" stroke-width="2.2" marker-end="url(#arr)"/>
  <line x1="662" y1="160" x2="662" y2="169" stroke="#4f46e5" stroke-width="2.2" marker-end="url(#arr)"/>
  <line x1="467" y1="204" x2="467" y2="225" stroke="#4f46e5" stroke-width="2.2" marker-end="url(#arr)"/>
  <line x1="662" y1="204" x2="662" y2="225" stroke="#4f46e5" stroke-width="2.2" marker-end="url(#arr)"/>
  <line x1="565" y1="285" x2="565" y2="305" stroke="#4f46e5" stroke-width="2.2" marker-end="url(#arr)"/>
  <line x1="545" y1="335" x2="580" y2="335" stroke="#4f46e5" stroke-width="2.2" marker-end="url(#arr)"/>

  <!-- Iteration loop -->
  <path d="M390 335 L102 335 L102 155" fill="none" stroke="#4f46e5" stroke-width="2.2" stroke-dasharray="6,4" marker-end="url(#arr)"/>
  <text x="240" y="358" text-anchor="middle" font-size="11" fill="#64748b">Continue Iterating</text>

  <!-- Analogy comparison box -->
  <rect x="30" y="230" width="330" height="140" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="195" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">Numerical Gradient vs Text Gradient</text>
  <line x1="50" y1="268" x2="340" y2="268" stroke="#e2e8f0" stroke-width="1"/>
  <text x="195" y="290" text-anchor="middle" font-size="11" fill="#475569">Numerical gradient: vector, points to parameter adjustment direction</text>
  <text x="195" y="310" text-anchor="middle" font-size="11" fill="#475569">Text gradient: words, points out what the Prompt missed</text>
  <text x="195" y="330" text-anchor="middle" font-size="11" fill="#475569">Learning rate → LLM rewriting strength</text>
  <text x="195" y="350" text-anchor="middle" font-size="11" fill="#475569">Parameter update → Prompt rewriting</text>
</svg>