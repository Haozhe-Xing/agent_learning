<svg xmlns="http://www.w3.org/2000/svg" width="980" height="330" viewBox="0 0 980 330">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#B7C5D8" flood-opacity="0.32" />
    </filter>
  </defs>
  <rect width="980" height="330" rx="28" fill="#F8FBFF" />
  <text x="490" y="54" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="28" font-weight="700" fill="#243B64">Tokens Are Pieces of Text</text>
  <rect x="150" y="105" width="680" height="58" rx="18" fill="#FFFFFF" stroke="#D7E4F5" filter="url(#shadow)" />
  <text x="490" y="142" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="600" fill="#243B64">Please help me summarize this article in a few words.</text>
  <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle" font-size="16" font-weight="600">
    <rect x="88" y="210" width="58" height="42" rx="14" fill="#E7F0FF" /><text x="117" y="237" fill="#385FA8">Please</text>
    <rect x="162" y="210" width="58" height="42" rx="14" fill="#E7F0FF" /><text x="191" y="237" fill="#385FA8">help</text>
    <rect x="236" y="210" width="58" height="42" rx="14" fill="#E7F0FF" /><text x="265" y="237" fill="#385FA8">me</text>
    <rect x="310" y="210" width="92" height="42" rx="14" fill="#E7F0FF" /><text x="356" y="237" fill="#385FA8">summarize</text>
    <rect x="418" y="210" width="58" height="42" rx="14" fill="#E7F0FF" /><text x="447" y="237" fill="#385FA8">this</text>
    <rect x="492" y="210" width="58" height="42" rx="14" fill="#E7F0FF" /><text x="521" y="237" fill="#385FA8">article</text>
    <rect x="566" y="210" width="76" height="42" rx="14" fill="#E7F0FF" /><text x="604" y="237" fill="#385FA8">in</text>
    <rect x="658" y="210" width="76" height="42" rx="14" fill="#E7F0FF" /><text x="696" y="237" fill="#385FA8">a</text>
    <rect x="750" y="210" width="76" height="42" rx="14" fill="#E7F0FF" /><text x="788" y="237" fill="#385FA8">few</text>
    <rect x="842" y="210" width="50" height="42" rx="14" fill="#E7F0FF" /><text x="867" y="237" fill="#385FA8">words</text>
  </g>
  <text x="490" y="294" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="600" fill="#5E6D82">Illustrative splits; actual token boundaries depend on the model</text>
</svg>