<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-labelledby="title">
<title id="title">Three Memory Responsibilities</title>
<style>text { font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }</style>
<rect width="900" height="460" rx="14" fill="#f0f4f8"/>
<text x="450" y="37" text-anchor="middle" font-size="20" font-weight="bold" fill="#233447">Three Memory Responsibilities</text>
<rect x="30" y="110" width="260" height="180" rx="10" fill="#2c3e50"/>
<text x="160" y="141" text-anchor="middle" font-size="16" fill="white" font-weight="bold">Short-term history</text>
<text x="160" y="173" text-anchor="middle" font-size="12" fill="white">Messages visible in this request</text>
<text x="160" y="205" text-anchor="middle" font-size="12" fill="white">Complete turns / budgets / pruning</text>
<rect x="320" y="110" width="260" height="180" rx="10" fill="#236fa3"/>
<text x="450" y="141" text-anchor="middle" font-size="16" fill="white" font-weight="bold">Working state</text>
<text x="450" y="173" text-anchor="middle" font-size="12" fill="white">Task results and pending work</text>
<text x="450" y="205" text-anchor="middle" font-size="12" fill="white">Owner + task / source + status</text>
<rect x="610" y="110" width="260" height="180" rx="10" fill="#73519a"/>
<text x="740" y="141" text-anchor="middle" font-size="16" fill="white" font-weight="bold">Long-term records</text>
<text x="740" y="173" text-anchor="middle" font-size="12" fill="white">Approved cross-session material</text>
<text x="740" y="205" text-anchor="middle" font-size="12" fill="white">Consent / updates / deletion</text>
<rect x="30" y="402" width="840" height="40" rx="8" fill="#fff0e9" stroke="#c46b3e"/>
<text x="450" y="427" text-anchor="middle" font-size="12" fill="#873a24">Retention follows policy; persistent does not mean permanent, and recall does not establish truth.</text>
</svg>
