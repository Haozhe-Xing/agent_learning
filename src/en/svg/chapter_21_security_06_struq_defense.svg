<rect x="30" y="385" width="900" height="83" rx="9" fill="#fff3e9" stroke="#be8156"/>
<text x="480" y="414" text-anchor="middle" font-size="14" fill="#754325">This book does not train the model or reproduce its defense scores.</text>
<text x="480" y="442" text-anchor="middle" font-size="14" fill="#754325">Model injection resistance does not replace host tool authorization.</text>
<text x="480" y="490" text-anchor="middle" font-size="11" fill="#58667a">Original book illustration; fixed sources and evidence scope are cited in the text.</text>
