<title id="title">StruQ: Front-End Handling and Training Work Together</title>
<desc id="desc">Original explanatory diagram after https://arxiv.org/html/2402.06363v2 §§4–6; no original paper artwork reproduced.</desc>
<metadata>Original illustration created for this book; no paper artwork or screenshot reproduced. Repository MIT license applies to this illustration.</metadata>
<style>text { font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }</style>
<rect width="960" height="500" rx="14" fill="#f1f5f9"/>
<text x="480" y="43" text-anchor="middle" font-size="23" font-weight="bold" fill="#22384c">StruQ: Front-End Handling and Training Work Together</text>
<rect x="30" y="95" width="280" height="255" rx="12" fill="#2d4965"/>
<text x="170" y="130" text-anchor="middle" font-size="18" fill="white" font-weight="bold">Secure front-end</text>
<text x="170" y="177" text-anchor="middle" font-size="14" fill="white">Separate instructions and data</text>
<text x="170" y="216" text-anchor="middle" font-size="14" fill="white">Use reserved delimiter tokens</text>
<text x="170" y="255" text-anchor="middle" font-size="14" fill="white">Handle spoofed data delimiters</text>
<text x="170" y="294" text-anchor="middle" font-size="14" fill="white">More than adding an XML tag</text>
<rect x="340" y="95" width="280" height="255" rx="12" fill="#287598"/>
<text x="480" y="130" text-anchor="middle" font-size="18" fill="white" font-weight="bold">Trained model</text>
<text x="480" y="177" text-anchor="middle" font-size="14" fill="white">Structured instruction tuning</text>
<text x="480" y="216" text-anchor="middle" font-size="14" fill="white">Learn from data-side attacks</text>
<text x="480" y="255" text-anchor="middle" font-size="14" fill="white">Ignore data-side instructions</text>
<text x="480" y="294" text-anchor="middle" font-size="14" fill="white">Use the same input convention</text>
<rect x="650" y="95" width="280" height="255" rx="12" fill="#72608a"/>
<text x="790" y="130" text-anchor="middle" font-size="18" fill="white" font-weight="bold">Separate evaluations</text>
<text x="790" y="177" text-anchor="middle" font-size="14" fill="white">Utility on legitimate tasks</text>
<text x="790" y="216" text-anchor="middle" font-size="14" fill="white">Attack success on the test set</text>
<text x="790" y="255" text-anchor="middle" font-size="14" fill="white">Adaptive attacks and ablations</text>
<text x="790" y="294" text-anchor="middle" font-size="14" fill="white">Model / setting boundaries remain</text>
<path d="M 312 220 L 327 220" fill="none" stroke="#738296" stroke-width="2"/>
<path d="M 327 215 L 335 220 L 327 225" fill="none" stroke="#738296" stroke-width="2"/>
<path d="M 622 220 L 637 220" fill="none" stroke="#738296" stroke-width="2"/>
