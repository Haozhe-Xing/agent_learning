<svg xmlns="http://www.w3.org/2000/svg" width="760" height="640" viewBox="0 0 760 640" role="img" aria-labelledby="title desc">
<title id="title">OpenClaw case: four responsibilities and two boundaries</title>
<desc id="desc">Skills enter context; policy controls execution; results return to the model before delivery.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#52667d"/></marker></defs>
<rect width="760" height="640" rx="16" fill="#f4f7fb"/>
<g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif">
<text x="380" y="29" font-size="18" fill="#223449" font-weight="bold" text-anchor="middle">OpenClaw case: four responsibilities and two boundaries</text>
<text x="380" y="51" font-size="12" fill="#52667d" font-weight="normal" text-anchor="middle">Book interpretation: not official classes, event types, or processes</text>
<rect x="28" y="76" width="448" height="72" rx="10" fill="#e6edf5" stroke="#d1dbe7"/>
<text x="252" y="103" font-size="15" fill="#223449" font-weight="bold" text-anchor="middle">Channel ingress and delivery</text>
<text x="252" y="126" font-size="11.5" fill="#223449" font-weight="normal" text-anchor="middle">Channel · account · sender · room / thread · message ID</text>
<rect x="28" y="174" width="448" height="72" rx="10" fill="#e1effb" stroke="#d1dbe7"/>
<text x="252" y="201" font-size="15" fill="#223449" font-weight="bold" text-anchor="middle">Gateway and session coordination</text>
<text x="252" y="224" font-size="11.5" fill="#223449" font-weight="normal" text-anchor="middle">Selected agent · session scope · history write ownership</text>
<rect x="28" y="272" width="448" height="86" rx="10" fill="#eee8fa" stroke="#d1dbe7"/>
<text x="252" y="299" font-size="15" fill="#223449" font-weight="bold" text-anchor="middle">Context and model proposals</text>
<text x="252" y="322" font-size="11.5" fill="#223449" font-weight="normal" text-anchor="middle">Preserve roles, provenance, and tool-call / result correlation</text>
<rect x="28" y="394" width="448" height="86" rx="10" fill="#fff0dd" stroke="#d1dbe7"/>
<text x="252" y="421" font-size="15" fill="#223449" font-weight="bold" text-anchor="middle">Host-controlled tool execution</text>
<text x="252" y="444" font-size="11.5" fill="#223449" font-weight="normal" text-anchor="middle">Names / arguments / resource permission / budget; retain failures</text>
<line x1="252" y1="148" x2="252" y2="173" stroke="#52667d" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="252" y1="246" x2="252" y2="271" stroke="#52667d" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="164" y1="358" x2="164" y2="393" stroke="#52667d" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="341" y1="394" x2="341" y2="359" stroke="#52667d" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="171" y="383" font-size="10" fill="#223449" font-weight="normal" text-anchor="start">Tool proposal</text>
<text x="348" y="383" font-size="10" fill="#223449" font-weight="normal" text-anchor="start">Call result</text>
<rect x="510" y="272" width="222" height="86" rx="10" fill="#e4f4e9" stroke="#d1dbe7"/>
<text x="621" y="295" font-size="14" fill="#223449" font-weight="bold" text-anchor="middle">Skills / evidence</text>
<text x="621" y="318" font-size="11.5" fill="#223449" font-weight="normal" text-anchor="middle">Guidance with provenance</text>
<text x="621" y="338" font-size="11.5" fill="#223449" font-weight="normal" text-anchor="middle">Not tool authorization</text>
<rect x="510" y="394" width="222" height="86" rx="10" fill="#f9e8e8" stroke="#d1dbe7"/>
<text x="621" y="417" font-size="14" fill="#223449" font-weight="bold" text-anchor="middle">Host execution policy</text>
<text x="621" y="440" font-size="11.5" fill="#223449" font-weight="normal" text-anchor="middle">Tools and resource limits</text>
<text x="621" y="460" font-size="11.5" fill="#223449" font-weight="normal" text-anchor="middle">Sandbox when configured</text>
<line x1="510" y1="311" x2="477" y2="311" stroke="#52667d" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<line x1="510" y1="437" x2="477" y2="437" stroke="#52667d" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<path d="M476,335 H492 V519" fill="none" stroke="#52667d" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="486" y="502" font-size="10" fill="#223449" font-weight="normal" text-anchor="end">Candidate reply</text>
<rect x="28" y="520" width="704" height="64" rx="10" fill="#e8f2ef" stroke="#b3d2c7"/>
<text x="380" y="545" font-size="14" fill="#223449" font-weight="bold" text-anchor="middle">Reply through the recorded channel / account / room / thread</text>
<text x="380" y="567" font-size="12" fill="#223449" font-weight="normal" text-anchor="middle">Track delivery evidence separately from independent task acceptance</text>
<text x="380" y="609" font-size="11.5" fill="#52667d" font-weight="normal" text-anchor="middle">Pinned reading: v2026.10.5; product installation and live channels untested</text>
<text x="380" y="628" font-size="11" fill="#52667d" font-weight="normal" text-anchor="middle">Skills enter context; policy controls execution; results return to the model before delivery.</text>
</g></svg>
