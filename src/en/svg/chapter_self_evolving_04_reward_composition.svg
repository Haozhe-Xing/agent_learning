<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360">
  <defs>
    <marker id="rc_arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#7f8c8d"/>
    </marker>
  </defs>
  <rect width="760" height="360" fill="#f8f9fa" rx="12"/>
  <text x="380" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#2c3e50">Composition of Trajectory-Level Rewards: Not Just "Right or Wrong"</text>

  <!-- Left Column: Positive Rewards -->
  <text x="170" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e8449">Positive Rewards (Encourage the Model to Do This)</text>
  <g font-family="Arial, sans-serif" font-size="12" fill="#196f3d">
    <rect x="40" y="82" width="260" height="34" rx="7" fill="#27ae60" opacity="0.12" stroke="#27ae60" stroke-width="1.3"/>
    <text x="56" y="104" fill="#196f3d">+ Task Completion Reward</text>
    <rect x="40" y="122" width="260" height="34" rx="7" fill="#27ae60" opacity="0.12" stroke="#27ae60" stroke-width="1.3"/>
    <text x="56" y="144" fill="#196f3d">+ Successful Tool Call Reward</text>
    <rect x="40" y="162" width="260" height="34" rx="7" fill="#27ae60" opacity="0.12" stroke="#27ae60" stroke-width="1.3"/>
    <text x="56" y="184" fill="#196f3d">+ Intermediate Check Reward (Reliable Process)</text>
    <rect x="40" y="202" width="260" height="34" rx="7" fill="#27ae60" opacity="0.12" stroke="#27ae60" stroke-width="1.3"/>
    <text x="56" y="224" fill="#196f3d">+ Error Recovery Reward (Can Get Back Up After Falling)</text>
  </g>

  <!-- Right Column: Penalties -->
  <text x="590" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#a93226">Penalty Items (Suppress the Model From Doing This)</text>
  <g font-family="Arial, sans-serif" font-size="12">
    <rect x="460" y="82" width="260" height="34" rx="7" fill="#e74c3c" opacity="0.12" stroke="#e74c3c" stroke-width="1.3"/>
    <text x="476" y="104" fill="#a93226">− Repeated Call Penalty (Idle Looping)</text>
    <rect x="460" y="122" width="260" height="34" rx="7" fill="#e74c3c" opacity="0.12" stroke="#e74c3c" stroke-width="1.3"/>
    <text x="476" y="144" fill="#a93226">− High Latency / High Cost Penalty</text>
    <rect x="460" y="162" width="260" height="34" rx="7" fill="#e74c3c" opacity="0.12" stroke="#e74c3c" stroke-width="1.3"/>
    <text x="476" y="184" fill="#a93226">− Safety Violation Penalty</text>
  </g>

  <!-- Merge to Total Reward -->
  <line x1="170" y1="236" x2="330" y2="286" stroke="#7f8c8d" stroke-width="1.6" marker-end="url(#rc_arrow)"/>
  <line x1="590" y1="196" x2="430" y2="286" stroke="#7f8c8d" stroke-width="1.6" marker-end="url(#rc_arrow)"/>

  <rect x="270" y="288" width="220" height="46" rx="10" fill="#2c3e50" opacity="0.9"/>
  <text x="380" y="317" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Total Reward = Σ Positive − Σ Penalty</text>

  <text x="380" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">The Model No Longer Pursues Just "Right Answers", But a More Reliable, Cheaper, and Safer Completion Path</text>
</svg>
