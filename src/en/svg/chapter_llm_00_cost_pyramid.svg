  </g>
  <text x="490" y="486" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="600" fill="#5E6D82">Longer input, output, and execution loops require closer cost control</text>
</svg>