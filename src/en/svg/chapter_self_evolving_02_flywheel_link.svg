<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L0,8 L9,4 z" fill="#4f46e5"/></marker>
  </defs>
  <rect width="760" height="360" rx="18" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Self-Evolution and Agentic Data Flywheel Connection</text>
  <text x="380" y="58" text-anchor="middle" font-size="13" fill="#64748b">Two Levels of the Same Closed Loop: Fast Loop Modifies System Behavior, Slow Loop Modifies Model Capability</text>

  <!-- Self-Evolution -->
  <rect x="60" y="90" width="280" height="80" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="200" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">Self-Evolution Agent (Fast Loop)</text>
  <text x="200" y="140" text-anchor="middle" font-size="11" fill="#2563eb">Modify Memory / Prompt / Skill / Process</text>
  <text x="200" y="157" text-anchor="middle" font-size="11" fill="#2563eb">Updated Daily or Even Per Task</text>

  <!-- Data Flywheel -->
  <rect x="420" y="90" width="280" height="80" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8"/>
  <text x="560" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#b91c1c">Agentic Data Flywheel (Slow Loop)</text>
  <text x="560" y="140" text-anchor="middle" font-size="11" fill="#dc2626">Modify Training Data / Reward Model / Policy Model</text>
  <text x="560" y="157" text-anchor="middle" font-size="11" fill="#dc2626">Trained and Released Weekly or Monthly</text>

  <!-- Right: Output Experience -->
  <line x1="340" y1="120" x2="418" y2="120" stroke="#4f46e5" stroke-width="2.2" marker-end="url(#arr)"/>
  <text x="379" y="111" text-anchor="middle" font-size="10" fill="#4f46e5">High-Quality Experiences /</text>
  <text x="379" y="135" text-anchor="middle" font-size="10" fill="#4f46e5">Failure Attributions / Skill Drafts</text>

  <!-- Stronger Model -->
  <rect x="300" y="218" width="160" height="56" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="380" y="242" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">Stronger Agent Model</text>
  <text x="380" y="261" text-anchor="middle" font-size="10" fill="#16a34a">Deployed Back to Execution System</text>

  <!-- Flywheel → Stronger Model -->
  <path d="M560 170 L560 246 L463 246" fill="none" stroke="#ef4444" stroke-width="2.2" marker-end="url(#arr)"/>
  <text x="600" y="210" font-size="10" fill="#dc2626" text-anchor="middle">Filter/Annotate/Train</text>

  <!-- Stronger Model → Self-Evolution (Loop) -->
  <path d="M300 246 L200 246 L200 172" fill="none" stroke="#22c55e" stroke-width="2.2" marker-end="url(#arr)"/>
  <text x="160" y="212" font-size="10" fill="#16a34a" text-anchor="middle">Generates Higher</text>
  <text x="160" y="228" font-size="10" fill="#16a34a" text-anchor="middle">Quality Trajectories</text>

  <!-- Comparison Table -->
  <rect x="60" y="296" width="640" height="48" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="380" y="317" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">Fast Loop: Rule Validation + Sandbox + Rollback | Slow Loop: Offline Evaluation + Benchmark Testing + Canary Release</text>
  <text x="380" y="336" text-anchor="middle" font-size="11" fill="#64748b">Self-Evolution Handles Rapid System-Level Improvements, Data Flywheel Handles Long-Term Model-Level Enhancements, Both Are Complementary</text>
</svg>
