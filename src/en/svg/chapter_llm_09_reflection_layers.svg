<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L9,4 z" fill="#4f46e5"/>
    </marker>
  </defs>
  <rect width="800" height="420" rx="18" fill="#f8fafc"/>
  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Three Levels of Reflection Quality</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="#64748b">Weak reflection only says "wrong"; strong reflection locates cause and provides fix</text>

  <!-- Weak Reflection -->
  <rect x="40" y="85" width="220" height="155" rx="14" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="150" y="113" text-anchor="middle" font-size="15" font-weight="bold" fill="#b91c1c">Weak Reflection ❌</text>

  <rect x="60" y="128" width="180" height="40" rx="8" fill="#fecaca" stroke="#ef4444" stroke-width="1"/>
  <text x="150" y="152" text-anchor="middle" font-size="12" fill="#b91c1c">Symptom: Answer is wrong</text>

  <rect x="60" y="180" width="180" height="40" rx="8" fill="#fecaca" stroke="#ef4444" stroke-width="1" opacity="0.5"/>
  <text x="150" y="204" text-anchor="middle" font-size="12" fill="#94a3b8">Cause: (missing)</text>

  <text x="150" y="245" text-anchor="middle" font-size="11" fill="#b91c1c">"Answer is wrong, should be more accurate"</text>
  <text x="150" y="262" text-anchor="middle" font-size="11" fill="#b91c1c">→ No help for Prompt editing</text>

  <!-- Medium Reflection -->
  <rect x="290" y="85" width="220" height="155" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="400" y="113" text-anchor="middle" font-size="15" font-weight="bold" fill="#92400e">Medium Reflection ⚠️</text>

  <rect x="310" y="128" width="180" height="40" rx="8" fill="#fde68a" stroke="#f59e0b" stroke-width="1"/>
  <text x="400" y="152" text-anchor="middle" font-size="12" fill="#92400e">Symptom: Got entity wrong</text>

  <rect x="310" y="180" width="180" height="40" rx="8" fill="#fde68a" stroke="#f59e0b" stroke-width="1"/>
  <text x="400" y="204" text-anchor="middle" font-size="12" fill="#92400e">Cause: Used the first document only</text>

  <text x="400" y="245" text-anchor="middle" font-size="11" fill="#92400e">"Model prioritized the first document"</text>
  <text x="400" y="262" text-anchor="middle" font-size="11" fill="#92400e">→ Knows what's wrong, not how to fix it</text>

  <!-- Strong Reflection -->
  <rect x="540" y="85" width="220" height="155" rx="14" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="650" y="113" text-anchor="middle" font-size="15" font-weight="bold" fill="#15803d">Strong Reflection ✅</text>

  <rect x="560" y="128" width="180" height="40" rx="8" fill="#bbf7d0" stroke="#22c55e" stroke-width="1"/>
  <text x="650" y="152" text-anchor="middle" font-size="12" fill="#15803d">Symptom: Entity was wrong</text>

  <rect x="560" y="180" width="180" height="40" rx="8" fill="#bbf7d0" stroke="#22c55e" stroke-width="1"/>
  <text x="650" y="204" text-anchor="middle" font-size="12" fill="#15803d">Cause: Didn't verify year match</text>

  <text x="650" y="245" text-anchor="middle" font-size="11" fill="#15803d">"Modify reader prompt:</text>
  <text x="650" y="262" text-anchor="middle" font-size="11" fill="#15803d">Match year first, then extract entity"</text>

  <!-- Fix layer standalone -->
  <rect x="560" y="275" width="180" height="40" rx="8" fill="#86efac" stroke="#22c55e" stroke-width="1.5"/>
  <text x="650" y="299" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">Fix: Gives concrete edits ✅</text>

  <!-- Progression arrows -->
  <line x1="265" y1="160" x2="285" y2="160" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="515" y1="160" x2="535" y2="160" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="650" y1="240" x2="650" y2="270" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Bottom summary -->
  <rect x="80" y="330" width="640" height="70" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="400" y="358" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">GEPA relies on "Fix-level" reflection</text>
  <text x="400" y="380" text-anchor="middle" font-size="12" fill="#64748b">Must not only locate "what went wrong", but also provide executable suggestions for "how the Prompt should be edited"</text>
</svg>