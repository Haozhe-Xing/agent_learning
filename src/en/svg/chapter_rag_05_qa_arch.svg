<svg xmlns="http://www.w3.org/2000/svg" width="800" height="610" viewBox="0 0 800 610" role="img" aria-label="Local QA: execution and task acceptance differ">
<title>Local QA: execution and task acceptance differ</title><desc>Frozen sources + original question → lexical retrieval and excerpts; check support and coverage.</desc>
<rect width="800" height="610" rx="16" fill="#f8fafc"/>
<g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="28" y="37" font-size="22" fill="#1e293b" font-weight="600" text-anchor="start">Local QA: execution and task acceptance differ</text><text x="28" y="64" font-size="13" fill="#475569" font-weight="400" text-anchor="start">Frozen sources + original question → lexical retrieval and excerpts; check support and coverage.</text><rect x="28" y="92" width="232" height="147" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="44" y="121" font-size="16" fill="#2563eb" font-weight="600" text-anchor="start">rank</text><text x="44" y="148" font-size="14" fill="#475569" font-weight="400" text-anchor="start">document / score</text><text x="44" y="171" font-size="14" fill="#475569" font-weight="400" text-anchor="start">matched_terms: match reasons</text><text x="44" y="194" font-size="14" fill="#475569" font-weight="400" text-anchor="start">No hit: no_evidence</text><text x="44" y="217" font-size="14" fill="#475569" font-weight="400" text-anchor="start">Minimum rules are not proof</text><rect x="284" y="92" width="232" height="147" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="300" y="121" font-size="16" fill="#2563eb" font-weight="600" text-anchor="start">ask: produce</text><text x="300" y="148" font-size="14" fill="#475569" font-weight="400" text-anchor="start">Default: attributed excerpts</text><text x="300" y="171" font-size="14" fill="#475569" font-weight="400" text-anchor="start">Inject faulty outputs to test</text><text x="300" y="194" font-size="14" fill="#475569" font-weight="400" text-anchor="start">Error: generation_failed</text><text x="300" y="217" font-size="14" fill="#475569" font-weight="400" text-anchor="start">Documents remain reference data</text><rect x="540" y="92" width="232" height="147" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="556" y="121" font-size="16" fill="#2563eb" font-weight="600" text-anchor="start">QA class checks</text><text x="556" y="148" font-size="14" fill="#475569" font-weight="400" text-anchor="start">Labels + optional verifier</text><text x="556" y="171" font-size="14" fill="#475569" font-weight="400" text-anchor="start">Failure: verification_failed</text><text x="556" y="194" font-size="14" fill="#475569" font-weight="400" text-anchor="start">Pass: answered</text><text x="556" y="217" font-size="14" fill="#475569" font-weight="400" text-anchor="start">Not general answer correctness</text><path d="M260 165H279 M273 160L279 165L273 170" stroke="#64748b" stroke-width="2" fill="none"/><path d="M516 165H535 M529 160L535 165L529 170" stroke="#64748b" stroke-width="2" fill="none"/><rect x="28" y="271" width="360" height="139" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="44" y="300" font-size="16" fill="#15803d" font-weight="600" text-anchor="start">check_excerpts</text><text x="44" y="327" font-size="14" fill="#475569" font-weight="400" text-anchor="start">Check each line against retrieved text</text><text x="44" y="350" font-size="14" fill="#475569" font-weight="400" text-anchor="start">[source] excerpt + lexical intersection</text><text x="44" y="373" font-size="14" fill="#475569" font-weight="400" text-anchor="start">Reject invented or unrelated excerpts</text><text x="44" y="396" font-size="14" fill="#475569" font-weight="400" text-anchor="start">Exact-excerpt contract for this exercise</text><rect x="412" y="271" width="360" height="139" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="428" y="300" font-size="16" fill="#b45309" font-weight="600" text-anchor="start">check_question_coverage</text><text x="428" y="327" font-size="14" fill="#475569" font-weight="400" text-anchor="start">Freeze questions and required points</text><text x="428" y="350" font-size="14" fill="#475569" font-weight="400" text-anchor="start">Missing: failed + missing_points</text><text x="428" y="373" font-size="14" fill="#475569" font-weight="400" text-anchor="start">Unspecified free question: unknown</text><text x="428" y="396" font-size="14" fill="#475569" font-weight="400" text-anchor="start">Literal rules, not a semantic grader</text><path d="M144 240V256H208V270 M656 240V256H592V270" fill="none" stroke="#64748b" stroke-width="2"/><rect x="28" y="439" width="744" height="102" rx="12" fill="#eff6ff" stroke="#cbd5e1"/><text x="44" y="468" font-size="16" fill="#2563eb" font-weight="600" text-anchor="start">Final accepted requires all three</text><text x="44" y="495" font-size="14" fill="#475569" font-weight="400" text-anchor="start">QA execution / configured checks pass + source support passes + coverage passes</text><text x="44" y="518" font-size="14" fill="#475569" font-weight="400" text-anchor="start">Failure or unknown coverage retains reasons and missing information; no completion.</text><text x="28" y="580" font-size="14" fill="#475569" font-weight="400" text-anchor="start">This section is lexical; no adapter yet combines the vector mechanisms in 6.3 / 6.4.</text></g></svg>
