<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" width="540" height="380">
  <defs>
    <style>text { font-family: 'Helvetica Neue', Arial, sans-serif; }</style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#7f8c8d"/>
    </marker>
  </defs>
  <rect width="540" height="380" rx="14" fill="#f0f4f8"/>
  <text x="270" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">Computer Use Loop</text>
  <text x="270" y="46" text-anchor="middle" font-size="10" fill="#7f8c8d">perceive (screenshot) → think (vision model) → act (mouse/keyboard) → loop until done</text>

  <rect x="120" y="60" width="300" height="36" rx="6" fill="#2c3e50"/>
  <text x="270" y="83" text-anchor="middle" font-size="12" font-weight="bold" fill="white">User: open browser and search today's weather</text>
  <line x1="270" y1="96" x2="270" y2="114" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="60" y="120" width="160" height="48" rx="8" fill="#3498db"/>
  <text x="140" y="142" text-anchor="middle" font-size="13" font-weight="bold" fill="white">① Screenshot</text>
  <text x="140" y="158" text-anchor="middle" font-size="10" fill="#d6eaf8">Screenshot</text>
  <line x1="140" y1="168" x2="140" y2="186" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="320" y="120" width="160" height="48" rx="8" fill="#e67e22"/>
  <text x="400" y="142" text-anchor="middle" font-size="13" font-weight="bold" fill="white">② Vision model</text>
  <text x="400" y="158" text-anchor="middle" font-size="10" fill="#fdebd0">screen → element coords / text</text>
  <line x1="400" y1="168" x2="400" y2="186" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M 320 144 L 270 144 L 270 105" fill="none" stroke="#7f8c8d" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="295" y="100" text-anchor="middle" font-size="9" fill="#7f8c8d" font-style="italic">loop</text>

  <rect x="60" y="192" width="160" height="48" rx="8" fill="#9b59b6"/>
  <text x="140" y="214" text-anchor="middle" font-size="13" font-weight="bold" fill="white">③ Plan next step</text>
  <text x="140" y="230" text-anchor="middle" font-size="10" fill="#e8daef">click / type / scroll</text>
  <line x1="220" y1="216" x2="320" y2="216" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="320" y="192" width="160" height="48" rx="8" fill="#27ae60"/>
  <text x="400" y="214" text-anchor="middle" font-size="13" font-weight="bold" fill="white">④ Execute action</text>
  <text x="400" y="230" text-anchor="middle" font-size="10" fill="#d5f5e3">mouse / keyboard / scroll</text>
  <line x1="400" y1="240" x2="400" y2="260" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="120" y="262" width="300" height="44" rx="8" fill="#8e44ad"/>
  <text x="270" y="284" text-anchor="middle" font-size="13" font-weight="bold" fill="white">⑤ Task done?</text>
  <text x="270" y="298" text-anchor="middle" font-size="10" fill="#e8daef">yes → end | no → back to ① screenshot</text>
  <path d="M 120 284 L 90 284 L 90 144 L 60 144" fill="none" stroke="#8e44ad" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>

  <text x="270" y="338" text-anchor="middle" font-size="10" fill="#2c3e50" font-style="italic">essence: Perceive → Think → Act loop; input is screenshot, output is mouse/keyboard events</text>
  <text x="270" y="354" text-anchor="middle" font-size="9" fill="#7f8c8d" font-style="italic">safety: every action is constrained by sandbox + permission (never let it really "delete files")</text>
</svg>
