<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="880" height="230">
  <defs>
    <marker id="sa_arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2c3e50"/>
    </marker>
  </defs>
  <rect width="880" height="230" fill="#f8f9fa" rx="12"/>
  <text x="440" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Self-Evolving Agent's Work Loop</text>

  <!-- 4 Nodes -->
  <g font-family="Arial, sans-serif">
    <!-- 1. User Interaction -->
    <rect x="30" y="80" width="130" height="56" rx="10" fill="#3498db" opacity="0.13" stroke="#2471a3" stroke-width="1.6"/>
    <text x="95" y="103" text-anchor="middle" font-size="13" font-weight="bold" fill="#2471a3">User Interaction</text>
    <text x="95" y="122" text-anchor="middle" font-size="10.5" fill="#555">Receive Task</text>

    <!-- 2. Build Memory -->
    <rect x="215" y="80" width="130" height="56" rx="10" fill="#3498db" opacity="0.13" stroke="#2471a3" stroke-width="1.6"/>
    <text x="280" y="103" text-anchor="middle" font-size="13" font-weight="bold" fill="#2471a3">Build Memory</text>
    <text x="280" y="122" text-anchor="middle" font-size="10.5" fill="#555">Accumulate Experience</text>

    <!-- 3. Extract Skills -->
    <rect x="400" y="56" width="240" height="104" rx="10" fill="#e67e22" opacity="0.13" stroke="#b9690e" stroke-width="1.8"/>
    <text x="520" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#b9690e">Extract Valuable Memories as Skills</text>
    <text x="520" y="96" text-anchor="middle" font-size="10" fill="#555">(Or "Experience", etc.)</text>
    <text x="520" y="118" text-anchor="middle" font-size="11" fill="#b9690e">· Repeated Operations</text>
    <text x="520" y="138" text-anchor="middle" font-size="11" fill="#b9690e">· Corrected Wrong Operations</text>
    <text x="520" y="155" text-anchor="middle" font-size="9" fill="#999" font-style="italic">(Entered Into Skill Library After L2 Layer Verification Gate)</text>

    <!-- 4. Reuse Skill on Next Encounter -->
    <rect x="695" y="80" width="160" height="56" rx="10" fill="#27ae60" opacity="0.13" stroke="#1e8449" stroke-width="1.6"/>
    <text x="775" y="103" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e8449">Reuse Skill on Next Encounter</text>
    <text x="775" y="122" text-anchor="middle" font-size="10.5" fill="#555">Retrieve / Inject / Internalize</text>
  </g>

  <!-- Arrows -->
  <line x1="160" y1="108" x2="208" y2="108" stroke="#2c3e50" stroke-width="1.8" marker-end="url(#sa_arrow)"/>
  <line x1="345" y1="108" x2="393" y2="108" stroke="#2c3e50" stroke-width="1.8" marker-end="url(#sa_arrow)"/>
  <line x1="640" y1="108" x2="688" y2="108" stroke="#2c3e50" stroke-width="1.8" marker-end="url(#sa_arrow)"/>

  <!-- Bottom Note -->
  <text x="440" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">With Each Loop, the Agent "Grows" New Capabilities on the Experience Pool, and the Base Model Can Remain Frozen Throughout</text>
</svg>
