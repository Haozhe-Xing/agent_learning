<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8AA4CC" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#B7C5D8" flood-opacity="0.32" />
    </filter>
  </defs>
  <rect width="980" height="560" rx="28" fill="#F8FBFF" />
  <text x="490" y="52" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="28" font-weight="700" fill="#243B64">Choose the Tool for Your Task</text>
  <text x="490" y="84" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#5E6D82">Agent tools add execution, memory, a workspace, and permissions to a model</text>

  <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">
    <rect x="365" y="112" width="250" height="68" rx="22" fill="#385FA8" filter="url(#shadow)" />
    <text x="490" y="142" font-size="18" font-weight="700" fill="#FFFFFF">What is the task?</text>
    <text x="490" y="166" font-size="13" fill="#E9F1FF">Choose the interface first</text>

    <g filter="url(#shadow)">
      <rect x="70" y="245" width="250" height="88" rx="22" fill="#FFFFFF" stroke="#D7E4F5" />
      <text x="195" y="274" font-size="18" font-weight="700" fill="#243B64">Questions and writing</text>
      <text x="195" y="302" font-size="13" fill="#5E6D82">ChatGPT / Claude / Gemini</text>
      <text x="195" y="322" font-size="13" fill="#5E6D82">Kimi / Doubao / Qwen / DeepSeek</text>

      <rect x="365" y="245" width="250" height="88" rx="22" fill="#FFFFFF" stroke="#D7E4F5" />
      <text x="490" y="274" font-size="18" font-weight="700" fill="#243B64">Code and project changes</text>
      <text x="490" y="302" font-size="13" fill="#5E6D82">Claude Code / Codex</text>
      <text x="490" y="322" font-size="13" fill="#5E6D82">Cursor / Trae / Copilot</text>

      <rect x="660" y="245" width="250" height="88" rx="22" fill="#FFFFFF" stroke="#D7E4F5" />
      <text x="785" y="274" font-size="18" font-weight="700" fill="#243B64">Office and desktop work</text>
      <text x="785" y="302" font-size="13" fill="#5E6D82">WorkBuddy / OpenClaw</text>
      <text x="785" y="322" font-size="13" fill="#5E6D82">Files, sheets, slides, workflows</text>

      <rect x="205" y="395" width="250" height="88" rx="22" fill="#FFFFFF" stroke="#D7E4F5" />
      <text x="330" y="424" font-size="18" font-weight="700" fill="#243B64">Build your own Agent</text>
      <text x="330" y="452" font-size="13" fill="#5E6D82">Harness / OpenClaw Skills</text>
      <text x="330" y="472" font-size="13" fill="#5E6D82">MCP / orchestration / evaluation</text>

      <rect x="525" y="395" width="250" height="88" rx="22" fill="#FFFFFF" stroke="#D7E4F5" />
      <text x="650" y="424" font-size="18" font-weight="700" fill="#243B64">Team collaboration</text>
      <text x="650" y="452" font-size="13" fill="#5E6D82">Trae / traces / team tools</text>
      <text x="650" y="472" font-size="13" fill="#5E6D82">Permissions, logs, attribution</text>
    </g>
  </g>

  <g stroke="#8AA4CC" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M490 180 C490 220 195 210 195 238" />
    <path d="M490 180 V238" />
    <path d="M490 180 C490 220 785 210 785 238" />
    <path d="M490 180 C490 355 330 355 330 388" />
    <path d="M490 180 C490 355 650 355 650 388" />
  </g>

  <text x="490" y="528" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="600" fill="#385FA8">Start with one useful tool; add automation and team controls as the need becomes clear</text>
</svg>