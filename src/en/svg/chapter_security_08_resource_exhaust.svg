<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <rect width="480" height="320" rx="12" fill="#fff7f7"/>
  <text x="240" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Resource Exhaustion Attack Examples</text>

  <!-- Attack 1 -->
  <rect x="24" y="46" width="432" height="72" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="240" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#b91c1c">① Recursive Tool Calls</text>
  <text x="240" y="82" text-anchor="middle" font-size="11" fill="#ef4444">"Search for AI information, then search for details on each result,</text>
  <text x="240" y="98" text-anchor="middle" font-size="11" fill="#ef4444">then search for even more on each detail..."</text>
  <text x="240" y="112" text-anchor="middle" font-size="10" fill="#b91c1c">→ Agent may execute hundreds of tool calls</text>

  <!-- Attack 2 -->
  <rect x="24" y="130" width="432" height="72" rx="8" fill="#ffedd5" stroke="#f97316" stroke-width="1.5"/>
  <text x="240" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#c2410c">② Long Context Injection</text>
  <text x="240" y="166" text-anchor="middle" font-size="11" fill="#f97316">"Please analyze this 1-million-word document..."</text>
  <text x="240" y="182" text-anchor="middle" font-size="11" fill="#f97316">+ Massive filler content</text>
  <text x="240" y="196" text-anchor="middle" font-size="10" fill="#c2410c">→ Consumes massive tokens and computation resources</text>

  <!-- Attack 3 -->
  <rect x="24" y="214" width="432" height="72" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="240" y="232" text-anchor="middle" font-size="12" font-weight="bold" fill="#9d174d">③ Concurrent Request Attack</text>
  <text x="240" y="250" text-anchor="middle" font-size="11" fill="#ec4899">Send a large number of concurrent requests,</text>
  <text x="240" y="266" text-anchor="middle" font-size="11" fill="#ec4899">leveraging the Agent's tool-calling capabilities</text>
  <text x="240" y="282" text-anchor="middle" font-size="10" fill="#9d174d">→ Creates DDoS-like effects on downstream services</text>

  <!-- Icon decorations -->
  <text x="44" y="64" font-size="16">🔄</text>
  <text x="44" y="148" font-size="16">📄</text>
  <text x="44" y="232" font-size="16">⚡</text>
</svg>