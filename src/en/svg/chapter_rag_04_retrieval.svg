<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 660" role="img" aria-labelledby="title desc" font-family="Arial, PingFang SC, sans-serif"><title id="title">Retrieval, Fusion, and Reranking</title><desc id="desc">Score even one candidate; proposals ≠ acceptance.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#475569"/></marker></defs><rect width="560" height="660" rx="12" fill="white"/><text x="280" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">Retrieval, Fusion, and Reranking</text><rect x="30" y="60" width="500" height="58" rx="9" fill="#eff6ff" stroke="#64748b"/><text x="280.0" y="88" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Original question</text><path d="M180,118 L155,153" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M380,118 L405,153" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="155" width="235" height="80" rx="9" fill="#eff6ff" stroke="#64748b"/><text x="147.5" y="183" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Vector candidates</text><text x="147.5" y="208" text-anchor="middle" font-size="17" font-weight="normal" fill="#1e293b">Shared stable IDs</text><rect x="295" y="155" width="235" height="80" rx="9" fill="#fff7ed" stroke="#64748b"/><text x="412.5" y="183" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">BM25 candidates</text><text x="412.5" y="208" text-anchor="middle" font-size="17" font-weight="normal" fill="#1e293b">Shared stable IDs</text><path d="M155,235 L240,278" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M405,235 L320,278" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="280" width="500" height="80" rx="9" fill="#f5f3ff" stroke="#64748b"/><text x="280.0" y="308" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">RRF fusion by ID</text><text x="280.0" y="333" text-anchor="middle" font-size="17" font-weight="normal" fill="#1e293b">Bound candidates per path and in total</text><path d="M280,360 L280,398" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="400" width="500" height="80" rx="9" fill="#ecfdf5" stroke="#64748b"/><text x="280.0" y="428" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Validate score proposals</text><text x="280.0" y="453" text-anchor="middle" font-size="17" font-weight="normal" fill="#1e293b">Reject unknown, duplicate, or missing IDs</text><path d="M280,480 L280,518" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="520" width="500" height="80" rx="9" fill="#eff6ff" stroke="#64748b"/><text x="280.0" y="548" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Candidate sources for answering</text><text x="280.0" y="573" text-anchor="middle" font-size="17" font-weight="normal" fill="#1e293b">Check support and coverage separately</text><text x="280" y="638" text-anchor="middle" font-size="17" fill="#334155">Score even one candidate; proposals ≠ acceptance.</text></svg>
