<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 380" width="460" height="380" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ef4444"/>
    </marker>
  </defs>
  <!-- Background -->
  <rect width="460" height="380" rx="12" fill="#fff7f7"/>
  <!-- Title -->
  <text x="230" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Indirect Prompt Injection Attack Path</text>

  <!-- Step 1 -->
  <rect x="50" y="50" width="360" height="46" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="230" y="69" text-anchor="middle" font-size="12" font-weight="bold" fill="#b91c1c">① Attacker Controls External Content</text>
  <text x="230" y="87" text-anchor="middle" font-size="11" fill="#ef4444">Embed malicious instructions in web pages / emails / PDFs / GitHub Issues</text>

  <line x1="230" y1="96" x2="230" y2="116" stroke="#ef4444" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 2 -->
  <rect x="50" y="118" width="360" height="46" rx="8" fill="#ffedd5" stroke="#f97316" stroke-width="1.5"/>
  <text x="230" y="137" text-anchor="middle" font-size="12" font-weight="bold" fill="#c2410c">② Agent Reads External Content</text>
  <text x="230" y="155" text-anchor="middle" font-size="11" fill="#f97316">Agent proactively fetches contaminated data sources to fulfill user tasks</text>

  <line x1="230" y1="164" x2="230" y2="184" stroke="#ef4444" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 3 -->
  <rect x="50" y="186" width="360" height="46" rx="8" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
  <text x="230" y="205" text-anchor="middle" font-size="12" font-weight="bold" fill="#a16207">③ Model Misjudges Instruction Priority</text>
  <text x="230" y="223" text-anchor="middle" font-size="11" fill="#eab308">Treats malicious instructions in external content as higher-priority system instructions</text>

  <line x1="230" y1="232" x2="230" y2="252" stroke="#ef4444" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 4 -->
  <rect x="50" y="254" width="360" height="46" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="230" y="273" text-anchor="middle" font-size="12" font-weight="bold" fill="#9d174d">④ Agent Executes Malicious Operations</text>
  <text x="230" y="291" text-anchor="middle" font-size="11" fill="#ec4899">Send email / Download file / Access URL / Submit form / Leak context</text>

  <line x1="230" y1="300" x2="230" y2="320" stroke="#ef4444" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 5 -->
  <rect x="50" y="322" width="360" height="44" rx="8" fill="#fca5a5" stroke="#dc2626" stroke-width="2"/>
  <text x="230" y="341" text-anchor="middle" font-size="12" font-weight="bold" fill="#7f1d1d">⑤ Attack Complete</text>
  <text x="230" y="358" text-anchor="middle" font-size="11" fill="#dc2626">Attacker doesn't need to directly interact with the Agent — just poison the data source</text>
</svg>