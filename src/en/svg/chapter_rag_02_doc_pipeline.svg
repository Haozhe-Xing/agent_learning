<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-labelledby="title">
<title id="title">Loading and Chunking: Keep Source Mapping</title>
<style>text { font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }</style>
<rect width="900" height="460" rx="14" fill="#f0f4f8"/>
<text x="450" y="37" text-anchor="middle" font-size="20" font-weight="bold" fill="#233447">Loading and Chunking: Keep Source Mapping</text>
<rect x="55" y="85" width="350" height="115" rx="10" fill="#2c3e50"/>
<text x="230" y="116" text-anchor="middle" font-size="16" fill="white" font-weight="bold">① Bounded loading</text>
<text x="230" y="145" text-anchor="middle" font-size="12" fill="white">Local UTF-8 txt/md / root / byte limit</text>
<text x="230" y="174" text-anchor="middle" font-size="12" fill="white">Reject path, format, encoding errors</text>
<rect x="495" y="85" width="350" height="115" rx="10" fill="#236fa3"/>
<text x="670" y="116" text-anchor="middle" font-size="16" fill="white" font-weight="bold">② Versioned document</text>
<text x="670" y="145" text-anchor="middle" font-size="12" fill="white">source + SHA-256 version + text</text>
<text x="670" y="174" text-anchor="middle" font-size="12" fill="white">Version matches original text bytes</text>
<rect x="495" y="250" width="350" height="115" rx="10" fill="#73519a"/>
<text x="670" y="281" text-anchor="middle" font-size="16" fill="white" font-weight="bold">③ Explicit-unit chunking</text>
<text x="670" y="310" text-anchor="middle" font-size="12" fill="white">Character limit / overlap / tail stop</text>
<text x="670" y="339" text-anchor="middle" font-size="12" fill="white">No semantic-completeness guarantee</text>
<rect x="55" y="250" width="350" height="115" rx="10" fill="#936018"/>
<text x="230" y="281" text-anchor="middle" font-size="16" fill="white" font-weight="bold">④ Source-preserving chunks</text>
<text x="230" y="310" text-anchor="middle" font-size="12" fill="white">id / source / version / start / end / text</text>
<text x="230" y="339" text-anchor="middle" font-size="12" fill="white">Exact original character slices</text>
<line x1="405" y1="142" x2="490" y2="142" stroke="#65758a" stroke-width="2"/><polygon points="490,142 482,138 482,146" fill="#65758a"/>
<line x1="670" y1="200" x2="670" y2="245" stroke="#65758a" stroke-width="2"/><polygon points="670,245 666,237 674,237" fill="#65758a"/>
<line x1="495" y1="307" x2="410" y2="307" stroke="#65758a" stroke-width="2"/><polygon points="410,307 418,303 418,311" fill="#65758a"/>
<rect x="30" y="402" width="840" height="40" rx="8" fill="#fff0e9" stroke="#c46b3e"/>
<text x="450" y="427" text-anchor="middle" font-size="12" fill="#873a24">Source changes need index replacement; the splitter does not update an external database.</text>
</svg>
