<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" width="520" height="200" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <rect width="520" height="200" rx="12" fill="#f8fafc"/>
  <text x="260" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Capabilities Learned During SFT vs RL Phase</text>

  <!-- SFT -->
  <rect x="16" y="46" width="225" height="130" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="128" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">SFT Phase</text>
  <text x="128" y="80" text-anchor="middle" font-size="11" fill="#3b82f6">Imitate demonstration data</text>
  <rect x="28" y="88" width="201" height="28" rx="6" fill="#bfdbfe" stroke="#60a5fa" stroke-width="1"/>
  <text x="128" y="107" text-anchor="middle" font-size="12" fill="#1e40af">See math problem → call calculator</text>
  <text x="128" y="148" text-anchor="middle" font-size="10" fill="#3b82f6">✅ Proper format, stable training</text>
  <text x="128" y="164" text-anchor="middle" font-size="10" fill="#ef4444">❌ Upper bound limited by data quality</text>

  <!-- RL -->
  <rect x="279" y="46" width="225" height="130" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="391" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">RL Phase</text>
  <text x="391" y="80" text-anchor="middle" font-size="11" fill="#22c55e">Environment feedback driven</text>
  <rect x="291" y="88" width="201" height="72" rx="6" fill="#bbf7d0" stroke="#4ade80" stroke-width="1"/>
  <text x="391" y="104" text-anchor="middle" font-size="10" fill="#166534">Analyze problem structure</text>
  <text x="391" y="118" text-anchor="middle" font-size="10" fill="#166534">→ Determine if step-by-step needed</text>
  <text x="391" y="132" text-anchor="middle" font-size="10" fill="#166534">→ Choose optimal tool combination</text>
  <text x="391" y="146" text-anchor="middle" font-size="10" fill="#166534">→ Verify intermediate results → backtrack</text>
  <text x="391" y="164" text-anchor="middle" font-size="10" fill="#15803d">✅ Can surpass data quality, emerge new abilities</text>
</svg>