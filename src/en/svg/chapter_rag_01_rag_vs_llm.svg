<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-labelledby="title">
<title id="title">Two Answer Paths, Both Require Acceptance</title>
<style>text { font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }</style>
<rect width="900" height="460" rx="14" fill="#f0f4f8"/>
<text x="450" y="37" text-anchor="middle" font-size="20" font-weight="bold" fill="#233447">Two Answer Paths, Both Require Acceptance</text>
<rect x="55" y="110" width="350" height="210" rx="10" fill="#2c3e50"/>
<text x="230" y="141" text-anchor="middle" font-size="16" fill="white" font-weight="bold">Direct generation</text>
<text x="230" y="173" text-anchor="middle" font-size="12" fill="white">Answer from model capability and input</text>
<text x="230" y="205" text-anchor="middle" font-size="12" fill="white">Suitability depends on the task</text>
<text x="230" y="237" text-anchor="middle" font-size="12" fill="white">No retrieval does not mean wrong</text>
<rect x="495" y="110" width="350" height="210" rx="10" fill="#236fa3"/>
<text x="670" y="141" text-anchor="middle" font-size="16" fill="white" font-weight="bold">Retrieval augmentation</text>
<text x="670" y="173" text-anchor="middle" font-size="12" fill="white">Select allowed evidence, then answer</text>
<text x="670" y="205" text-anchor="middle" font-size="12" fill="white">Adds extraction/index/recall failures</text>
<text x="670" y="237" text-anchor="middle" font-size="12" fill="white">Sources do not establish full support</text>
<rect x="30" y="402" width="840" height="40" rx="8" fill="#fff0e9" stroke="#c46b3e"/>
<text x="450" y="427" text-anchor="middle" font-size="12" fill="#873a24">Use the same task criteria; two arbitrary outputs do not establish a quality difference.</text>
</svg>
