<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-label="Small tool interfaces with inspectable rejection"><title>Small tool interfaces with inspectable rejection</title><desc>Only local search and bounded arithmetic; no arbitrary paths, shell, or external writes.</desc><rect width="800" height="520" rx="16" fill="#f8fafc"/><g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="28" y="38" font-size="22" fill="#1e293b" font-weight="600">Small tool interfaces with inspectable rejection</text><text x="28" y="65" font-size="13" fill="#475569" font-weight="400">Only local search and bounded arithmetic; no arbitrary paths, shell, or external writes.</text><rect x="28" y="89" width="360" height="151" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="46" y="119" font-size="16" fill="#2563eb" font-weight="600">Input contract</text><text x="46" y="147" font-size="14" fill="#475569" font-weight="400">Bound JSON bytes; reject duplicate keys</text><text x="46" y="171" font-size="14" fill="#475569" font-weight="400">Declared fields and nonblank strings</text><text x="46" y="195" font-size="14" fill="#475569" font-weight="400">query ≤120 / expression ≤256</text><text x="46" y="219" font-size="14" fill="#475569" font-weight="400">Align schema with runtime checks</text><rect x="412" y="89" width="360" height="151" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="430" y="119" font-size="16" fill="#2563eb" font-weight="600">Permission / resource</text><text x="430" y="147" font-size="14" fill="#475569" font-weight="400">Registered does not mean allowed now</text><text x="430" y="171" font-size="14" fill="#475569" font-weight="400">Host configures allowed_tools</text><text x="430" y="195" font-size="14" fill="#475569" font-weight="400">1–8 bounded, uniquely labeled sources</text><text x="430" y="219" font-size="14" fill="#475569" font-weight="400">Services separately bind an identity</text><rect x="28" y="262" width="360" height="180" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="46" y="292" font-size="16" fill="#2563eb" font-weight="600">Execution / observation</text><text x="46" y="320" font-size="14" fill="#475569" font-weight="400">Reuse lexical retrieval and safe_math</text><text x="46" y="344" font-size="14" fill="#475569" font-weight="400">AST allowlist and arithmetic limits</text><text x="46" y="368" font-size="14" fill="#475569" font-weight="400">Empty hits differ from execution errors</text><text x="46" y="392" font-size="14" fill="#475569" font-weight="400">Preserve ok / code / value distinctions</text><text x="46" y="416" font-size="14" fill="#475569" font-weight="400">Keep error types, not sensitive messages</text><rect x="412" y="262" width="360" height="180" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="430" y="292" font-size="16" fill="#2563eb" font-weight="600">Budget / lifecycle</text><text x="430" y="320" font-size="14" fill="#475569" font-weight="400">Separate model rounds and tool proposals</text><text x="430" y="344" font-size="14" fill="#475569" font-weight="400">Admitted denials/skips count too</text><text x="430" y="368" font-size="14" fill="#475569" font-weight="400">Explicit input-byte budget failures</text><text x="430" y="392" font-size="14" fill="#475569" font-weight="400">No retry, cache, or hard timeout here</text><text x="430" y="416" font-size="14" fill="#475569" font-weight="400">A framework name proves no contract</text><text x="28" y="493" font-size="14" fill="#475569" font-weight="400">These mechanisms are not complete authentication, factual verification, or an OS sandbox.</text></g></svg>
