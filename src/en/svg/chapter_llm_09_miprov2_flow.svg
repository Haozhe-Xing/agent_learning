<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" width="760" height="390" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L9,4 z" fill="#4f46e5"/>
    </marker>
  </defs>
  <rect width="760" height="390" rx="18" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">DSPy + MIPROv2: Compiling LLM Programs</text>
  <text x="380" y="58" text-anchor="middle" font-size="13" fill="#64748b">Developers only write signatures; the framework auto-optimizes instruction × few-shot</text>

  <!-- Left: Declarative Program -->
  <rect x="30" y="90" width="230" height="200" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="145" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">Declarative Program (Dev writes)</text>
  <rect x="50" y="128" width="190" height="44" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="145" y="148" text-anchor="middle" font-size="11" fill="#1d4ed8">Signature: question →</text>
  <text x="145" y="164" text-anchor="middle" font-size="11" fill="#1d4ed8">answer, evidence</text>
  <rect x="50" y="180" width="190" height="44" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="145" y="200" text-anchor="middle" font-size="11" fill="#1d4ed8">Modules: Retrieve +</text>
  <text x="145" y="216" text-anchor="middle" font-size="11" fill="#1d4ed8">ChainOfThought</text>
  <text x="145" y="252" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d4ed8">No manual Prompt writing</text>
  <text x="145" y="272" text-anchor="middle" font-size="10" fill="#2563eb">Only declare input/output structure</text>

  <!-- Middle: MIPROv2 Compiler -->
  <rect x="290" y="100" width="180" height="180" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="380" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">MIPROv2 Compiler</text>
  <rect x="306" y="136" width="148" height="34" rx="7" fill="#ffffff" stroke="#fcd34d" stroke-width="1"/>
  <text x="380" y="158" text-anchor="middle" font-size="10" fill="#b45309">Run training set → Collect wins</text>
  <rect x="306" y="176" width="148" height="34" rx="7" fill="#ffffff" stroke="#fcd34d" stroke-width="1"/>
  <text x="380" y="198" text-anchor="middle" font-size="10" fill="#b45309">LLM generates candidate instructions</text>
  <rect x="306" y="216" width="148" height="50" rx="7" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.4"/>
  <text x="380" y="237" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">Bayesian Optimization Search</text>
  <text x="380" y="254" text-anchor="middle" font-size="10" fill="#b45309">instruction × few-shot combos</text>

  <!-- Right: Optimized Program -->
  <rect x="500" y="120" width="230" height="140" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8"/>
  <text x="615" y="144" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">Optimized Program</text>
  <rect x="520" y="158" width="190" height="38" rx="7" fill="#ffffff" stroke="#86efac" stroke-width="1.2"/>
  <text x="615" y="182" text-anchor="middle" font-size="10" fill="#15803d">Each module has auto instruction</text>
  <rect x="520" y="204" width="190" height="38" rx="7" fill="#ffffff" stroke="#86efac" stroke-width="1.2"/>
  <text x="615" y="228" text-anchor="middle" font-size="10" fill="#15803d">Each module has auto few-shot</text>

  <!-- Arrows -->
  <line x1="260" y1="185" x2="287" y2="185" stroke="#4f46e5" stroke-width="2.2" marker-end="url(#arr)"/>
  <line x1="470" y1="185" x2="497" y2="185" stroke="#4f46e5" stroke-width="2.2" marker-end="url(#arr)"/>

  <!-- Bottom comparison -->
  <rect x="30" y="312" width="700" height="58" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="380" y="334" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">vs GEPA: MIPROv2 uses Bayesian optimization, relies more on final scores; GEPA uses reflective evolution, leveraging full trace & text feedback</text>
  <text x="380" y="356" text-anchor="middle" font-size="10" fill="#64748b">They're not contradictory—GEPA could also serve as a "trace-reflection-heavy" optimizer integrated into the DSPy ecosystem</text>
</svg>
