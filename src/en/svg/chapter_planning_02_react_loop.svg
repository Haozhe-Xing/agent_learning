<svg xmlns="http://www.w3.org/2000/svg" width="920" height="460" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">Action–observation loop: bounded execution and acceptance</title>
  <desc id="desc">Registered actions, budgets, actual observations and independent checks determine the final status.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#64748b" />
    </marker>
  </defs>
  <rect width="920" height="460" fill="#f8fafc" />
  <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="460" y="35" font-size="22" fill="#0f172a" font-weight="bold" text-anchor="middle">Action–observation loop: bounded execution and acceptance</text>
    <rect x="24" y="82" width="250" height="130" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" />
    <text x="149.0" y="110" font-size="17" fill="#2563eb" font-weight="bold" text-anchor="middle">Structured decision</text>
    <text x="149.0" y="137" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">action: load / compose</text>
    <text x="149.0" y="160" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">or finish: true</text>
    <text x="149.0" y="183" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">Public action, no private trace</text>
    <rect x="334" y="82" width="250" height="130" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" />
    <text x="459.0" y="110" font-size="17" fill="#2563eb" font-weight="bold" text-anchor="middle">Host execution</text>
    <text x="459.0" y="137" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">Check schema and registered ops</text>
    <text x="459.0" y="160" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">Check tool budget before calls</text>
    <text x="459.0" y="183" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">Record failed and successful calls</text>
    <rect x="644" y="82" width="250" height="130" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" />
    <text x="769.0" y="110" font-size="17" fill="#2563eb" font-weight="bold" text-anchor="middle">Observation / brief checks</text>
    <text x="769.0" y="137" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">Consume actual source records</text>
    <text x="769.0" y="160" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">Source support + frozen goals</text>
    <text x="769.0" y="183" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">Failed checks inform next choice</text>
    <path d="M 276 145 L 332 145" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
    <path d="M 586 145 L 642 145" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
    <path d="M 770 214 L 770 252 L 150 252 L 150 214" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
    <text x="460" y="244" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">Count every decision; failed tool calls also consume the budget</text>
    <rect x="24" y="288" width="250" height="94" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.5" />
    <text x="149.0" y="316" font-size="17" fill="#b45309" font-weight="bold" text-anchor="middle">finish proposes stopping</text>
    <text x="149.0" y="343" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">No passing check → incomplete</text>
    <path d="M 276 334 L 332 334" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
    <text x="305" y="322" font-size="12" fill="#15803d" font-weight="normal" text-anchor="middle">passed</text>
    <rect x="334" y="288" width="250" height="94" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="1.5" />
    <text x="459.0" y="316" font-size="17" fill="#15803d" font-weight="bold" text-anchor="middle">Pass before completion</text>
    <text x="459.0" y="343" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">completed / accepted=true</text>
    <rect x="644" y="288" width="250" height="94" rx="10" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5" />
    <text x="769.0" y="316" font-size="17" fill="#b91c1c" font-weight="bold" text-anchor="middle">Invalid / exhausted</text>
    <text x="769.0" y="343" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">failed / budget_exhausted</text>
    <text x="460" y="428" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">Fixed offline protocol exercise; no paper-result reproduction or model-quality claim.</text>
  </g>
</svg>
