<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-label="Local search → dependent calculation → answer → acceptance"><title>Local search → dependent calculation → answer → acceptance</title><desc>Three scripted turns consume actual results; two tools; no online client is created by default.</desc><rect width="800" height="520" rx="16" fill="#f8fafc"/><g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="28" y="38" font-size="22" fill="#1e293b" font-weight="600">Local search → dependent calculation → answer → acceptance</text><text x="28" y="65" font-size="13" fill="#475569" font-weight="400">Three scripted turns consume actual results; two tools; no online client is created by default.</text><rect x="28" y="89" width="360" height="151" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="46" y="119" font-size="16" fill="#2563eb" font-weight="600">1. Search local documents</text><text x="46" y="147" font-size="14" fill="#475569" font-weight="400">Query: Moon distance</text><text x="46" y="171" font-size="14" fill="#475569" font-weight="400">Return moon-v1 / text / SHA-256</text><text x="46" y="195" font-size="14" fill="#475569" font-weight="400">Frozen teaching value: 384400 km</text><text x="46" y="219" font-size="14" fill="#475569" font-weight="400">No hits cannot manufacture evidence</text><rect x="412" y="89" width="360" height="151" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="430" y="119" font-size="16" fill="#2563eb" font-weight="600">2. Calculate</text><text x="430" y="147" font-size="14" fill="#475569" font-weight="400">Next turn reads the actual search result</text><text x="430" y="171" font-size="14" fill="#475569" font-weight="400">384400 ×1000 /299792458</text><text x="430" y="195" font-size="14" fill="#475569" font-weight="400">Execute the shared AST interpreter</text><text x="430" y="219" font-size="14" fill="#475569" font-weight="400">No claimed parallel gain for dependencies</text><rect x="28" y="262" width="360" height="180" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="46" y="292" font-size="16" fill="#2563eb" font-weight="600">3. Final output</text><text x="46" y="320" font-size="14" fill="#475569" font-weight="400">Format the actual computed value</text><text x="46" y="344" font-size="14" fill="#475569" font-weight="400">1.28222038194 seconds [moon-v1]</text><text x="46" y="368" font-size="14" fill="#475569" font-weight="400">Keep IDs, arguments and observations</text><text x="46" y="392" font-size="14" fill="#475569" font-weight="400">Errors/budget exhaustion stay incomplete</text><text x="46" y="416" font-size="14" fill="#475569" font-weight="400">Nonblank text is not correctness proof</text><rect x="412" y="262" width="360" height="180" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="430" y="292" font-size="16" fill="#2563eb" font-weight="600">4. Independent rubric</text><text x="430" y="320" font-size="14" fill="#475569" font-weight="400">Calls neither provider nor safe_math</text><text x="430" y="344" font-size="14" fill="#475569" font-weight="400">Frozen task, text, digest, expression</text><text x="430" y="368" font-size="14" fill="#475569" font-weight="400">Independent Decimal, units and citation</text><text x="430" y="392" font-size="14" fill="#475569" font-weight="400">Corrupted results or evidence must fail</text><text x="430" y="416" font-size="14" fill="#475569" font-weight="400">Only the declared fixture is accepted</text><text x="28" y="493" font-size="14" fill="#475569" font-weight="400">SDK HTTP mocks check serialization and exchange, not online selection or web-source quality.</text></g></svg>
