<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-label="Components and responsibilities of the host">
<title>Components and responsibilities of the host</title><desc>LangChain 1.4.6 in this chapter; interface responsibilities, not deployment topology.</desc>
<rect width="800" height="520" rx="16" fill="#f8fafc"/>
<g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<text x="28" y="37" font-size="22" fill="#1e293b" font-weight="600" text-anchor="start">Components and responsibilities of the host</text><text x="28" y="63" font-size="13" fill="#475569" font-weight="400" text-anchor="start">LangChain 1.4.6 in this chapter; interface responsibilities, not deployment topology.</text><rect x="28" y="88" width="360" height="133" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="46" y="117" font-size="16" fill="#2563eb" font-weight="600" text-anchor="start">langchain-core</text><text x="46" y="143" font-size="14" fill="#475569" font-weight="400" text-anchor="start">Prompts / messages / parsers</text><text x="46" y="166" font-size="14" fill="#475569" font-weight="400" text-anchor="start">Runnable: sequence, branch, parallel</text><text x="46" y="189" font-size="14" fill="#475569" font-weight="400" text-anchor="start">Shared methods still need compatible values</text><rect x="412" y="88" width="360" height="133" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="430" y="117" font-size="16" fill="#2563eb" font-weight="600" text-anchor="start">langchain</text><text x="430" y="143" font-size="14" fill="#475569" font-weight="400" text-anchor="start">create_agent: model / tool loop</text><text x="430" y="166" font-size="14" fill="#475569" font-weight="400" text-anchor="start">Middleware: configured interception points</text><text x="430" y="189" font-size="14" fill="#475569" font-weight="400" text-anchor="start">Loop termination is not task acceptance</text><rect x="28" y="242" width="360" height="133" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="46" y="271" font-size="16" fill="#2563eb" font-weight="600" text-anchor="start">Provider adapters</text><text x="46" y="297" font-size="14" fill="#475569" font-weight="400" text-anchor="start">langchain-openai 1.7.2 and others</text><text x="46" y="320" font-size="14" fill="#475569" font-weight="400" text-anchor="start">Real requests need credentials and limits</text><text x="46" y="343" font-size="14" fill="#475569" font-weight="400" text-anchor="start">This exercise uses fixed offline messages</text><rect x="412" y="242" width="360" height="133" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="430" y="271" font-size="16" fill="#2563eb" font-weight="600" text-anchor="start">Optional runtime and observation</text><text x="430" y="297" font-size="14" fill="#475569" font-weight="400" text-anchor="start">LangGraph: explicit state and routing</text><text x="430" y="320" font-size="14" fill="#475569" font-weight="400" text-anchor="start">LangSmith: opt-in remote tracing</text><text x="430" y="343" font-size="14" fill="#475569" font-weight="400" text-anchor="start">Choose by task need; no mandatory ladder</text><rect x="28" y="397" width="744" height="94" rx="12" fill="#eff6ff" stroke="#93c5fd"/><text x="46" y="425" font-size="16" fill="#2563eb" font-weight="600" text-anchor="start">Host: source trust, authorization, budgets, failures, acceptance</text><text x="46" y="451" font-size="14" fill="#475569" font-weight="400" text-anchor="start">Configure and test these boundaries; interfaces do not establish business guarantees.</text></g></svg>
