<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <marker id="arr-moe" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#7f8c8d"/>
    </marker>
    <marker id="arr-moe-r" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#e74c3c"/>
    </marker>
    <marker id="arr-moe-g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#27ae60"/>
    </marker>
  </defs>

  <rect width="800" height="420" fill="#f8f9fa" rx="12"/>
  <text x="400" y="28" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">MoE Architecture: Routing Mechanism and Routing Collapse</text>
  <text x="400" y="46" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#777">Sparse Activation: Each Token only activates a few experts, greatly improving parameter efficiency</text>

  <!-- ===== Left: Ideal Routing ===== -->
  <rect x="20" y="62" width="360" height="230" rx="8" fill="#27ae60" opacity="0.04" stroke="#27ae60" stroke-width="2"/>
  <text x="200" y="82" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#27ae60">✅ Ideal Routing (Load Balanced)</text>

  <!-- Token -->
  <rect x="35" y="95" width="55" height="24" rx="4" fill="#9b59b6" opacity="0.8"/>
  <text x="62" y="111" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9" fill="white">Token₁</text>
  <rect x="35" y="125" width="55" height="24" rx="4" fill="#9b59b6" opacity="0.8"/>
  <text x="62" y="141" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9" fill="white">Token₂</text>
  <rect x="35" y="155" width="55" height="24" rx="4" fill="#9b59b6" opacity="0.8"/>
  <text x="62" y="171" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9" fill="white">Token₃</text>

  <!-- Router -->
  <rect x="110" y="120" width="60" height="44" rx="6" fill="#f39c12" opacity="0.8"/>
  <text x="140" y="140" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9" font-weight="bold" fill="white">Router</text>
  <text x="140" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">Linear</text>

  <line x1="90" y1="107" x2="110" y2="130" stroke="#9b59b6" stroke-width="1.2"/>
  <line x1="90" y1="137" x2="110" y2="142" stroke="#9b59b6" stroke-width="1.2"/>
  <line x1="90" y1="167" x2="110" y2="155" stroke="#9b59b6" stroke-width="1.2"/>

  <!-- Experts (balanced) -->
  <rect x="195" y="90" width="45" height="20" rx="3" fill="#27ae60" opacity="0.8"/>
  <text x="217" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">Expert 1</text>
  <rect x="195" y="115" width="45" height="20" rx="3" fill="#27ae60" opacity="0.8"/>
  <text x="217" y="129" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">Expert 2</text>
  <rect x="195" y="140" width="45" height="20" rx="3" fill="#27ae60" opacity="0.8"/>
  <text x="217" y="154" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">Expert 3</text>
  <rect x="195" y="165" width="45" height="20" rx="3" fill="#27ae60" opacity="0.8"/>
  <text x="217" y="179" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">Expert 4</text>
  <rect x="195" y="190" width="45" height="20" rx="3" fill="#27ae60" opacity="0.8"/>
  <text x="217" y="204" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">Expert 5</text>
  <rect x="195" y="215" width="45" height="20" rx="3" fill="#27ae60" opacity="0.8"/>
  <text x="217" y="229" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">Expert 6</text>

  <!-- Balanced routing lines -->
  <line x1="170" y1="130" x2="195" y2="100" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-moe-g)"/>
  <line x1="170" y1="135" x2="195" y2="150" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-moe-g)"/>
  <line x1="170" y1="140" x2="195" y2="175" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-moe-g)"/>
  <line x1="170" y1="145" x2="195" y2="200" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arr-moe-g)"/>
  <line x1="170" y1="148" x2="195" y2="225" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arr-moe-g)"/>

  <!-- Load balance description -->
  <rect x="255" y="90" width="115" height="150" rx="6" fill="white" stroke="#27ae60" stroke-width="1"/>
  <text x="312" y="108" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9" font-weight="bold" fill="#27ae60">All experts balanced</text>
  <rect x="262" y="115" width="95" height="12" rx="2" fill="#27ae60" opacity="0.7"/>
  <text x="309" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="white">Expert 1: ████ 33%</text>
  <rect x="262" y="131" width="95" height="12" rx="2" fill="#27ae60" opacity="0.7"/>
  <text x="309" y="141" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="white">Expert 2: ████ 33%</text>
  <rect x="262" y="147" width="95" height="12" rx="2" fill="#27ae60" opacity="0.7"/>
  <text x="309" y="157" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="white">Expert 3: ████ 34%</text>
  <rect x="262" y="163" width="95" height="12" rx="2" fill="#27ae60" opacity="0.5"/>
  <text x="309" y="173" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="white">Expert 4: ███  balanced</text>
  <rect x="262" y="179" width="95" height="12" rx="2" fill="#27ae60" opacity="0.5"/>
  <text x="309" y="189" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="white">Expert 5: ███  balanced</text>
  <rect x="262" y="195" width="95" height="12" rx="2" fill="#27ae60" opacity="0.5"/>
  <text x="309" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="white">Expert 6: ███  balanced</text>
  <text x="312" y="228" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="8" fill="#27ae60">All experts fully trained</text>

  <rect x="30" y="250" width="340" height="32" rx="5" fill="#27ae60" opacity="0.1"/>
  <text x="200" y="264" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9" fill="#27ae60">✅ Each expert learns different domain knowledge, high parameter utilization</text>
  <text x="200" y="278" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9" fill="#27ae60">Large total parameters but few activated per inference → low computation</text>

  <!-- ===== Right: Routing Collapse ===== -->
  <rect x="400" y="62" width="380" height="230" rx="8" fill="#e74c3c" opacity="0.04" stroke="#e74c3c" stroke-width="2"/>
  <text x="590" y="82" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#e74c3c">❌ Routing Collapse (common during training)</text>

  <!-- Token -->
  <rect x="415" y="95" width="55" height="24" rx="4" fill="#9b59b6" opacity="0.8"/>
  <text x="442" y="111" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9" fill="white">Token₁</text>
  <rect x="415" y="125" width="55" height="24" rx="4" fill="#9b59b6" opacity="0.8"/>
  <text x="442" y="141" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9" fill="white">Token₂</text>
  <rect x="415" y="155" width="55" height="24" rx="4" fill="#9b59b6" opacity="0.8"/>
  <text x="442" y="171" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9" fill="white">Token₃</text>

  <!-- Router -->
  <rect x="490" y="120" width="60" height="44" rx="6" fill="#f39c12" opacity="0.8"/>
  <text x="520" y="140" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9" font-weight="bold" fill="white">Router</text>
  <text x="520" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">Linear</text>

  <line x1="470" y1="107" x2="490" y2="130" stroke="#9b59b6" stroke-width="1.2"/>
  <line x1="470" y1="137" x2="490" y2="142" stroke="#9b59b6" stroke-width="1.2"/>
  <line x1="470" y1="167" x2="490" y2="155" stroke="#9b59b6" stroke-width="1.2"/>

  <!-- Experts (collapsed) -->
  <rect x="575" y="90" width="45" height="20" rx="3" fill="#e74c3c" opacity="0.9"/>
  <text x="597" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">Expert 1 ★</text>
  <rect x="575" y="115" width="45" height="20" rx="3" fill="#e74c3c" opacity="0.7"/>
  <text x="597" y="129" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">Expert 2 ★</text>
  <rect x="575" y="140" width="45" height="20" rx="3" fill="#bdc3c7" opacity="0.4"/>
  <text x="597" y="154" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#999">Expert 3</text>
  <rect x="575" y="165" width="45" height="20" rx="3" fill="#bdc3c7" opacity="0.4"/>
  <text x="597" y="179" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#999">Expert 4</text>
  <rect x="575" y="190" width="45" height="20" rx="3" fill="#bdc3c7" opacity="0.4"/>
  <text x="597" y="204" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#999">Expert 5</text>
  <rect x="575" y="215" width="45" height="20" rx="3" fill="#bdc3c7" opacity="0.4"/>
  <text x="597" y="229" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#999">Expert 6</text>

  <!-- Collapsed routing lines (all point to 1,2) -->
  <line x1="550" y1="130" x2="575" y2="100" stroke="#e74c3c" stroke-width="2" marker-end="url(#arr-moe-r)"/>
  <line x1="550" y1="135" x2="575" y2="105" stroke="#e74c3c" stroke-width="2" marker-end="url(#arr-moe-r)"/>
  <line x1="550" y1="140" x2="575" y2="120" stroke="#e74c3c" stroke-width="2" marker-end="url(#arr-moe-r)"/>
  <line x1="550" y1="145" x2="575" y2="125" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#arr-moe-r)"/>

  <!-- Imbalanced load description -->
  <rect x="635" y="90" width="130" height="150" rx="6" fill="white" stroke="#e74c3c" stroke-width="1"/>
  <text x="700" y="108" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9" font-weight="bold" fill="#e74c3c">Severely imbalanced</text>
  <rect x="642" y="115" width="116" height="12" rx="2" fill="#e74c3c" opacity="0.9"/>
  <text x="700" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="white">Expert 1: ████████ 50%</text>
  <rect x="642" y="131" width="80" height="12" rx="2" fill="#e74c3c" opacity="0.7"/>
  <text x="700" y="141" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="white">Expert 2: █████  40%</text>
  <rect x="642" y="147" width="12" height="12" rx="2" fill="#bdc3c7" opacity="0.5"/>
  <text x="700" y="157" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#999">Expert 3: █  5%</text>
  <rect x="642" y="163" width="8" height="12" rx="2" fill="#bdc3c7" opacity="0.5"/>
  <text x="700" y="173" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#999">Expert 4: ▌  3%</text>
  <rect x="642" y="179" width="4" height="12" rx="2" fill="#bdc3c7" opacity="0.5"/>
  <text x="700" y="189" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#999">Expert 5: ▏  1%</text>
  <rect x="642" y="195" width="2" height="12" rx="2" fill="#bdc3c7" opacity="0.5"/>
  <text x="700" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#999">Expert 6: ▏  1%</text>
  <text x="700" y="228" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="8" fill="#e74c3c">Massive parameter waste!</text>

  <rect x="410" y="250" width="360" height="32" rx="5" fill="#e74c3c" opacity="0.08"/>
  <text x="590" y="264" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9" fill="#e74c3c">❌ Positive feedback loop: Strong experts get selected more → updated more → stronger → selected more</text>
  <text x="590" y="278" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9" fill="#e74c3c">Eventually a few experts monopolize all tokens, the rest are almost never activated</text>

  <!-- ===== Bottom: Solutions ===== -->
  <rect x="20" y="308" width="760" height="100" rx="8" fill="white" stroke="#bdc3c7" stroke-width="1"/>
  <text x="400" y="326" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Load Balancing Solutions Across Models</text>

  <rect x="30" y="334" width="170" height="64" rx="5" fill="#e74c3c" opacity="0.06" stroke="#e74c3c" stroke-width="1"/>
  <text x="115" y="350" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9" font-weight="bold" fill="#e74c3c">Auxiliary Loss (Mixtral/Llama 4)</text>
  <text x="115" y="366" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="8" fill="#555">Add to training loss</text>
  <text x="115" y="380" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="8" fill="#555">Load balance penalty term</text>
  <text x="115" y="394" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="8" fill="#e74c3c">Drawback: may affect main task</text>

  <rect x="215" y="334" width="170" height="64" rx="5" fill="#3498db" opacity="0.06" stroke="#3498db" stroke-width="1"/>
  <text x="300" y="350" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9" font-weight="bold" fill="#3498db">Bias Term (DeepSeek-V3)</text>
  <text x="300" y="366" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="8" fill="#555">Maintain bias for each expert</text>
  <text x="300" y="380" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="8" fill="#555">Dynamically adjust routing probability</text>
  <text x="300" y="394" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="8" fill="#3498db">No auxiliary loss needed</text>

  <rect x="400" y="334" width="170" height="64" rx="5" fill="#27ae60" opacity="0.06" stroke="#27ae60" stroke-width="1"/>
  <text x="485" y="350" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9" font-weight="bold" fill="#27ae60">Shared Experts (DeepSeek/Qwen)</text>
  <text x="485" y="366" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="8" fill="#555">Always activate 1~2 shared experts</text>
  <text x="485" y="380" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="8" fill="#555">Provide stable general knowledge</text>
  <text x="485" y="394" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="8" fill="#27ae60">Reduce routing pressure</text>

  <rect x="585" y="334" width="185" height="64" rx="5" fill="#f39c12" opacity="0.06" stroke="#f39c12" stroke-width="1"/>
  <text x="677" y="350" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9" font-weight="bold" fill="#f39c12">Optimizer Stability (Kimi K2)</text>
  <text x="677" y="366" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="8" fill="#555">MuonClip Optimizer</text>
  <text x="677" y="380" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="8" fill="#555">From training stability angle</text>
  <text x="677" y="394" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="8" fill="#f39c12">Mitigate routing collapse</text>
</svg>
