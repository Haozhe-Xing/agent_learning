<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-label="Descriptions guide proposals; the host enforces rules"><title>Descriptions guide proposals; the host enforces rules</title><desc>Names, descriptions, schemas, and context influence selection; prose guarantees no accuracy.</desc><rect width="800" height="520" rx="16" fill="#f8fafc"/><g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="28" y="38" font-size="22" fill="#1e293b" font-weight="600">Descriptions guide proposals; the host enforces rules</text><text x="28" y="65" font-size="13" fill="#475569" font-weight="400">Names, descriptions, schemas, and context influence selection; prose guarantees no accuracy.</text><rect x="28" y="89" width="360" height="151" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="46" y="119" font-size="16" fill="#2563eb" font-weight="600">Describe actual behavior</text><text x="46" y="147" font-size="14" fill="#475569" font-weight="400">Function, intended uses, exclusions</text><text x="46" y="171" font-size="14" fill="#475569" font-weight="400">Argument formats, sizes, required fields</text><text x="46" y="195" font-size="14" fill="#475569" font-weight="400">Results, units, and empty outcomes</text><text x="46" y="219" font-size="14" fill="#475569" font-weight="400">Local scope and unimplemented features</text><rect x="412" y="89" width="360" height="151" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="430" y="119" font-size="16" fill="#2563eb" font-weight="600">Host enforcement</text><text x="430" y="147" font-size="14" fill="#475569" font-weight="400">Permission claims grant no authority</text><text x="430" y="171" font-size="14" fill="#475569" font-weight="400">Prose cannot isolate a DB or filesystem</text><text x="430" y="195" font-size="14" fill="#475569" font-weight="400">Validate arguments before execution</text><text x="430" y="219" font-size="14" fill="#475569" font-weight="400">Source instructions remain data</text><rect x="28" y="262" width="360" height="180" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="46" y="292" font-size="16" fill="#2563eb" font-weight="600">Independent cases</text><text x="46" y="320" font-size="14" fill="#475569" font-weight="400">Call / skip cases</text><text x="46" y="344" font-size="14" fill="#475569" font-weight="400">Missing evidence / missing arguments</text><text x="46" y="368" font-size="14" fill="#475569" font-weight="400">Malicious data / dependent steps</text><text x="46" y="392" font-size="14" fill="#475569" font-weight="400">Measure choices, arguments, and answers</text><text x="46" y="416" font-size="14" fill="#475569" font-weight="400">Change descriptions alone initially</text><rect x="412" y="262" width="360" height="180" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="430" y="292" font-size="16" fill="#2563eb" font-weight="600">Measured boundary</text><text x="430" y="320" font-size="14" fill="#475569" font-weight="400">Scripted choices do not follow prose</text><text x="430" y="344" font-size="14" fill="#475569" font-weight="400">Local tests check contracts and denials</text><text x="430" y="368" font-size="14" fill="#475569" font-weight="400">No online model A/B experiment</text><text x="430" y="392" font-size="14" fill="#475569" font-weight="400">Freeze versions, sampling, expectations</text><text x="430" y="416" font-size="14" fill="#475569" font-weight="400">No unsourced improvement percentages</text><text x="28" y="493" font-size="14" fill="#475569" font-weight="400">Real-model selection needs independent tasks; passing fixtures is not passing a model evaluation.</text></g></svg>
