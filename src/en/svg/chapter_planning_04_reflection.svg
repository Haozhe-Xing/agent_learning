<svg xmlns="http://www.w3.org/2000/svg" width="920" height="460" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">Reflection: feedback can guide revision, not grant acceptance</title>
  <desc id="desc">Independent checks control revision and completion; reflection is advisory and retries are bounded.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#64748b" />
    </marker>
  </defs>
  <rect width="920" height="460" fill="#f8fafc" />
  <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="460" y="35" font-size="22" fill="#0f172a" font-weight="bold" text-anchor="middle">Reflection: feedback can guide revision, not grant acceptance</text>
    <rect x="24" y="80" width="250" height="108" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" />
    <text x="149.0" y="108" font-size="17" fill="#2563eb" font-weight="bold" text-anchor="middle">Compose candidate brief</text>
    <text x="149.0" y="135" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">Keep original facts and sources</text>
    <text x="149.0" y="158" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">Candidates may omit or err</text>
    <rect x="334" y="80" width="250" height="108" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="1.5" />
    <text x="459.0" y="108" font-size="17" fill="#15803d" font-weight="bold" text-anchor="middle">Independent checks</text>
    <text x="459.0" y="135" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">Source support + frozen goals</text>
    <text x="459.0" y="158" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">Ignore self-rated passed / 10</text>
    <rect x="644" y="80" width="250" height="108" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="1.5" />
    <text x="769.0" y="108" font-size="17" fill="#15803d" font-weight="bold" text-anchor="middle">Pass: complete</text>
    <text x="769.0" y="135" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">accepted=true</text>
    <text x="769.0" y="158" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">status=completed</text>
    <path d="M 276 134 L 332 134" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
    <path d="M 586 134 L 642 134" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
    <text x="615" y="119" font-size="12" fill="#15803d" font-weight="normal" text-anchor="middle">passed</text>
    <path d="M 459 190 L 459 232" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
    <text x="510" y="217" font-size="14" fill="#b45309" font-weight="normal" text-anchor="middle">failed</text>
    <rect x="334" y="234" width="250" height="108" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.5" />
    <text x="459.0" y="262" font-size="17" fill="#b45309" font-weight="bold" text-anchor="middle">Feedback proposal</text>
    <text x="459.0" y="289" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">Use gaps to propose a revision</text>
    <text x="459.0" y="312" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">Critique is not new evidence</text>
    <rect x="24" y="234" width="250" height="108" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" />
    <text x="149.0" y="262" font-size="17" fill="#2563eb" font-weight="bold" text-anchor="middle">Bounded plan replacement</text>
    <text x="149.0" y="289" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">Validate, then discard old queue</text>
    <text x="149.0" y="312" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">Reset, reload and compose again</text>
    <path d="M 332 288 L 276 288" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
    <path d="M 586 288 L 642 288" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
    <path d="M 148 232 L 148 190" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="644" y="234" width="250" height="108" rx="10" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5" />
    <text x="769.0" y="262" font-size="17" fill="#b91c1c" font-weight="bold" text-anchor="middle">No revision / no budget</text>
    <text x="769.0" y="289" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">Keep report, accepted=false</text>
    <text x="769.0" y="312" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">Denial does not trigger alternatives</text>
    <rect x="24" y="370" width="872" height="48" rx="9" fill="#e8eef7" />
    <text x="460" y="395" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">Failed calls and reloads consume steps; replans have a separate cap; improvement is not assured.</text>
  </g>
</svg>
