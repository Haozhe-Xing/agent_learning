<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#4A90D9"/>
    </marker>
  </defs>

  <rect width="760" height="460" fill="#F8FAFC" rx="12"/>

  <!-- Title -->
  <text x="380" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#1A2340">Three Generations of Position Encoding Evolution</text>
  <text x="380" y="54" text-anchor="middle" font-size="12" fill="#7F8C8D">Most modern LLMs use 3rd-gen RoPE, supporting ultra-long context extrapolation</text>

  <!-- Vertical timeline -->
  <line x1="120" y1="80" x2="120" y2="410" stroke="#BDC3C7" stroke-width="2" marker-end="url(#arr)"/>
  <text x="120" y="430" text-anchor="middle" font-size="11" fill="#95A5A6">Time →</text>

  <!-- === 1st Generation === -->
  <circle cx="120" cy="115" r="16" fill="#E74C3C"/>
  <text x="120" y="120" text-anchor="middle" font-size="11" fill="white" font-weight="bold">1</text>

  <rect x="150" y="83" width="570" height="90" rx="8" fill="#FDEDEC" stroke="#E74C3C" stroke-width="1.5"/>
  <rect x="150" y="83" width="570" height="34" rx="8" fill="#E74C3C"/>
  <rect x="150" y="105" width="570" height="12" fill="#E74C3C"/>
  <text x="180" y="105" font-size="13" font-weight="bold" fill="white">1st Gen: Sinusoidal Absolute Position Encoding</text>
  <text x="500" y="105" font-size="11" fill="#FADBD8">Used by original Transformer (2017)</text>
  <text x="165" y="133" font-size="12" fill="#922B21">✦ Generate fixed sine wave vectors for each position m, non-learnable</text>
  <text x="165" y="151" font-size="12" fill="#C0392B">⚠ Limitation: Cannot learn relative position relationships, poor long-sequence extrapolation</text>

  <!-- === 2nd Generation === -->
  <circle cx="120" cy="225" r="16" fill="#E67E22"/>
  <text x="120" y="230" text-anchor="middle" font-size="11" fill="white" font-weight="bold">2</text>

  <rect x="150" y="193" width="570" height="90" rx="8" fill="#FEF9E7" stroke="#E67E22" stroke-width="1.5"/>
  <rect x="150" y="193" width="570" height="34" rx="8" fill="#E67E22"/>
  <rect x="150" y="215" width="570" height="12" fill="#E67E22"/>
  <text x="180" y="215" font-size="13" font-weight="bold" fill="white">2nd Gen: Learned Absolute Position Encoding</text>
  <text x="560" y="215" font-size="11" fill="#FAD7A0">Used by BERT, GPT-2</text>
  <text x="165" y="243" font-size="12" fill="#7D6608">✦ Learn position IDs as embeddings directly, more flexible</text>
  <text x="165" y="261" font-size="12" fill="#D35400">⚠ Limitation: Max length constrained by training length, cannot extrapolate to longer sequences</text>

  <!-- === 3rd Generation === -->
  <circle cx="120" cy="340" r="16" fill="#27AE60"/>
  <text x="120" y="345" text-anchor="middle" font-size="11" fill="white" font-weight="bold">3</text>

  <rect x="150" y="305" width="570" height="105" rx="8" fill="#E9F7EF" stroke="#27AE60" stroke-width="2"/>
  <rect x="150" y="305" width="570" height="34" rx="8" fill="#27AE60"/>
  <rect x="150" y="327" width="570" height="12" fill="#27AE60"/>
  <text x="180" y="327" font-size="13" font-weight="bold" fill="white">3rd Gen: Relative Position Encoding (RoPE / ALiBi)</text>
  <text x="530" y="327" font-size="11" fill="#D4EFDF">LLaMA / Qwen / DeepSeek</text>
  <text x="165" y="357" font-size="12" fill="#1E8449">✦ Encodes relative distance between tokens, not absolute position</text>
  <text x="165" y="375" font-size="12" fill="#1E8449">✦ RoPE (2021): Rotation matrix implementation, strong extrapolation, suitable for ultra-long context (1M+ tokens)</text>
  <text x="165" y="393" font-size="12" fill="#27AE60" font-weight="bold">✦ Advantage: Generalizes to sequences beyond training length, key foundation for LLM long-context capability</text>

  <!-- Right side: current mainstream badge -->
  <rect x="640" y="309" width="78" height="26" rx="5" fill="#27AE60"/>
  <text x="679" y="326" text-anchor="middle" font-size="12" fill="white" font-weight="bold">Mainstream</text>
</svg>
