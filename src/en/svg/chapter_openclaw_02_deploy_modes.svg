<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="680" height="430">
  <defs>
    <style>text { font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif; }</style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#7f8c8d"/>
    </marker>
  </defs>
  <rect width="680" height="430" rx="14" fill="#f0f4f8"/>
  <text x="340" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2c3e50">OpenClaw: Four Deployment Modes Compared</text>
  <text x="340" y="50" text-anchor="middle" font-size="11" fill="#7f8c8d">X = isolation (increases left→right)　Y = setup cost (increases top→bottom)</text>

  <!-- A npx -->
  <rect x="40" y="70" width="285" height="150" rx="10" fill="#e8f6e8" stroke="#27ae60"/>
  <text x="55" y="95" font-size="14" font-weight="bold" fill="#1e8449">A · npx one-liner</text>
  <text x="55" y="118" font-size="12" fill="#2c3e50">npx @openclaw/cli onboard</text>
  <text x="55" y="140" font-size="11" fill="#5d6d7e">Fastest to start (try on the spot)</text>
  <text x="55" y="160" font-size="11" fill="#5d6d7e">No isolation / pulls packages each run</text>
  <text x="55" y="180" font-size="11" fill="#c0392b">⚠️ Not for 24/7 use</text>
  <text x="55" y="205" font-size="11" fill="#1e8449">→ For: trial, demo</text>

  <!-- B install script -->
  <rect x="355" y="70" width="285" height="150" rx="10" fill="#eaf2f8" stroke="#2980b9"/>
  <text x="370" y="95" font-size="14" font-weight="bold" fill="#1f618d">B · Official install script</text>
  <text x="370" y="118" font-size="12" fill="#2c3e50">curl -fsSL openclaw.ai/install.sh | bash</text>
  <text x="370" y="140" font-size="11" fill="#5d6d7e">Local install / three channels</text>
  <text x="370" y="160" font-size="11" fill="#5d6d7e">stable · beta · dev switchable</text>
  <text x="370" y="180" font-size="11" fill="#5d6d7e">No isolation / needs a daemon</text>
  <text x="370" y="205" font-size="11" fill="#1f618d">→ For: daily 24/7 personal use</text>

  <!-- C source -->
  <rect x="40" y="240" width="285" height="150" rx="10" fill="#fef9e7" stroke="#f39c12"/>
  <text x="55" y="265" font-size="14" font-weight="bold" fill="#9a7d0a">C · Source build</text>
  <text x="55" y="288" font-size="12" fill="#2c3e50">git clone + pnpm install</text>
  <text x="55" y="310" font-size="11" fill="#5d6d7e">pnpm workspace, clear structure</text>
  <text x="55" y="330" font-size="11" fill="#5d6d7e">Read source / modify features</text>
  <text x="55" y="350" font-size="11" fill="#5d6d7e">No isolation / manual management</text>
  <text x="55" y="375" font-size="11" fill="#9a7d0a">→ For: secondary dev, contributors</text>

  <!-- D Docker -->
  <rect x="355" y="240" width="285" height="150" rx="10" fill="#fdedec" stroke="#c0392b"/>
  <text x="370" y="265" font-size="14" font-weight="bold" fill="#922b21">D · Docker sandbox</text>
  <text x="370" y="288" font-size="12" fill="#2c3e50">docker run -v ... gateway</text>
  <text x="370" y="310" font-size="11" fill="#5d6d7e">Container isolation / volume persistence</text>
  <text x="370" y="330" font-size="11" fill="#5d6d7e">WhatsApp session must persist</text>
  <text x="370" y="350" font-size="11" fill="#5d6d7e">✅ Strongest isolation / slightly higher cost</text>
  <text x="370" y="375" font-size="11" fill="#922b21">→ For: production, teams, isolation</text>

  <rect x="40" y="400" width="600" height="24" rx="6" fill="#2c3e50"/>
  <text x="340" y="416" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Setup cost A &lt; B &lt; C &lt; D　　Isolation A = B = C &lt; D</text>
</svg>
