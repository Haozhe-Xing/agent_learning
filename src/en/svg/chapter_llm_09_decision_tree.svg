<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 680" width="920" height="680" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L9,4 z" fill="#4f46e5"/>
    </marker>
    <marker id="arr-g" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L9,4 z" fill="#22c55e"/>
    </marker>
    <marker id="arr-r" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L9,4 z" fill="#ef4444"/>
    </marker>
    <marker id="arr-o" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L9,4 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect width="920" height="680" rx="18" fill="#f8fafc"/>
  <text x="460" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">Should You Use Automatic Prompt Optimization?</text>
  <text x="460" y="61" text-anchor="middle" font-size="13" fill="#64748b">First check complexity, evaluation framework, and failure samples, then choose an optimization method</text>

  <!-- Start point -->
  <rect x="310" y="84" width="300" height="56" rx="15" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="460" y="107" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">Start by Assessing Your Agent's State</text>
  <text x="460" y="126" text-anchor="middle" font-size="11" fill="#2563eb">Don't ask which paper first—first check if your system is worth auto-optimizing</text>

  <!-- Q1 -->
  <line x1="460" y1="140" x2="460" y2="166" stroke="#4f46e5" stroke-width="2.3" marker-end="url(#arr)"/>
  <polygon points="460,166 590,226 460,286 330,226" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="460" y="214" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">Are there many, long prompts,</text>
  <text x="460" y="234" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">or do they interact?</text>

  <!-- Q1 No: Manual first -->
  <polyline points="330,226 282,226" fill="none" stroke="#f59e0b" stroke-width="2.3" marker-end="url(#arr-o)"/>
  <text x="302" y="216" text-anchor="middle" font-size="11" font-weight="bold" fill="#d97706">No</text>
  <rect x="66" y="197" width="210" height="58" rx="13" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="171" y="220" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">Manual Tuning First</text>
  <text x="171" y="238" text-anchor="middle" font-size="10.5" fill="#d97706">Single prompt, short rules—manual is faster</text>

  <!-- Q2 -->
  <line x1="460" y1="286" x2="460" y2="316" stroke="#4f46e5" stroke-width="2.3" marker-end="url(#arr)"/>
  <text x="478" y="306" font-size="11" font-weight="bold" fill="#4f46e5">Yes</text>
  <polygon points="460,316 590,376 460,436 330,376" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="460" y="365" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">Do you have clear evaluation</text>
  <text x="460" y="385" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">metrics and regression tests?</text>

  <!-- Q2 No: Build evaluation first -->
  <polyline points="330,376 282,376" fill="none" stroke="#ef4444" stroke-width="2.4" marker-end="url(#arr-r)"/>
  <text x="302" y="366" text-anchor="middle" font-size="11" font-weight="bold" fill="#ef4444">No</text>
  <rect x="66" y="347" width="210" height="58" rx="13" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="171" y="370" text-anchor="middle" font-size="13" font-weight="bold" fill="#b91c1c">Build Evaluation First</text>
  <text x="171" y="388" text-anchor="middle" font-size="10.5" fill="#dc2626">Without evaluation, can't judge if optimization works</text>

  <!-- Q3 -->
  <line x1="460" y1="436" x2="460" y2="466" stroke="#4f46e5" stroke-width="2.3" marker-end="url(#arr)"/>
  <text x="478" y="456" font-size="11" font-weight="bold" fill="#4f46e5">Yes</text>
  <polygon points="460,466 590,526 460,586 330,526" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="460" y="515" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">Do you have representative</text>
  <text x="460" y="535" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">samples and failure cases?</text>

  <!-- Q3 No: Collect samples -->
  <polyline points="330,526 282,526" fill="none" stroke="#ef4444" stroke-width="2.4" marker-end="url(#arr-r)"/>
  <text x="302" y="516" text-anchor="middle" font-size="11" font-weight="bold" fill="#ef4444">No</text>
  <rect x="66" y="497" width="210" height="58" rx="13" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="171" y="520" text-anchor="middle" font-size="13" font-weight="bold" fill="#b91c1c">Collect Samples First</text>
  <text x="171" y="538" text-anchor="middle" font-size="10.5" fill="#dc2626">Prioritize high-frequency failures and edge cases</text>

  <!-- Q3 Yes: Can introduce auto optimization -->
  <polyline points="590,526 638,526" fill="none" stroke="#22c55e" stroke-width="2.5" marker-end="url(#arr-g)"/>
  <text x="618" y="516" text-anchor="middle" font-size="11" font-weight="bold" fill="#22c55e">Yes</text>
  <rect x="644" y="489" width="216" height="74" rx="14" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="752" y="514" text-anchor="middle" font-size="14" font-weight="bold" fill="#15803d">Auto-Tuning is Possible ✅</text>
  <text x="752" y="533" text-anchor="middle" font-size="10.5" fill="#16a34a">Start with small-batch evaluation, keep human review</text>
  <text x="752" y="549" text-anchor="middle" font-size="10.5" fill="#16a34a">Multi-module systems: prioritize full trace logging</text>

  <!-- Right side: Method selection guide -->
  <rect x="642" y="176" width="218" height="250" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="751" y="203" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">Method Quick Reference</text>

  <rect x="666" y="224" width="170" height="38" rx="9" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="751" y="248" text-anchor="middle" font-size="10.5" fill="#2563eb">Single Module + Rule Eval: ProTeGi</text>

  <rect x="666" y="274" width="170" height="38" rx="9" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="751" y="298" text-anchor="middle" font-size="10.5" fill="#7c3aed">Multi-Module Program: DSPy / MIPROv2</text>

  <rect x="666" y="324" width="170" height="38" rx="9" fill="#fdf2f8" stroke="#fbcfe8"/>
  <text x="751" y="348" text-anchor="middle" font-size="10.5" fill="#db2777">Text Feedback + Trace: GEPA</text>

  <rect x="666" y="374" width="170" height="38" rx="9" fill="#ecfeff" stroke="#a5f3fc"/>
  <text x="751" y="398" text-anchor="middle" font-size="10.5" fill="#0891b2">Need Skill Retention: Skill / Reflection</text>

  <!-- Bottom principles -->
  <rect x="66" y="606" width="794" height="48" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="460" y="626" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">Core Principle: Build evaluation first, then optimize; validate at small scale, then scale to real Agent.</text>
  <text x="460" y="644" text-anchor="middle" font-size="10.5" fill="#64748b">Safety rules and output format constraints must be hard rules—not removable by auto-tuning.</text>
</svg>