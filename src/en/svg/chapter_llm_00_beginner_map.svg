  <text x="490" y="54" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="28" font-weight="700" fill="#243B64">A Beginner’s Route into Large Language Models</text>
  <text x="490" y="86" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#5E6D82">Start by using AI, then learn principles and build systems</text>
