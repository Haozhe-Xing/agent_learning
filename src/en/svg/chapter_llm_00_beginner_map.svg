      <text x="585" y="205" fill="#243B64">and cost</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="685" y="145" width="120" height="82" rx="18" fill="#FFFFFF" stroke="#D7E4F5" />
      <text x="745" y="180" fill="#243B64">Choose</text>
      <text x="745" y="205" fill="#243B64">a model</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="845" y="145" width="90" height="82" rx="18" fill="#385FA8" />
      <text x="890" y="180" fill="#FFFFFF">Explore</text>
