<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 620" role="img" aria-labelledby="title desc" font-family="Arial, PingFang SC, sans-serif"><title id="title">From Chunks to Vector Candidates</title><desc id="desc">Distance is not accuracy or relevance probability.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#475569"/></marker></defs><rect width="560" height="620" rx="12" fill="white"/><text x="280" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">From Chunks to Vector Candidates</text><rect x="30" y="65" width="500" height="100" rx="9" fill="#eff6ff" stroke="#64748b"/><text x="280.0" y="93" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Index documents</text><text x="280.0" y="118" text-anchor="middle" font-size="17" font-weight="normal" fill="#1e293b">id / text / source / version</text><text x="280.0" y="143" text-anchor="middle" font-size="17" font-weight="normal" fill="#1e293b">Embedder revision + preprocessing</text><rect x="30" y="200" width="500" height="100" rx="9" fill="#f5f3ff" stroke="#64748b"/><text x="280.0" y="228" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Chroma collection: cosine space</text><text x="280.0" y="253" text-anchor="middle" font-size="17" font-weight="normal" fill="#1e293b">Vectors + text + source/version</text><text x="280.0" y="278" text-anchor="middle" font-size="17" font-weight="normal" fill="#1e293b">No default embedder</text><rect x="30" y="335" width="500" height="82" rx="9" fill="#eff6ff" stroke="#64748b"/><text x="280.0" y="363" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Query: use the same embedder</text><text x="280.0" y="388" text-anchor="middle" font-size="17" font-weight="normal" fill="#1e293b">Query → vector → bounded neighbors</text><rect x="30" y="452" width="500" height="82" rx="9" fill="#ecfdf5" stroke="#64748b"/><text x="280.0" y="480" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Candidate records</text><text x="280.0" y="505" text-anchor="middle" font-size="17" font-weight="normal" fill="#1e293b">ID, source, version, distance</text><path d="M280,165 L280,198" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M280,300 L280,333" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M280,417 L280,450" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="280" y="580" text-anchor="middle" font-size="17" fill="#334155">Distance is not accuracy or relevance probability.</text></svg>
