<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" role="img" aria-labelledby="title desc">
<title id="title">Candidate Skill Lifecycle: Teaching Design</title>
<desc id="desc">Not a Hermes implementation or CLI workflow</desc>
<defs><style>text { font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }</style>
</defs>
<rect width="760" height="480" rx="14" fill="#f0f4f8"/>
<text x="380" y="29" text-anchor="middle" font-size="18" font-weight="bold" fill="#233447">Candidate Skill Lifecycle: Teaching Design</text>
<text x="380" y="52" text-anchor="middle" font-size="12" fill="#526579">Not a Hermes implementation or CLI workflow</text>
<rect x="30" y="90" width="210" height="105" rx="10" fill="#2c3e50"/>
<text x="135" y="118" text-anchor="middle" font-size="14" fill="white" font-weight="bold">① Accepted trajectory</text>
<text x="135" y="143" text-anchor="middle" font-size="11" fill="white">Attribution + coverage + execution</text>
<text x="135" y="168" text-anchor="middle" font-size="11" fill="white">Freeze task / sources / policy</text>
<rect x="275" y="90" width="210" height="105" rx="10" fill="#2980b9"/>
<text x="380" y="118" text-anchor="middle" font-size="14" fill="white" font-weight="bold">② Validate candidate</text>
<text x="380" y="143" text-anchor="middle" font-size="11" fill="white">Bounded JSON + checked references</text>
<text x="380" y="168" text-anchor="middle" font-size="11" fill="white">Model text grants no permissions</text>
<rect x="520" y="90" width="210" height="105" rx="10" fill="#9b59b6"/>
<text x="625" y="118" text-anchor="middle" font-size="14" fill="white" font-weight="bold">③ Quarantine draft</text>
<text x="625" y="143" text-anchor="middle" font-size="11" fill="white">Outside the active loader</text>
<text x="625" y="168" text-anchor="middle" font-size="11" fill="white">Host ID / version / path controls</text>
<rect x="520" y="255" width="210" height="105" rx="10" fill="#237b57"/>
<text x="625" y="283" text-anchor="middle" font-size="14" fill="white" font-weight="bold">④ Independent regression</text>
<text x="625" y="308" text-anchor="middle" font-size="11" fill="white">Same suite: baseline vs candidate</text>
<text x="625" y="333" text-anchor="middle" font-size="11" fill="white">Correctness / denial / scope / budget</text>
<rect x="275" y="255" width="210" height="105" rx="10" fill="#a65a12"/>
<text x="380" y="283" text-anchor="middle" font-size="14" fill="white" font-weight="bold">⑤ Review and decide</text>
<text x="380" y="308" text-anchor="middle" font-size="11" fill="white">Evidence + approval for promotion</text>
<text x="380" y="333" text-anchor="middle" font-size="11" fill="white">Keep / revise / disable / roll back</text>
<line x1="240" y1="142" x2="270" y2="142" stroke="#64748b" stroke-width="2"/><polygon points="270,142 263,138 263,146" fill="#64748b"/>
<line x1="485" y1="142" x2="515" y2="142" stroke="#64748b" stroke-width="2"/><polygon points="515,142 508,138 508,146" fill="#64748b"/>
<line x1="625" y1="195" x2="625" y2="250" stroke="#64748b" stroke-width="2"/><polygon points="625,250 621,243 629,243" fill="#64748b"/>
<line x1="520" y1="307" x2="490" y2="307" stroke="#64748b" stroke-width="2"/><polygon points="490,307 497,303 497,311" fill="#64748b"/>
<line x1="275" y1="307" x2="245" y2="307" stroke="#64748b" stroke-width="2"/><polygon points="245,307 252,303 252,311" fill="#64748b"/>
<rect x="30" y="255" width="210" height="105" rx="10" fill="#e0eee5" stroke="#237b57"/>
<text x="135" y="283" text-anchor="middle" font-size="13" fill="#205238">Approved-version feedback</text>
<text x="135" y="308" text-anchor="middle" font-size="11" fill="#205238">Failures can seed a new candidate</text>
<text x="135" y="333" text-anchor="middle" font-size="11" fill="#205238">Logs alone do not prove a gain</text>
<path d="M135,255 L135,200" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4"/><polygon points="135,200 131,207 139,207" fill="#64748b"/>
<rect x="30" y="390" width="700" height="43" rx="8" fill="#fff0e9" stroke="#c46b3e"/>
<text x="380" y="416" text-anchor="middle" font-size="12" fill="#873a24">Missing or failed conditions: reject, hold, or disable; retain reasons and unfinished work</text>
<text x="380" y="458" text-anchor="middle" font-size="12" fill="#526579">A draft label is not loader isolation; shorter instructions are not measured gains</text>
</svg>
