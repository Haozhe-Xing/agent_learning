<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="860" height="380" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L9,4 z" fill="#4f46e5"/>
    </marker>
  </defs>
  <rect width="860" height="380" rx="18" fill="#f8fafc"/>
  <text x="430" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">What Does Prompt Optimization Actually Optimize?</text>
  <text x="430" y="58" text-anchor="middle" font-size="13" fill="#64748b">Don't change model weights, only change the "manual"—two fundamentally different optimization approaches</text>

  <!-- Left: Model Training -->
  <rect x="30" y="80" width="380" height="270" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="220" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d4ed8">Model Training (Change Weights)</text>

  <rect x="55" y="125" width="330" height="40" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="220" y="150" text-anchor="middle" font-size="12" fill="#1d4ed8">Objective: Adjust model internal params θ</text>

  <rect x="55" y="180" width="330" height="40" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="220" y="205" text-anchor="middle" font-size="12" fill="#1d4ed8">Method: Gradient descent ∂L/∂θ</text>

  <rect x="55" y="235" width="330" height="40" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="220" y="260" text-anchor="middle" font-size="12" fill="#1d4ed8">Cost: GPU × days, millions of samples</text>

  <rect x="55" y="290" width="330" height="40" rx="8" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="220" y="315" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">Effect: Model capability itself changes</text>

  <!-- Right: Prompt Optimization -->
  <rect x="450" y="80" width="380" height="270" rx="14" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="640" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#15803d">Prompt Optimization (Change the Manual)</text>

  <rect x="475" y="125" width="330" height="40" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="640" y="150" text-anchor="middle" font-size="12" fill="#15803d">Objective: Adjust Prompt text P</text>

  <rect x="475" y="180" width="330" height="40" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="640" y="205" text-anchor="middle" font-size="12" fill="#15803d">Method: Text gradient / Evolutionary search</text>

  <rect x="475" y="235" width="330" height="40" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="640" y="260" text-anchor="middle" font-size="12" fill="#15803d">Cost: API call fees, hundreds of samples</text>

  <rect x="475" y="290" width="330" height="40" rx="8" fill="#bbf7d0" stroke="#22c55e" stroke-width="1.5"/>
  <text x="640" y="315" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">Effect: Same model, better performance</text>

  <!-- Middle comparison -->
  <text x="430" y="200" text-anchor="middle" font-size="24" font-weight="bold" fill="#64748b">vs</text>

  <!-- Bottom key difference -->
  <rect x="100" y="362" width="660" height="12" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="430" y="375" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">Analogy: Model training = retrain a student from scratch, Prompt optimization = give the same student clearer textbooks</text>
</svg>