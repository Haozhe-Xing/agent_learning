<svg xmlns="http://www.w3.org/2000/svg" width="920" height="460" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">Reasoning patterns: separate proposals from checks</title>
  <desc id="desc">Four reasoning patterns and the checks each needs.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#64748b" />
    </marker>
  </defs>
  <rect width="920" height="460" fill="#f8fafc" />
  <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="460" y="35" font-size="22" fill="#0f172a" font-weight="bold" text-anchor="middle">Reasoning patterns: separate proposals from checks</text>
    <rect x="24" y="75" width="424" height="122" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" />
    <text x="236.0" y="103" font-size="17" fill="#2563eb" font-weight="bold" text-anchor="middle">Deduction</text>
    <text x="236.0" y="130" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">Derive a conclusion from premises</text>
    <text x="236.0" y="153" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">Check premises and inference</text>
    <rect x="472" y="75" width="424" height="122" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="1.5" />
    <text x="684.0" y="103" font-size="17" fill="#15803d" font-weight="bold" text-anchor="middle">Induction</text>
    <text x="684.0" y="130" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">Propose a pattern from finite samples</text>
    <text x="684.0" y="153" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">Check held-out cases and scope</text>
    <rect x="24" y="218" width="424" height="122" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" />
    <text x="236.0" y="246" font-size="17" fill="#7c3aed" font-weight="bold" text-anchor="middle">Abduction</text>
    <text x="236.0" y="273" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">Propose an explanation for observations</text>
    <text x="236.0" y="296" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">Seek evidence that separates hypotheses</text>
    <rect x="472" y="218" width="424" height="122" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.5" />
    <text x="684.0" y="246" font-size="17" fill="#b45309" font-weight="bold" text-anchor="middle">Analogy</text>
    <text x="684.0" y="273" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">Borrow a candidate from a similar task</text>
    <text x="684.0" y="296" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">Check current constraints and differences</text>
    <rect x="24" y="365" width="872" height="72" rx="9" fill="#e8eef7" />
    <text x="460" y="390" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">These describe problem-solving methods; explanatory text does not reveal internal reasoning.</text>
    <text x="460" y="414" font-size="14" fill="#334155" font-weight="normal" text-anchor="middle">The release-brief exercise checks observable fields, sources and task requirements.</text>
  </g>
</svg>
