<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" width="520" height="260" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6366f1"/>
    </marker>
  </defs>
  <rect width="520" height="260" rx="12" fill="#f8fafc"/>
  <text x="260" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">GraphRAG: Indexing Phase + Query Phase</text>

  <!-- Indexing Phase -->
  <rect x="16" y="44" width="230" height="130" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="131" y="62" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">Indexing Phase (Offline)</text>
  <text x="131" y="78" text-anchor="middle" font-size="10" fill="#3b82f6">① Text chunking → Regular chunks</text>
  <text x="131" y="94" text-anchor="middle" font-size="10" fill="#3b82f6">② LLM extracts entities and relationships</text>
  <text x="131" y="110" text-anchor="middle" font-size="10" fill="#3b82f6">③ Build knowledge graph (entities=nodes, relationships=edges)</text>
  <text x="131" y="126" text-anchor="middle" font-size="10" fill="#3b82f6">④ Leiden algorithm community detection</text>
  <text x="131" y="142" text-anchor="middle" font-size="10" fill="#3b82f6">⑤ Generate descriptive summaries for each community</text>
  <text x="131" y="162" text-anchor="middle" font-size="9" fill="#60a5fa">⚠️ High cost: many LLM calls</text>

  <!-- Query Phase -->
  <rect x="274" y="44" width="230" height="130" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="389" y="62" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">Query Phase (Online)</text>
  <rect x="286" y="70" width="206" height="44" rx="6" fill="#bbf7d0" stroke="#4ade80" stroke-width="1"/>
  <text x="389" y="86" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">Local Search</text>
  <text x="389" y="102" text-anchor="middle" font-size="10" fill="#166534">Start from relevant entities, traverse neighbors</text>
  <text x="389" y="116" text-anchor="middle" font-size="9" fill="#22c55e">Suitable for: specific local questions</text>
  <rect x="286" y="122" width="206" height="44" rx="6" fill="#bbf7d0" stroke="#4ade80" stroke-width="1"/>
  <text x="389" y="138" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">Global Search</text>
  <text x="389" y="154" text-anchor="middle" font-size="10" fill="#166534">Use community summaries (Map-Reduce)</text>
  <text x="389" y="168" text-anchor="middle" font-size="9" fill="#22c55e">Suitable for: global analysis questions</text>

  <!-- Conclusion -->
  <rect x="16" y="188" width="488" height="60" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="260" y="206" text-anchor="middle" font-size="12" font-weight="bold" fill="#3730a3">GraphRAG vs Naive RAG</text>
  <text x="260" y="224" text-anchor="middle" font-size="11" fill="#4338ca">Global questions (requires understanding entire document set): GraphRAG quality improves 30-70%</text>
  <text x="260" y="240" text-anchor="middle" font-size="11" fill="#4338ca">Specific local questions: Naive RAG is sufficient, GraphRAG is too costly</text>
</svg>
