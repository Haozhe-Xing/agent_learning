[book]
authors = ["Agent Learning Team"]
language = "zh-CN"
src = "src/zh"
title = "从零开始学 Agent"

[build]
build-dir = "book/zh"

[preprocessor.readme-links]
command = "python3 tools/readme_links.py"
after = ["index", "links"]
before = ["katex"]
optional = false

[preprocessor.katex]
after = ["links", "index", "readme-links"]
optional = false

[output.html]
mathjax-support = false
default-theme = "light"
preferred-dark-theme = "navy"
additional-css = ["theme/custom.css"]
no-section-label = true
sidebar-header-nav = false
git-repository-url = "https://github.com/Haozhe-Xing/agent_learning"
git-repository-icon = "fab-github"
edit-url-template = "https://github.com/Haozhe-Xing/agent_learning/edit/main/{path}"

[output.html.print]
enable = false
