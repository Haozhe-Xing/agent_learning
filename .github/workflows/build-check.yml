name: Build check

# Catches broken builds on PRs before they reach main /在 PR 合入前拦截构建失败
on:
  pull_request:
    paths:
      - 'src/**'
      - 'examples/**'
      - 'reference-agent/**'
      - 'reference_code/**'
      - 'tools/**'
      - 'theme/**'
      - 'book.toml'
      - 'book-en.toml'
      - '.github/workflows/build-check.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check chapter links and companion paths
        run: python3 tools/check_book.py

      - name: Check learning order and chapter handoffs
        run: |
          python3 tools/check_learning_path.py
          python3 -m unittest discover -s tools/tests -v

      - name: Check Python snippet syntax
        run: python3 tools/check_snippets.py

      - name: Verify companion behavior offline
        run: python3 -m unittest discover -s examples/tests -v

      - name: Verify standalone reference project
        run: python3 -m unittest discover -s reference_code/evidence_assistant/tests -v

      - name: Verify read-only SQL boundary
        run: python3 -m unittest discover -s reference_code/tests -v

      - name: Install mdBook
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          mv mdbook /usr/local/bin/

      - name: Cache cargo bin
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: ${{ runner.os }}-cargo-bin-mdbook-katex-0.10.0

      - name: Install mdbook-katex
        run: |
          if ! mdbook-katex --version 2>/dev/null | grep -q "0.10.0"; then
            cargo install mdbook-katex --version 0.10.0 --locked
          else
            echo "mdbook-katex 0.10.0 already cached"
          fi

      - name: Verify rendered chapter links and math with actual tools
        run: python3 tools/tests/test_rendered_links.py --require-tools

      - name: Build both languages with KaTeX
        run: python3 tools/build_books.py

      - name: Install verified integration dependencies
        run: python3 -m pip install -r examples/requirements.txt

      - name: Run companion entry points with actual dependencies
        run: python3 tools/verify_examples.py --integration

      - name: Verify developer team example
        run: python3 -m pytest examples/dev_team/tests -q
        env:
          PYTHONPATH: examples/dev_team

      - name: Verify actual storage and frameworks
        run: python3 -m pytest examples/integration_tests -q

      - name: Verify reference agent
        run: python3 -m pytest reference-agent/tests -q
        env:
          PYTHONPATH: reference-agent/src

      - name: Check SUMMARY parity (zh vs en)
        run: |
          zh=$(grep -cE '^\s*-\s*\[' src/zh/SUMMARY.md)
          en=$(grep -cE '^\s*-\s*\[' src/en/SUMMARY.md)
          echo "SUMMARY entries — zh: $zh, en: $en"
          if [ "$zh" -ne "$en" ]; then
            echo "::error::SUMMARY.md entry count differs (zh=$zh, en=$en). Add new pages to BOTH languages."
            exit 1
          fi

      - name: Check for missing images
        run: |
          fail=0
          for lang in zh en; do
            # Collect every ../svg/... reference used by that language's markdown
            grep -roh '\.\./svg/[A-Za-z0-9._-]*' "src/$lang" --include='*.md' 2>/dev/null \
              | sort -u | sed 's|\.\./svg/||' > "/tmp/refs_$lang.txt"
            while read -r img; do
              [ -z "$img" ] && continue
              if [ ! -f "src/$lang/svg/$img" ]; then
                echo "::warning::[$lang] missing image: src/$lang/svg/$img"
                fail=1
              fi
            done < "/tmp/refs_$lang.txt"
          done
          [ "$fail" -eq 0 ] && echo "All referenced images resolve." || true
