name: Deploy mdBook to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mdBook
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          mv mdbook /usr/local/bin/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache cargo bin
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: ${{ runner.os }}-cargo-bin-mdbook-katex-0.10.0

      - name: Install mdbook-katex
        run: |
          if ! mdbook-katex --version 2>/dev/null | grep -q "0.10.0"; then
            cargo install mdbook-katex --version 0.10.0 --locked
          else
            echo "mdbook-katex 0.10.0 already cached"
          fi

      - name: Verify rendered chapter links and math with actual tools
        run: python3 tools/tests/test_rendered_links.py --require-tools

      - name: Build both languages with KaTeX
        run: |
          python3 tools/check_book.py
          python3 tools/check_learning_path.py
          python3 tools/build_books.py
          cp root-index.html ./book/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
